<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>掉落物查詢系統</title>
<style>
  :root{
    --bg1:#14161c; --bg2:#1b1e27; --bg3:#242833; --bg4:#2c3140;
    --border:#333a4a; --text:#e8eaf0; --text3:#8890a0;
    --accent:#4d8dff; --legend:#ffb545; --relic:#5ec8ff; --ok:#3ecf6e;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--bg1); color:var(--text);
    font-family:"Microsoft JhengHei","PingFang TC",-apple-system,BlinkMacSystemFont,sans-serif;
    display:flex; justify-content:center; padding:28px 14px;
  }
  .wrap{ width:100%; max-width:820px; }
  h1{ font-size:20px; margin:0 0 4px; }
  .sub{ color:var(--text3); font-size:13px; margin:0 0 20px; }

  .tabs{ display:flex; gap:8px; margin-bottom:14px; }
  .tab{
    flex:1; text-align:center; padding:10px; border-radius:10px; cursor:pointer;
    background:var(--bg2); border:1px solid var(--border); color:var(--text3); font-weight:bold; font-size:14px;
  }
  .tab.active{ background:var(--accent); color:#fff; border-color:var(--accent); }

  .searchBox{ position:relative; margin-bottom:6px; }
  input[type=text]{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--bg2); color:var(--text); font-size:15px;
  }
  input[type=text]:focus{ outline:none; border-color:var(--accent); }

  .suggest{
    position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:5;
    background:var(--bg3); border:1px solid var(--border); border-radius:10px;
    max-height:260px; overflow-y:auto; display:none;
  }
  .suggest.show{ display:block; }
  .suggest .opt{ padding:9px 14px; cursor:pointer; font-size:14px; border-bottom:1px solid var(--border); }
  .suggest .opt:last-child{ border-bottom:none; }
  .suggest .opt:hover, .suggest .opt.hi{ background:var(--bg4); }
  .suggest .opt .id{ color:var(--text3); font-size:11px; margin-left:6px; }

  .count{ color:var(--text3); font-size:12px; margin:4px 2px 18px; }

  .resultTitle{ font-size:16px; font-weight:bold; margin:10px 0 10px; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; padding:8px 10px; color:var(--text3); border-bottom:1px solid var(--border); font-weight:normal; }
  td{ padding:8px 10px; border-bottom:1px solid var(--border); }
  tr:hover td{ background:var(--bg2); }
  .rate{ font-family:monospace; color:var(--ok); white-space:nowrap; }
  .legendName{ color:var(--legend); font-weight:bold; }
  .relicTag{ display:inline-block; font-size:10px; color:var(--relic); border:1px solid var(--relic); border-radius:4px; padding:0 4px; margin-left:6px; }
  .idText{ color:var(--text3); font-size:11px; }
  .empty{ color:var(--text3); font-size:13px; padding:20px 4px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📦 掉落物查詢系統</h1>
  <p class="sub">資料來源：存檔編輯工具內建的物品資料庫（ITEM_DB）＋怪物掉落表（MOB_DROPS）。</p>

  <div class="tabs">
    <div class="tab active" id="tabMob" onclick="switchTab('mob')">🐗 怪物 → 掉落物</div>
    <div class="tab" id="tabItem" onclick="switchTab('item')">🎯 道具 → 掉落來源</div>
  </div>

  <div class="searchBox">
    <input type="text" id="searchInput" placeholder="輸入怪物名稱關鍵字…" autocomplete="off">
    <div class="suggest" id="suggest"></div>
  </div>
  <div class="count" id="countInfo"></div>

  <div id="resultArea"></div>
</div>

<script>

// ════════════════════════════════════════════════
//  建立反查索引：道具ID → [{mob, rate}, ...]
// ════════════════════════════════════════════════
const ITEM_DROP_SOURCES = {};
Object.entries(MOB_DROPS).forEach(([mob, list]) => {
  (list || []).forEach(entry => {
    const itemId = entry[0], rate = entry[1];
    (ITEM_DROP_SOURCES[itemId] = ITEM_DROP_SOURCES[itemId] || []).push({ mob, rate });
  });
});

const MOB_NAMES = Object.keys(MOB_DROPS);
const ITEM_LIST = Object.entries(ITEM_DB).map(([id, d]) => ({ id, n: d.n || id }));

let curTab = 'mob';   // 'mob' | 'item'
let curSelection = null;

const searchInput = document.getElementById('searchInput');
const suggestBox  = document.getElementById('suggest');
const resultArea  = document.getElementById('resultArea');
const countInfo   = document.getElementById('countInfo');

function switchTab(tab){
  curTab = tab;
  curSelection = null;
  document.getElementById('tabMob').classList.toggle('active', tab === 'mob');
  document.getElementById('tabItem').classList.toggle('active', tab === 'item');
  searchInput.placeholder = tab === 'mob' ? '輸入怪物名稱關鍵字…' : '輸入道具名稱或ID關鍵字…';
  searchInput.value = '';
  suggestBox.classList.remove('show');
  resultArea.innerHTML = '';
  updateCountInfo();
}

function updateCountInfo(){
  if(curTab === 'mob'){
    countInfo.textContent = `共 ${MOB_NAMES.length} 隻怪物有掉落紀錄`;
  } else {
    countInfo.textContent = `物品資料庫共 ${ITEM_LIST.length} 件（其中 ${Object.keys(ITEM_DROP_SOURCES).length} 件有怪物掉落紀錄）`;
  }
}

function itemDisplay(id){
  const d = ITEM_DB[id];
  const name = d ? (d.n || id) : id;
  const cls  = d && d.legend ? 'legendName' : '';
  const relicTag = d && d.relic ? '<span class="relicTag">遺物</span>' : '';
  return { name, cls, relicTag };
}

function renderSuggest(matches, getLabel, onPick){
  if(!matches.length){ suggestBox.classList.remove('show'); return; }
  suggestBox.innerHTML = matches.slice(0, 40).map((m, i) => {
    const label = getLabel(m);
    return `<div class="opt" data-i="${i}">${label}</div>`;
  }).join('');
  suggestBox.classList.add('show');
  Array.from(suggestBox.children).forEach((el, i) => {
    el.addEventListener('click', () => onPick(matches[i]));
  });
}

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  if(!q){ suggestBox.classList.remove('show'); return; }

  if(curTab === 'mob'){
    const matches = MOB_NAMES.filter(n => n.includes(q));
    renderSuggest(matches, n => n, (n) => {
      searchInput.value = n;
      suggestBox.classList.remove('show');
      showMobDrops(n);
    });
  } else {
    const ql = q.toLowerCase();
    const matches = ITEM_LIST.filter(it => it.n.toLowerCase().includes(ql) || it.id.toLowerCase().includes(ql));
    renderSuggest(matches, it => `${it.n} <span class="id">${it.id}</span>`, (it) => {
      searchInput.value = it.n;
      suggestBox.classList.remove('show');
      showItemSources(it.id);
    });
  }
});

document.addEventListener('click', (e) => {
  if(!suggestBox.contains(e.target) && e.target !== searchInput){
    suggestBox.classList.remove('show');
  }
});

function showMobDrops(mobName){
  const list = MOB_DROPS[mobName];
  if(!list || !list.length){
    resultArea.innerHTML = `<div class="empty">「${mobName}」目前沒有掉落紀錄。</div>`;
    return;
  }
  const sorted = list.slice().sort((a, b) => b[1] - a[1]);
  resultArea.innerHTML = `
    <div class="resultTitle">🐗 ${mobName}　共 ${sorted.length} 項掉落</div>
    <table>
      <thead><tr><th>物品</th><th>ID</th><th>機率</th></tr></thead>
      <tbody>
        ${sorted.map(([id, rate]) => {
          const { name, cls, relicTag } = itemDisplay(id);
          return `<tr>
            <td class="${cls}">${name}${relicTag}</td>
            <td class="idText">${id}</td>
            <td class="rate">${rate}%</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

function showItemSources(itemId){
  const sources = ITEM_DROP_SOURCES[itemId];
  const { name, relicTag } = itemDisplay(itemId);
  if(!sources || !sources.length){
    resultArea.innerHTML = `
      <div class="resultTitle">🎯 ${name}${relicTag}</div>
      <div class="empty">查無怪物掉落紀錄，可能是透過商店購買、任務獎勵、合成、活動或其他管道取得。</div>`;
    return;
  }
  const sorted = sources.slice().sort((a, b) => b.rate - a.rate);
  resultArea.innerHTML = `
    <div class="resultTitle">🎯 ${name}${relicTag}　共 ${sorted.length} 個掉落來源</div>
    <table>
      <thead><tr><th>怪物</th><th>機率</th></tr></thead>
      <tbody>
        ${sorted.map(s => `<tr><td>${s.mob}</td><td class="rate">${s.rate}%</td></tr>`).join('')}
      </tbody>
    </table>`;
}

updateCountInfo();

</script>
