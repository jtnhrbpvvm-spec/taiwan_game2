<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>網頁遊戲存檔功能注入器_V2</title>
<style>
body{font-family:Arial,sans-serif;max-width:1000px;margin:auto;padding:20px}
button{padding:10px 16px;margin:5px}
#log{border:1px solid #ccc;padding:10px;height:250px;overflow:auto;white-space:pre-wrap}
</style>
</head>
<body>
<h1>網頁遊戲存檔功能注入器 V2（lineageIdleSave 專用）</h1>

<input type="file" id="fileInput" accept=".html">
<button onclick="inject()">開始修改</button>
<button id="downloadBtn" disabled>下載修改版</button>

<div id="log"></div>

<script>
let modifiedHtml="";
let originalName="";

function log(msg){
 document.getElementById("log").textContent += msg + "\\n";
}

function buildInjection(){
return `
<style>
#saveToolsWrap{
position:fixed;
top:10px;
right:10px;
z-index:999999;
}
#saveToolsMenu{
display:none;
background:#fff;
border:1px solid #ccc;
padding:8px;
box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.saveToolBtn{
background:#ffffff;
color:#000000;
border:2px solid #444;
border-radius:6px;
padding:8px 12px;
font-weight:bold;
cursor:pointer;
margin:3px;
}
</style>

<div id="saveToolsWrap">
<button id="saveToolsToggle">💾</button>
<div id="saveToolsMenu">
<button id="exportSaveBtn" class="saveToolBtn">匯出存檔</button>
<button id="importSaveBtn" class="saveToolBtn">匯入存檔</button>
<input type="file" id="importSaveFile" accept=".json" style="display:none">
</div>
</div>

<script>
(function(){

const SAVE_KEY='lineageIdleSave';

document.getElementById('saveToolsToggle')
.addEventListener('click',()=>{
 const menu=document.getElementById('saveToolsMenu');
 menu.style.display=(menu.style.display==='block')?'none':'block';
});

function exportSave(){

 const raw=localStorage.getItem(SAVE_KEY);

 if(!raw){
   alert('找不到 '+SAVE_KEY+' 存檔');
   return;
 }

 const data={
   saveKey:SAVE_KEY,
   saveData:JSON.parse(raw)
 };

 const blob=new Blob(
   [JSON.stringify(data,null,2)],
   {type:'application/json'}
 );

 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='lineageIdleSave.json';
 a.click();
}

function importSave(data){

 if(!data.saveData){
   alert('存檔格式錯誤');
   return;
 }

 localStorage.setItem(
   SAVE_KEY,
   JSON.stringify(data.saveData)
 );

 if(confirm('匯入檔案完成！\\n\\n按下確定後將重新整理網頁。')){
   setTimeout(()=>location.reload(),300);
 }
}

document.getElementById('exportSaveBtn')
.addEventListener('click',exportSave);

document.getElementById('importSaveBtn')
.addEventListener('click',()=>{
 document.getElementById('importSaveFile').click();
});

document.getElementById('importSaveFile')
.addEventListener('change',(e)=>{

 const file=e.target.files[0];
 if(!file) return;

 const reader=new FileReader();

 reader.onload=()=>{
   try{
      importSave(JSON.parse(reader.result));
   }catch(err){
      alert('JSON格式錯誤');
   }
 };

 reader.readAsText(file);
});

})();
<\/script>
`;
}

async function inject(){
 const file=document.getElementById('fileInput').files[0];
 if(!file){alert('請選擇HTML');return;}

 originalName=file.name;
 let html=await file.text();

 const code=buildInjection();

 if(html.includes('</body>')){
   html=html.replace('</body>', code + '\\n</body>');
 }else{
   html += code;
 }

 modifiedHtml=html;
 document.getElementById('downloadBtn').disabled=false;
 log('注入完成');
}

document.getElementById('downloadBtn').addEventListener('click',()=>{
 const blob=new Blob([modifiedHtml],{type:'text/html'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download=originalName.replace('.html','_存檔版V2.html');
 a.click();
});
</script>
</body>
</html>
