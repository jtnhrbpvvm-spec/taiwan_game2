<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob:; style-src 'self' 'unsafe-inline'" />
    <title>放置希望桌寵</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none; }
      #pet { position: absolute; left: 0; top: 0; will-change: transform; transition: opacity 0.2s; }
      body.focus #pet { opacity: 0.5; }
      #bubble {
        position: absolute; left: 0; top: 0; padding: 4px 10px; border-radius: 10px;
        font: 13px/1.4 "Microsoft JhengHei", sans-serif; color: #4a3a22; white-space: nowrap;
        background: #fff8e6; border: 1px solid #c9b182; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
        opacity: 0; transition: opacity 0.15s; pointer-events: none; z-index: 2;
      }
      #bubble.on { opacity: 1; }
      #bubble small { display: block; font-size: 12px; color: #86704a; }
      /* 桌寵開口說話的對話框（黑店優惠提醒）：比滑鼠移上去的提示框大，底下有個小尖角，停留十幾秒 */
      #speech {
        position: absolute; left: 0; top: 0; padding: 8px 14px; border-radius: 14px; z-index: 4;
        font: bold 15px/1.4 "Microsoft JhengHei", sans-serif; color: #4a3a22; white-space: nowrap;
        background: #fff8e6; border: 2px solid #b7791f; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
        opacity: 0; transition: opacity 0.25s; pointer-events: none;
      }
      #speech.on { opacity: 1; }
      #speech::after {
        content: ""; position: absolute; left: 50%; bottom: -8px; width: 12px; height: 12px; margin-left: -7px;
        background: #fff8e6; border: solid #b7791f; border-width: 0 2px 2px 0; rotate: 45deg;
      }
      /* 桌寵問問題的對話框（例如新版下載好了要不要重啟）：跟說話的對話框同一個樣子，多兩顆按鈕 */
      #ask {
        position: absolute; left: 0; top: 0; display: none; padding: 10px 14px; border-radius: 14px; z-index: 5;
        font: bold 15px/1.4 "Microsoft JhengHei", sans-serif; color: #4a3a22; white-space: nowrap;
        background: #fff8e6; border: 2px solid #b7791f; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
      }
      #ask.on { display: block; }
      #ask::after {
        content: ""; position: absolute; left: 50%; bottom: -8px; width: 12px; height: 12px; margin-left: -7px;
        background: #fff8e6; border: solid #b7791f; border-width: 0 2px 2px 0; rotate: 45deg;
      }
      #ask div { display: flex; justify-content: center; gap: 10px; margin-top: 8px; }
      #ask button { font: inherit; font-size: 14px; border-radius: 8px; padding: 3px 14px; cursor: pointer; border: 1px solid #c9b182; background: #fff; color: #4a3a22; }
      #ask button.primary { border-color: #2f7d86; background: #2f7d86; color: #fff; }
      /* 調整大小的小面板：從右鍵選單叫出來，浮在桌寵頭上 */
      #sizer {
        position: absolute; left: 0; top: 0; display: none; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px;
        font: 13px/1.4 "Microsoft JhengHei", sans-serif; color: #4a3a22; white-space: nowrap; z-index: 3;
        background: #fff8e6; border: 1px solid #c9b182; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      }
      #sizer.on { display: flex; }
      #sizer input { width: 150px; accent-color: #2f7d86; }
      #sizer output { width: 3em; text-align: right; font-variant-numeric: tabular-nums; }
      #sizer button { font: inherit; color: #fff; background: #2f7d86; border: 0; border-radius: 6px; padding: 2px 10px; cursor: pointer; }
      /* 從桌寵頭上冒出來往上飄的字跟圖示：經驗、金錢、掉寶、愛心 */
      .floater {
        position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 4px;
        font: bold 14px/1 "Microsoft JhengHei", sans-serif; color: #fff; white-space: nowrap; pointer-events: none;
        text-shadow: 0 0 3px #3a2a12, 0 1px 2px #3a2a12, 0 0 6px #3a2a12;
        animation: float-up 2.2s linear forwards;
      }
      .floater.exp { color: #b9f2a1; }
      .floater.gold { color: #ffe27a; }
      .floater.levelup { color: #ffd34d; font-size: 20px; }
      .floater.hint { font-size: 13px; font-weight: normal; animation-duration: 5s; }
      .floater.heart { color: #ff7d9c; font-size: 20px; animation-duration: 1.2s; }
      .floater i { width: 24px; height: 24px; background-repeat: no-repeat; image-rendering: pixelated; }
      @keyframes float-up {
        from { opacity: 0; translate: 0 8px; }
        15% { opacity: 1; }
        70% { opacity: 1; }
        to { opacity: 0; translate: 0 -130px; }
      }
    </style>
  </head>
  <body>
    <canvas id="pet"></canvas>
    <div id="bubble"></div>
    <div id="speech"></div>
    <div id="ask">
      <span id="ask-text"></span>
      <div><button id="ask-yes" class="primary" type="button"></button><button id="ask-no" type="button"></button></div>
    </div>
    <div id="sizer">
      <span>大小</span>
      <input id="sizer-range" type="range" step="5" />
      <output id="sizer-value"></output>
      <button id="sizer-done" type="button">完成</button>
    </div>
    <script src="pet.js"></script>
  </body>
</html>
