<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob:; style-src 'self' 'unsafe-inline'" />
    <title>選擇桌寵外觀</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body { display: flex; flex-direction: column; font: 14px/1.5 "Microsoft JhengHei", sans-serif; color: #4a3a22; background: #eee0c5; }
      header { padding: 12px; display: grid; gap: 8px; border-bottom: 1px solid #c9b182; background: #fff8e6; }
      input[type="search"] { font: inherit; padding: 6px 10px; border: 1px solid #c9b182; border-radius: 8px; background: #fff; color: inherit; }
      #follow { font: inherit; padding: 8px 10px; border: 1px solid #c9b182; border-radius: 8px; background: #fff; color: inherit; cursor: pointer; text-align: left; }
      #follow small { display: block; color: #86704a; }
      #list { flex: 1; overflow-y: auto; padding: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; align-content: start; }
      .card { display: grid; justify-items: center; gap: 2px; padding: 6px 4px; border: 1px solid #c9b182; border-radius: 10px; background: #fff8e6; cursor: pointer; font: inherit; color: inherit; }
      .card canvas { width: 80px; height: 80px; }
      .card span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
      .card small { color: #86704a; font-size: 11px; }
      .card:hover, #follow:hover { border-color: #2f7d86; }
      .on { border-color: #2f7d86 !important; box-shadow: 0 0 0 2px #2f7d86 inset; }
      .card.missing { opacity: 0.4; cursor: default; }
      #empty { padding: 24px; text-align: center; color: #86704a; }
    </style>
  </head>
  <body>
    <header>
      <button id="follow" type="button">跟著目前在打的怪物<small>預設。換地方掛機，桌寵也跟著換</small></button>
      <input id="search" type="search" placeholder="搜尋怪物或戰寵名稱" autofocus />
    </header>
    <div id="list"></div>
    <div id="empty" hidden>找不到符合的角色</div>
    <script src="picker.js"></script>
  </body>
</html>
