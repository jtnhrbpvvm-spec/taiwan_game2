<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>希望圖鑑・掉落查詢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 配色跟遊戲本體一致（取自遊戲 index.css 的 :root）：奶油羊皮紙面板、棕色描邊、藍綠色主按鈕。
   變數名稱沿用舊版（--ink/--panel/--gold...），希望/app.js 裡的樣式都是讀這些變數，不用跟著改。 */
:root{
  color-scheme:light only;
  --ink:#eee0c5;          /* 頁面底色（遊戲 --bg） */
  --ink-2:#f6ead2;        /* 輸入框／數值格的內凹底色 */
  --panel:#f8efdd;        /* 面板（遊戲 --panel） */
  --panel-hi:#f3ddb2;     /* 選取／滑過（遊戲 --panel-sel） */
  --line:#dcc7a0;
  --line-hi:#a28358;      /* 遊戲 --border-hi */
  --gold:#8d6a30;         /* 標題色（遊戲 --accent-deep） */
  --gold-hi:#6b4d17;      /* 強調數值（遊戲 --accent-ink） */
  --text:#45301f;
  --text-dim:#725c46;
  --text-faint:#8a735b;

  --btn-top:#fff7e6;
  --btn-bottom:#edd4a4;
  --btn-edge:#6b4a2a;
  --btn-sunk-top:#f5e1bd;
  --btn-sunk-bottom:#fbeed3;
  --go:#2f6b78;
  --go-lift:#377986;
  --go-sink:#245663;
  --good:#1f6a47;
  --radius:14px;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.08);

  /* 屬性色：沿用遊戲的深色版本，放在淺色底上才看得清楚 */
  --el-fire:#9e3b18;
  --el-water:#175a8f;
  --el-earth:#6d4423;
  --el-tree:#27601f;
  --el-dark:#54329c;
  --el-sun:#6b5200;
  --el-steel:#3f4a5a;
  --el-physical:#8a4f16;
  --el-magical:#3d4f9e;
  --el-none:#6b6258;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  touch-action: manipulation;
  background:var(--ink);
  color:var(--text);
  font-family:"Noto Sans TC", system-ui, "PingFang TC", "Microsoft JhengHei", sans-serif;
  min-height:100vh;
  line-height:1.55;
}
/* 遊戲村莊畫面的背景：城鎮插圖＋一層淡淡的奶油色紗，讓上面的面板文字好讀 */
body::before{
  content:""; position:fixed; inset:0; z-index:-1;
  background:
    linear-gradient(rgba(238,224,197,.55), rgba(238,224,197,.78)),
    url("希望/town-bg.webp") center / cover no-repeat,
    radial-gradient(ellipse 900px 520px at 20% 0%, #f8efdd 0%, transparent 65%),
    var(--ink);
}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 80px;}

/* ---------- 共用：遊戲風格按鈕、輸入框 ---------- */
.game-btn, .hint-chip{
  background:linear-gradient(180deg, var(--btn-top) 0%, #f6e5c3 52%, var(--btn-bottom) 100%);
  border:2px solid var(--btn-edge);
  color:var(--text);
  font:inherit;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.85), inset 0 -4px 7px rgba(0,0,0,.13), 0 2px 0 #4a3119, 0 4px 9px rgba(0,0,0,.16);
  border-radius:10px;
  cursor:pointer;
  transition:transform .06s, box-shadow .06s;
}
.game-btn:active, .hint-chip:active{
  background:linear-gradient(180deg, var(--btn-sunk-top), var(--btn-sunk-bottom));
  box-shadow:inset 0 4px 9px rgba(0,0,0,.3);
  transform:translateY(2px);
}
.hint-chip{font-size:13px; padding:5px 12px; color:var(--text); border-radius:999px;}
.hint-chip:hover{border-color:var(--gold); color:var(--gold-hi);}

.field-input{
  background:var(--ink-2); color:var(--text);
  border:2px solid var(--line-hi); border-radius:10px;
  box-shadow:inset 0 3px 6px rgba(0,0,0,.10);
  font-family:inherit; outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.field-input:focus{border-color:var(--go); box-shadow:inset 0 3px 6px rgba(0,0,0,.10), 0 0 0 3px rgba(47,107,120,.18);}

/* ---------- Header ---------- */
.hero{
  position:relative;
  padding:26px 24px 22px;
  border:1px solid rgba(162,131,88,.55);
  border-radius:var(--radius);
  background:rgba(248,239,221,.93);
  box-shadow:var(--shadow);
  margin-bottom:18px;
}
.hero::before{
  /* 標題列上緣一條遊戲 HUD 那種藍綠色飾條 */
  content:""; position:absolute; left:18px; right:18px; top:0; height:4px;
  border-radius:0 0 4px 4px;
  background:linear-gradient(90deg, var(--go-sink), var(--go-lift), var(--go-sink));
  opacity:.85;
}
.hero .eyebrow{
  font-size:12px; letter-spacing:.28em; color:var(--gold);
  text-transform:uppercase; font-weight:700; margin-bottom:8px;
}
.hero h1{
  font-family:"Noto Serif TC", serif;
  font-weight:900;
  font-size:clamp(26px, 4vw, 38px);
  margin:0 0 8px;
  color:var(--text);
  letter-spacing:.02em;
  text-shadow:0 1px 0 rgba(255,255,255,.7);
}
.hero h1 span{color:var(--go);}
.hero p{
  margin:0; color:var(--text-dim); font-size:14.5px; max-width:58ch; line-height:1.7;
}

/* ---------- Search ---------- */
.search-row{
  display:flex; gap:12px; align-items:flex-end; margin-top:18px; flex-wrap:wrap;
}
.search-row .search-box{margin-top:0; flex:1; min-width:220px;}
.level-field{display:flex; flex-direction:column; gap:5px;}
.level-field label{
  font-size:11.5px; color:var(--text-dim); letter-spacing:.03em; white-space:nowrap;
}
.level-field input{
  background:var(--ink-2); color:var(--text); border:2px solid var(--line-hi); border-radius:10px;
  box-shadow:inset 0 3px 6px rgba(0,0,0,.10);
  padding:9px 10px; font-size:14px; font-family:inherit; width:140px; outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.level-field input:focus{
  border-color:var(--go); box-shadow:inset 0 3px 6px rgba(0,0,0,.10), 0 0 0 3px rgba(47,107,120,.18);
}
.search-box{
  position:relative;
}
.search-category{
  background:linear-gradient(180deg, var(--btn-top), var(--btn-bottom));
  color:var(--text); border:2px solid var(--btn-edge); border-radius:10px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.85), 0 2px 0 #4a3119;
  padding:13px 10px; font-size:14px; font-family:inherit; min-width:140px; outline:none; cursor:pointer;
}
.search-category:focus{border-color:var(--go);}
.ability-only-toggle{
  display:flex; align-items:center; gap:6px; white-space:nowrap; cursor:pointer;
  font-size:13.5px; color:var(--text-dim); padding:13px 12px; border:2px solid var(--line-hi);
  border-radius:10px; background:var(--ink-2); user-select:none;
}
.ability-only-toggle:has(input:checked){border-color:var(--go); color:var(--go); background:#e3eef0;}
.ability-only-toggle input{width:16px; height:16px; accent-color:var(--go); margin:0;}
.obtainable-toggle{
  display:inline-flex; align-items:center; gap:6px; cursor:pointer; user-select:none;
  font-size:12.5px; color:var(--text-dim); margin:-4px 0 10px;
}
.obtainable-toggle:has(input:checked){color:var(--go);}
.obtainable-toggle input{width:15px; height:15px; accent-color:var(--go); margin:0;}
.search-box input{
  width:100%;
  font-size:17px;
  padding:13px 20px 13px 44px;
  border-radius:10px;
  border:2px solid var(--line-hi);
  background:var(--ink-2);
  box-shadow:inset 0 3px 6px rgba(0,0,0,.10);
  color:var(--text);
  font-family:inherit;
  outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.search-box input::placeholder{color:var(--text-faint);}
.search-box input:focus{
  border-color:var(--go);
  box-shadow:inset 0 3px 6px rgba(0,0,0,.10), 0 0 0 3px rgba(47,107,120,.18);
}
.search-box .icon{
  position:absolute; left:16px; top:50%; transform:translateY(-50%);
  color:var(--text-dim); font-size:17px; pointer-events:none;
}
.hint-row{
  display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;
}
.equip-filter{
  margin-top:16px; padding:12px 14px; background:rgba(225,205,167,.35); border:1px solid rgba(162,131,88,.4);
  border-radius:12px; display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;
}
.equip-filter .ef-field{display:flex; flex-direction:column; gap:5px;}
.equip-filter label{font-size:11.5px; color:var(--text-dim); letter-spacing:.03em;}
.equip-filter select{
  background:var(--ink-2); color:var(--text); border:2px solid var(--line-hi); border-radius:10px;
  padding:8px 10px; font-size:13.5px; font-family:inherit;
}
.equip-filter select:disabled{opacity:.45; cursor:not-allowed;}
.equip-filter .ef-short select{width:150px;}
.equip-filter .ef-long{flex:1; min-width:220px;}
.equip-filter .ef-long select{width:100%;}

/* ---------- Result columns ---------- */
.cols{
  display:grid; grid-template-columns:340px 1fr; gap:16px; margin-top:4px;
  align-items:start;
}
@media (max-width:820px){ .cols{grid-template-columns:1fr;} }
/* 寬表格左右滑動的提示：只有單欄（手機）版面才顯示 */
.swipe-hint{display:none; font-size:11.5px; color:var(--text-faint); margin:0 0 6px;}
@media (max-width:820px){ .swipe-hint{display:block;} }
/* grid 子項預設 min-width:auto，寬表格會把整欄撐開造成手機整頁左右溢出；設 0 讓表格外層的 overflow-x 自己捲動 */
.cols > *{min-width:0;}
/* 委託任務：桌機顯示完整表格，手機只顯示接取 NPC＋等級／名聲，點開看詳細 */
.cm-mobile{display:none;}
/* 表格裡的物品標籤窄螢幕換行時不要被拆成兩半互相重疊 */
td .map-chip{display:inline-block;}
/* 數值格：展開成完整數字時太長就換行，不要凸出框外；縮寫的數字加虛線底線提示可以點 */
.equip-stat-grid div, .stat-tile .v{overflow-wrap:anywhere; min-width:0;}
.num-abbr{cursor:pointer; border-bottom:1px dotted currentColor;}
@media (max-width:640px){ .cm-desktop{display:none;} .cm-mobile{display:block;} }

.panel{
  background:rgba(248,239,221,.93);
  border:1px solid rgba(162,131,88,.5);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:14px 16px;
}
.panel h2{
  font-size:15px; letter-spacing:.06em;
  color:var(--text); margin:-14px -16px 12px; padding:10px 16px;
  font-weight:700;
  display:flex; align-items:center; gap:8px;
  background:linear-gradient(180deg, rgba(255,247,230,.9), rgba(237,212,164,.55));
  border-bottom:1px solid rgba(162,131,88,.45);
  border-radius:var(--radius) var(--radius) 0 0;
}
.panel h2 .count{
  letter-spacing:0; color:var(--text-dim); font-weight:400; font-size:12px;
}
.result-list{list-style:none; margin:0 -4px; padding:0 4px; max-height:540px; overflow-y:auto;}
.result-list::-webkit-scrollbar{width:8px;}
.result-list::-webkit-scrollbar-thumb{background:var(--line-hi); border-radius:4px;}
.result-list::-webkit-scrollbar-track{background:rgba(162,131,88,.12); border-radius:4px;}

.result-item{
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding:9px 11px; border-radius:10px; cursor:pointer;
  border:1px solid rgba(162,131,88,.35);
  background:rgba(255,250,240,.7);
  margin-bottom:5px;
}
.result-item:nth-child(even){background:rgba(241,227,199,.55);}
.result-item:hover{background:var(--panel-hi); border-color:var(--line-hi);}
.result-item.active{background:var(--panel-hi); border-color:var(--go); box-shadow:inset 0 0 0 1px var(--go);}
.result-item .rname{font-weight:500; font-size:14.5px;}
.result-item .rmeta{font-size:12px; color:var(--text-faint); white-space:nowrap;}

.empty-note{color:var(--text-faint); font-size:13.5px; padding:20px 6px; line-height:1.8;}

/* ---------- Detail panel ---------- */
.detail{min-height:200px;}
.detail-head{
  display:flex; justify-content:space-between; align-items:flex-start; gap:14px;
  padding-bottom:14px; margin-bottom:16px; border-bottom:1px dashed rgba(162,131,88,.6);
}
.detail-title{font-family:"Noto Serif TC", serif; font-size:24px; font-weight:700; color:var(--text);}
.detail-sub{color:var(--text-dim); font-size:13px; margin-top:4px;}
.badge{
  display:inline-flex; align-items:center; gap:5px;
  font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px;
  border:1px solid var(--line-hi); color:var(--text-dim); background:rgba(255,250,240,.7);
}
.badge.tag-harvest{color:var(--good); border-color:#7fa86a; background:rgba(127,168,106,.14);}
.badge-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}

.el-chip{
  display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700;
  padding:2px 10px; border-radius:999px; border:1px solid currentColor; background:rgba(255,255,255,.55);
}

.stat-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(96px,1fr));
  gap:8px; margin-bottom:22px;
}
.stat-tile{
  background:var(--ink-2); border:1px solid rgba(162,131,88,.45); border-radius:10px;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.06);
  padding:9px 12px;
}
.stat-tile .v{font-size:17px; font-weight:700; color:var(--gold-hi); font-variant-numeric:tabular-nums;}
.stat-tile .k{font-size:11px; color:var(--text-faint); margin-top:2px;}

.section-title{
  font-size:13.5px; letter-spacing:.05em; color:var(--gold);
  font-weight:700; margin:22px 0 10px; display:flex; align-items:center; gap:8px;
}
.section-title::before{
  content:""; width:4px; height:14px; border-radius:2px; background:var(--go); flex:none;
}
.section-title .count{color:var(--text-faint); font-weight:400; letter-spacing:0;}

.map-chip-row{display:flex; flex-wrap:wrap; gap:8px;}
.map-chip{
  font-size:13px; padding:5px 12px; border-radius:999px;
  background:linear-gradient(180deg, var(--btn-top), var(--btn-bottom));
  border:1px solid var(--line-hi); color:var(--text); cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 1px 0 rgba(107,74,42,.35);
}
.map-chip:hover{border-color:var(--go); color:var(--go);}

table.dtable{width:100%; border-collapse:separate; border-spacing:0; font-size:13.5px;
  background:rgba(255,250,240,.55); border:1px solid rgba(162,131,88,.4); border-radius:10px; overflow:hidden;}
table.dtable th{
  text-align:left; font-size:11.5px; letter-spacing:.04em;
  color:var(--text-dim); font-weight:700; padding:8px 10px;
  background:rgba(225,205,167,.6); border-bottom:1px solid rgba(162,131,88,.5);
}
table.dtable td{padding:8px 10px; border-bottom:1px solid rgba(162,131,88,.2); vertical-align:middle;}
table.dtable tr:last-child td{border-bottom:none;}
table.dtable tbody tr:nth-child(even) td{background:rgba(225,205,167,.18);}
table.dtable tr:hover td{background:rgba(243,221,178,.55);}
table.dtable tr.clickable{cursor:pointer;}
.rate{font-variant-numeric:tabular-nums; font-weight:700; color:var(--gold-hi);}
.rate.low{color:var(--text-dim); font-weight:500;}
.group-tag{
  font-size:10.5px; color:var(--text-dim); border:1px solid var(--line-hi); border-radius:999px;
  padding:0 7px; margin-left:6px; background:rgba(255,250,240,.7);
}
.name-link{color:var(--go); font-weight:500; cursor:pointer;}
.name-link:hover{color:var(--go-sink); text-decoration:underline;}
.lv-tag{color:var(--text-faint); font-size:12px; margin-right:6px;}

.item-picker{position:relative;}
.item-picker input{width:100%;padding:9px 10px;background:var(--ink-2);border:2px solid var(--line-hi);border-radius:10px;color:var(--text);font-size:13px;}
.item-picker .suggest{
  position:absolute;z-index:50;top:100%;left:0;right:0;background:var(--panel);
  border:1px solid var(--line-hi);border-radius:10px;max-height:220px;overflow-y:auto;display:none;
  box-shadow:0 6px 16px rgba(0,0,0,.18);
}
.item-picker .suggest div{padding:8px 10px;cursor:pointer;font-size:13px;}
.item-picker .suggest div:hover{background:var(--panel-hi);}
.item-picker .suggest.show{display:block;}

.equip-box{
  background:rgba(255,250,240,.75); border:1px solid rgba(162,131,88,.5); border-radius:12px;
  padding:12px 16px; margin-bottom:18px;
}
.equip-box .row1{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.equip-box .slot{color:var(--go); font-weight:700; font-size:13.5px;}
.equip-stat-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(80px,1fr)); gap:8px;}
.equip-stat-grid div{font-size:12.5px; color:var(--text-dim);}
.equip-stat-grid b{color:var(--text); font-variant-numeric:tabular-nums;}

.price-row{display:flex; gap:18px; color:var(--text-dim); font-size:13px; margin-bottom:4px;}
.price-row b{color:var(--gold-hi); font-variant-numeric:tabular-nums;}

.welcome{
  text-align:center; padding:64px 20px; color:var(--text-dim);
}
.welcome .big{font-size:42px; margin-bottom:12px; color:var(--go); opacity:.55;}
.welcome p{max-width:44ch; margin:0 auto; line-height:1.8; font-size:14px;}

footer{
  text-align:center; margin-top:36px; color:var(--text-dim); font-size:12px;
}
footer span{font-variant-numeric:tabular-nums;}

/* 更新紀錄視窗：跟遊戲彈窗一樣的羊皮紙卡片 */
#changelogModal{box-shadow:0 10px 30px rgba(0,0,0,.35);}

@media (max-width:640px){
  .wrap{padding:14px 12px 60px;}
  .hero{padding:22px 16px 18px;}
  .panel{padding:12px 12px;}
  .panel h2{margin:-12px -12px 10px; padding:9px 12px;}
}

/* 社群攻略補充框（希望/app.js 用這三個變數），兩種風格各自一組顏色 */
:root{--note-bg:rgba(43,123,168,.10); --note-line:#2b7ba8; --note-ink:#175a8f;}

/* 風格切換按鈕 */
.theme-toggle{font-weight:700;}

/* 可收合的區塊（精煉加成）：平常只顯示標題，點了才展開清單 */
.fold-section > summary{cursor:pointer; list-style:none; user-select:none;}
.fold-section > summary::-webkit-details-marker{display:none;}
.fold-section > summary::after{
  content:"▾"; margin-left:4px; font-size:13px; color:var(--text-dim);
  transition:transform .15s; display:inline-block;
}
.fold-section[open] > summary::after{transform:rotate(180deg);}
.fold-section > summary .fold-hint{
  font-size:11.5px; font-weight:500; letter-spacing:0; text-transform:none; color:var(--text-faint);
  border:1px solid var(--line-hi); border-radius:999px; padding:0 8px;
}
.fold-section[open] > summary .fold-hint{display:none;}
.fold-section > summary:hover .fold-hint{border-color:var(--gold); color:var(--gold-hi);}
.fold-section > summary:focus-visible{outline:2px solid var(--gold); outline-offset:3px; border-radius:4px;}
/* G 化：類型分頁、書單 */
.fusion-kind-tabs{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 10px;}
.fusion-kind-tabs .hint-chip.active{border-color:var(--gold); color:var(--gold-hi); font-weight:700;
  background:linear-gradient(180deg, #f5e1bd, #fbeed3); box-shadow:inset 0 3px 7px rgba(0,0,0,.2); transform:translateY(1px);}
html[data-theme="classic"] .fusion-kind-tabs .hint-chip.active{background:var(--panel-hi); box-shadow:none; transform:none;}
table.fusion-books{white-space:nowrap;}
table.fusion-books tr.fusion-book-row td{border-bottom:none; padding-bottom:3px;}
table.fusion-books tr.fusion-mats-row td{white-space:normal; padding-top:2px; font-size:12px; line-height:2;}
table.fusion-books tbody tr:nth-child(4n+3) td, table.fusion-books tbody tr:nth-child(4n+4) td{background:rgba(225,205,167,.18);}
table.fusion-books tbody tr:nth-child(4n+1) td, table.fusion-books tbody tr:nth-child(4n+2) td{background:transparent;}
html[data-theme="classic"] table.fusion-books tbody tr:nth-child(4n+3) td,
html[data-theme="classic"] table.fusion-books tbody tr:nth-child(4n+4) td{background:rgba(255,255,255,.025);}
.fusion-req{color:var(--text-dim); margin-right:8px;}
.fusion-req + .fusion-req{margin-left:6px;}
/* G 化成功率試算 */
.fusion-sim-grid{display:flex; gap:10px; flex-wrap:wrap;}
.fusion-sim-grid label{display:flex; flex-direction:column; gap:4px; font-size:11.5px; color:var(--text-dim); flex:1; min-width:150px;}
.fusion-sim select, .fusion-sim input{
  background:var(--ink-2); color:var(--text); border:1px solid var(--line-hi); border-radius:8px;
  padding:7px 8px; font-size:13px; font-family:inherit; max-width:100%;
}
.fusion-sim select:focus, .fusion-sim input:focus{outline:none; border-color:var(--gold);}
.fusion-aux-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:6px;}
.fusion-aux-row > select[data-a="pick"]{flex:1; min-width:170px;}
.fusion-aux-no{width:20px; text-align:center; font-weight:700; color:var(--gold);}
.fusion-aux-lv{display:flex; align-items:center; gap:4px; font-size:12px; color:var(--text-dim);}
.fusion-aux-lv input{width:70px;}
.fusion-aux-pt{font-size:12px; color:var(--gold-hi); font-variant-numeric:tabular-nums; min-width:56px;}
.fusion-sim-result{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); font-size:13.5px; color:var(--text);}
.fusion-rate{font-size:20px; color:var(--gold-hi); font-variant-numeric:tabular-nums; margin:0 4px;}
.fusion-formula{display:block; font-size:12px; color:var(--text-faint); margin-top:4px;}
/* 增傷／減傷跳階的那幾列 */
table.dtable tr.refine-step td{background:rgba(201,162,75,.16);}

/* ==========================================================================
   舊版風格（深色）：<html data-theme="classic">
   按上方「切換風格」會切到這裡，選擇記在瀏覽器（localStorage），下次打開還是同一種。
   ========================================================================== */
html[data-theme="classic"]{
  color-scheme:dark;
  --ink:#12151c;
  --ink-2:#191d27;
  --panel:#1d222e;
  --panel-hi:#262d3c;
  --line:#333c4f;
  --line-hi:#4a5670;
  --gold:#c9a24b;
  --gold-hi:#e6c878;
  --text:#e9e6db;
  --text-dim:#9aa1b5;
  --text-faint:#6b7286;
  --btn-edge:#4a5670;
  --radius:6px;
  --note-bg:rgba(90,140,201,.12); --note-line:#5a8cc9; --note-ink:#8fb8e8;

  --el-fire:#e0663f;
  --el-water:#4d9fd6;
  --el-earth:#a97c4f;
  --el-tree:#6fa85a;
  --el-dark:#8e6bc9;
  --el-sun:#e6c24b;
  --el-steel:#9aa4b5;
  --el-physical:#c98b4b;
  --el-magical:#7a8cd6;
  --el-none:#5c6272;
}
html[data-theme="classic"] body{
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, #23283a 0%, transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 0%, #241d2c 0%, transparent 55%),
    var(--ink);
}
html[data-theme="classic"] body::before{display:none;}
html[data-theme="classic"] .wrap{padding:28px 20px 80px;}

html[data-theme="classic"] .hero{
  padding:34px 30px 30px; border:1px solid var(--line); border-radius:4px;
  background:linear-gradient(160deg, var(--panel) 0%, var(--ink-2) 100%);
  box-shadow:none; overflow:hidden; margin-bottom:22px;
}
html[data-theme="classic"] .hero::before{
  left:0; right:0; top:0; bottom:0; height:auto; border-radius:0; opacity:1;
  background:repeating-linear-gradient(115deg, rgba(201,162,75,0.035) 0 2px, transparent 2px 90px);
  pointer-events:none;
}
html[data-theme="classic"] .hero .eyebrow{margin-bottom:10px;}
html[data-theme="classic"] .hero h1{font-size:clamp(28px, 4vw, 42px); text-shadow:none;}
html[data-theme="classic"] .hero h1 span{color:var(--gold-hi);}

html[data-theme="classic"] .hint-chip{
  font-size:12.5px; color:var(--text-dim); border:1px solid var(--line);
  padding:4px 10px; border-radius:20px; background:var(--panel);
  box-shadow:none; transform:none; transition:border-color .12s, color .12s;
}
html[data-theme="classic"] .hint-chip:hover{border-color:var(--gold); color:var(--gold-hi);}
html[data-theme="classic"] .hint-chip:active{background:var(--panel); box-shadow:none; transform:none;}

html[data-theme="classic"] .search-row{gap:14px; margin-top:22px;}
html[data-theme="classic"] .level-field label{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em;}
html[data-theme="classic"] .level-field input,
html[data-theme="classic"] .search-box input{
  border:1px solid var(--line-hi); border-radius:3px; box-shadow:none; background:var(--ink-2);
}
html[data-theme="classic"] .level-field input{font-size:13.5px; width:130px;}
html[data-theme="classic"] .search-box input{padding:15px 20px 15px 46px;}
html[data-theme="classic"] .level-field input:focus,
html[data-theme="classic"] .search-box input:focus{border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,162,75,0.16);}
html[data-theme="classic"] .search-box .icon{color:var(--text-faint); font-size:16px;}
html[data-theme="classic"] .search-category{
  background:var(--ink-2); border:1px solid var(--line-hi); border-radius:3px; box-shadow:none; padding:15px 10px;
}
html[data-theme="classic"] .search-category:focus{border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,162,75,0.16);}
html[data-theme="classic"] .ability-only-toggle{padding:14px 12px; border:1px solid var(--line-hi); border-radius:3px; background:var(--ink-2);}
html[data-theme="classic"] .ability-only-toggle:has(input:checked){border-color:var(--gold); color:var(--gold-hi); background:var(--ink-2);}
html[data-theme="classic"] .ability-only-toggle input,
html[data-theme="classic"] .obtainable-toggle input{accent-color:var(--gold);}
html[data-theme="classic"] .obtainable-toggle:has(input:checked){color:var(--gold-hi);}
html[data-theme="classic"] .hint-row{margin-top:10px;}
html[data-theme="classic"] .equip-filter{padding:14px 16px; background:var(--panel); border:1px solid var(--line); border-radius:4px;}
html[data-theme="classic"] .equip-filter label{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em;}
html[data-theme="classic"] .equip-filter select{border:1px solid var(--line-hi); border-radius:3px; padding:9px 10px;}

html[data-theme="classic"] .cols{gap:18px; margin-top:22px;}
html[data-theme="classic"] .panel{background:var(--panel); border:1px solid var(--line); border-radius:4px; box-shadow:none; padding:16px;}
html[data-theme="classic"] .panel h2{
  font-family:"Noto Serif TC", serif; font-size:14px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--gold); margin:0 0 12px; padding:0; background:none; border:none; border-radius:0;
}
html[data-theme="classic"] .panel h2 .count{font-family:"Noto Sans TC",sans-serif; text-transform:none; color:var(--text-faint);}
html[data-theme="classic"] .result-list{margin:0; padding:0; max-height:520px;}
html[data-theme="classic"] .result-list::-webkit-scrollbar-track{background:none;}
html[data-theme="classic"] .result-item,
html[data-theme="classic"] .result-item:nth-child(even){
  padding:10px; border-radius:3px; border:1px solid transparent; background:none; margin-bottom:3px;
}
html[data-theme="classic"] .result-item:hover{background:var(--panel-hi); border-color:var(--line-hi);}
html[data-theme="classic"] .result-item.active{background:var(--panel-hi); border-color:var(--gold); box-shadow:none;}

html[data-theme="classic"] .detail-head{padding-bottom:16px; border-bottom:1px solid var(--line);}
html[data-theme="classic"] .badge{border-radius:20px; background:none;}
html[data-theme="classic"] .badge.tag-harvest{color:#8fd67a; border-color:#3c5c34; background:rgba(111,168,90,.08);}
html[data-theme="classic"] .el-chip{padding:3px 10px; border-radius:20px; background:none;}
html[data-theme="classic"] .stat-grid{gap:10px;}
html[data-theme="classic"] .stat-tile{border:1px solid var(--line); border-radius:3px; box-shadow:none; padding:10px 12px;}
html[data-theme="classic"] .section-title{font-size:13px; letter-spacing:.08em; text-transform:uppercase;}
html[data-theme="classic"] .section-title::before{display:none;}
html[data-theme="classic"] .section-title .count{text-transform:none;}
html[data-theme="classic"] .map-chip{
  padding:6px 12px; border-radius:3px; background:var(--ink-2); border:1px solid var(--line); box-shadow:none;
}
html[data-theme="classic"] .map-chip:hover{border-color:var(--gold); color:var(--text);}

html[data-theme="classic"] table.dtable{border-collapse:collapse; background:none; border:none; border-radius:0;}
html[data-theme="classic"] table.dtable th{
  font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); font-weight:600;
  background:none; border-bottom:1px solid var(--line);
}
html[data-theme="classic"] table.dtable td{padding:9px 10px; border-bottom:1px solid rgba(255,255,255,.04);}
html[data-theme="classic"] table.dtable tbody tr:nth-child(even) td{background:none;}
html[data-theme="classic"] table.dtable tr:hover td{background:rgba(255,255,255,.02);}
html[data-theme="classic"] table.dtable tr.refine-step td{background:rgba(201,162,75,.10);}
html[data-theme="classic"] .group-tag{color:var(--text-faint); border:1px solid var(--line); border-radius:3px; padding:1px 6px; background:none;}
html[data-theme="classic"] .name-link{color:var(--text);}
html[data-theme="classic"] .name-link:hover{color:var(--gold-hi);}
html[data-theme="classic"] .item-picker input{border:1px solid var(--line-hi); border-radius:4px;}
html[data-theme="classic"] .item-picker .suggest{background:var(--panel-hi); border-radius:4px; box-shadow:none;}
html[data-theme="classic"] .item-picker .suggest div:hover{background:var(--ink-2);}
html[data-theme="classic"] .equip-box{background:var(--ink-2); border:1px solid var(--line); border-radius:4px; padding:14px 16px;}
html[data-theme="classic"] .equip-box .slot{color:var(--gold-hi);}
html[data-theme="classic"] .welcome{padding:70px 20px; color:var(--text-faint);}
html[data-theme="classic"] .welcome .big{margin-bottom:14px; color:inherit; opacity:.5;}
html[data-theme="classic"] footer{margin-top:40px; color:var(--text-faint);}
html[data-theme="classic"] #changelogBackdrop{background:rgba(0,0,0,.6) !important;}
html[data-theme="classic"] #changelogModal{border-width:1px !important; box-shadow:none;}
</style>
<script>
  // 在畫面畫出來之前就套用上次選的風格，避免先閃一下另一種配色
  (function () {
    try {
      if (localStorage.getItem("wishTheme") === "classic") document.documentElement.setAttribute("data-theme", "classic");
    } catch (e) { /* 無痕模式等讀不到 localStorage，就用預設的遊戲風格 */ }
  })();
</script>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="eyebrow">Wish Compendium</div>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;">
      <h1>希望圖鑑・<span>掉落查詢</span></h1>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button id="themeToggle" class="hint-chip theme-toggle" type="button" style="white-space:nowrap;">🎨 切換風格</button>
        <button id="helpBtn" class="hint-chip" style="white-space:nowrap;">❓ 使用說明</button>
        <button id="changelogBtn" class="hint-chip" style="white-space:nowrap;">📋 更新紀錄</button>
      </div>
    </div>

    <div class="search-row">
      <select id="searchCategory" class="search-category" aria-label="物品分類篩選"><option value="">全部分類</option></select>
      <div class="search-box">
        <span class="icon">⌕</span>
        <input id="searchInput" type="text" placeholder="搜尋物品或怪物名稱，例如：鐵、咕咕..." autocomplete="off" spellcheck="false">
      </div>
      <label class="ability-only-toggle"><input type="checkbox" id="abilityOnly"> 僅查詢裝備能力</label>
      <div class="level-field">
        <label>你目前的等級（用來換算實際掉落率）</label>
        <input type="number" id="globalDropLevel" min="1" max="999" placeholder="輸入等級...">
      </div>
    </div>
    <div class="hint-row" id="hintRow"></div>

    <div class="equip-filter">
      <div class="ef-field ef-short">
        <label>職業</label>
        <select id="filterJob"><option value="">無</option></select>
      </div>
      <div class="ef-field ef-short">
        <label>裝備位置</label>
        <select id="filterSlot"><option value="">無</option></select>
      </div>
      <div class="ef-field ef-long">
        <label>符合的裝備</label>
        <select id="filterResult" disabled><option value="">請先選擇職業或裝備位置...</option></select>
      </div>
    </div>
  </div>

  <div class="cols">
    <div class="panel">
      <h2 id="resultTitle">搜尋結果 <span class="count" id="resultCount"></span></h2>
      <label class="obtainable-toggle" title="只列出遊戲裡有正確取得管道（掉落、商店、任務、製作、合成、開箱、釣魚等）的物品"><input type="checkbox" id="obtainableOnly"> 僅顯示目前可取得裝備</label>
      <ul class="result-list" id="resultList"></ul>
    </div>

    <div class="panel detail" id="detailPanel">
      <div class="welcome">
        <div class="big">◈</div>
        <p>在左上方輸入關鍵字開始查詢。<br>可以查「物品」被誰掉落，也可以查「怪物」會掉什麼。</p>
      </div>
    </div>
  </div>

  <footer>資料匯出時間：<span id="genTime"></span>　・　僅供遊戲內容查詢參考</footer>
</div>

<div id="changelogBackdrop" style="display:none;position:fixed;inset:0;background:rgba(40,26,14,.55);z-index:999;align-items:center;justify-content:center;padding:20px;">
  <div id="changelogModal" style="background:var(--panel);border:2px solid var(--btn-edge);border-radius:var(--radius);width:100%;max-width:640px;max-height:82vh;overflow-y:auto;padding:22px;position:relative;">
    <button id="changelogClose" style="position:absolute;top:14px;right:16px;background:none;border:none;color:var(--text-dim);font-size:20px;cursor:pointer;">✕</button>
    <div id="changelogBody"></div>
  </div>
</div>

<script>
  // 風格切換：遊戲風格（預設）⇄ 舊版深色風格
  (function () {
    var root = document.documentElement;
    var btn = document.getElementById("themeToggle");
    function isClassic() { return root.getAttribute("data-theme") === "classic"; }
    function refreshLabel() {
      btn.textContent = isClassic() ? "🏰 切換成遊戲風格" : "🌙 切換成舊版風格";
      btn.title = isClassic() ? "目前是舊版深色風格" : "目前是遊戲風格";
    }
    btn.addEventListener("click", function () {
      if (isClassic()) root.removeAttribute("data-theme");
      else root.setAttribute("data-theme", "classic");
      try { localStorage.setItem("wishTheme", isClassic() ? "classic" : "game"); } catch (e) { /* 存不了就只在這次有效 */ }
      refreshLabel();
    });
    refreshLabel();
  })();
</script>

<script src="希望/boxIndex.js"></script>
<script src="希望/petIndex.js"></script>
<script src="希望/battlePetIndex.js"></script>
<script src="希望/questLineIndex.js"></script>
<script src="希望/itemUsesIndex.js"></script>
<script src="希望/letterIndex.js"></script>
<script src="希望/changelog.js"></script>
<script src="希望/quests.js"></script>
<script src="希望/missions.js"></script>

</body>
</html>
