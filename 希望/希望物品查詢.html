<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>希望圖鑑・掉落查詢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12151c;
  --ink-2:#191d27;
  --panel:#1d222e;
  --panel-hi:#262d3c;
  --line:#333c4f;
  --line-hi:#4a5670;
  --gold:#c9a24b;
  --gold-hi:#e6c878;
  --text:#e9e6db;
  --text-dim:#9aa1b5;
  --text-faint:#6b7286;

  --el-fire:#e0663f;
  --el-water:#4d9fd6;
  --el-earth:#a97c4f;
  --el-tree:#6fa85a;
  --el-dark:#8e6bc9;
  --el-sun:#e6c24b;
  --el-steel:#9aa4b5;
  --el-physical:#c98b4b;
  --el-magical:#7a8cd6;
  --el-none:#5c6272;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, #23283a 0%, transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 0%, #241d2c 0%, transparent 55%),
    var(--ink);
  color:var(--text);
  font-family:"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  min-height:100vh;
}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px;}

/* ---------- Header ---------- */
.hero{
  position:relative;
  padding:34px 30px 30px;
  border:1px solid var(--line);
  border-radius:4px;
  background:linear-gradient(160deg, var(--panel) 0%, var(--ink-2) 100%);
  overflow:hidden;
  margin-bottom:22px;
}
.hero::before{
  content:"";
  position:absolute; inset:0;
  background:
    repeating-linear-gradient(115deg, rgba(201,162,75,0.035) 0 2px, transparent 2px 90px);
  pointer-events:none;
}
.hero .eyebrow{
  font-size:12px; letter-spacing:.28em; color:var(--gold);
  text-transform:uppercase; font-weight:700; margin-bottom:10px;
}
.hero h1{
  font-family:"Noto Serif TC", serif;
  font-weight:900;
  font-size:clamp(28px, 4vw, 42px);
  margin:0 0 8px;
  color:var(--text);
  letter-spacing:.02em;
}
.hero h1 span{color:var(--gold-hi);}
.hero p{
  margin:0; color:var(--text-dim); font-size:14.5px; max-width:58ch; line-height:1.7;
}

/* ---------- Search ---------- */
.search-box{
  position:relative;
  margin-top:22px;
}
.search-box input{
  width:100%;
  font-size:17px;
  padding:15px 20px 15px 46px;
  border-radius:3px;
  border:1px solid var(--line-hi);
  background:var(--ink-2);
  color:var(--text);
  font-family:inherit;
  outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.search-box input::placeholder{color:var(--text-faint);}
.search-box input:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(201,162,75,0.16);
}
.search-box .icon{
  position:absolute; left:16px; top:50%; transform:translateY(-50%);
  color:var(--text-faint); font-size:16px; pointer-events:none;
}
.hint-row{
  display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;
}
.equip-filter{
  margin-top:16px; padding:14px 16px; background:var(--panel); border:1px solid var(--line);
  border-radius:4px; display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;
}
.equip-filter .ef-field{display:flex; flex-direction:column; gap:5px;}
.equip-filter label{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em;}
.equip-filter select{
  background:var(--ink-2); color:var(--text); border:1px solid var(--line-hi); border-radius:3px;
  padding:9px 10px; font-size:13.5px; font-family:inherit;
}
.equip-filter select:disabled{opacity:.4; cursor:not-allowed;}
.equip-filter .ef-short select{width:150px;}
.equip-filter .ef-long{flex:1; min-width:220px;}
.equip-filter .ef-long select{width:100%;}
.hint-chip{
  font-size:12.5px; color:var(--text-dim); border:1px solid var(--line);
  padding:4px 10px; border-radius:20px; cursor:pointer; background:var(--panel);
  transition:border-color .12s, color .12s;
}
.hint-chip:hover{border-color:var(--gold); color:var(--gold-hi);}

/* ---------- Result columns ---------- */
.cols{
  display:grid; grid-template-columns:340px 1fr; gap:18px; margin-top:22px;
  align-items:start;
}
@media (max-width:820px){ .cols{grid-template-columns:1fr;} }

.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:4px;
  padding:16px;
}
.panel h2{
  font-family:"Noto Serif TC", serif;
  font-size:14px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--gold); margin:0 0 12px; font-weight:700;
  display:flex; align-items:center; gap:8px;
}
.panel h2 .count{
  font-family:"Noto Sans TC",sans-serif; letter-spacing:0; text-transform:none;
  color:var(--text-faint); font-weight:400; font-size:12px;
}
.result-list{list-style:none; margin:0; padding:0; max-height:520px; overflow-y:auto;}
.result-list::-webkit-scrollbar{width:8px;}
.result-list::-webkit-scrollbar-thumb{background:var(--line-hi); border-radius:4px;}

.result-item{
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding:10px 10px; border-radius:3px; cursor:pointer;
  border:1px solid transparent;
  margin-bottom:3px;
}
.result-item:hover{background:var(--panel-hi); border-color:var(--line-hi);}
.result-item.active{background:var(--panel-hi); border-color:var(--gold);}
.result-item .rname{font-weight:500; font-size:14.5px;}
.result-item .rmeta{font-size:12px; color:var(--text-faint); white-space:nowrap;}

.empty-note{color:var(--text-faint); font-size:13.5px; padding:20px 6px; line-height:1.8;}

/* ---------- Detail panel ---------- */
.detail{min-height:200px;}
.detail-head{
  display:flex; justify-content:space-between; align-items:flex-start; gap:14px;
  padding-bottom:16px; margin-bottom:16px; border-bottom:1px solid var(--line);
}
.detail-title{font-family:"Noto Serif TC", serif; font-size:24px; font-weight:700; color:var(--text);}
.detail-sub{color:var(--text-dim); font-size:13px; margin-top:4px;}
.badge{
  display:inline-flex; align-items:center; gap:5px;
  font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:20px;
  border:1px solid var(--line-hi); color:var(--text-dim);
}
.badge.tag-harvest{color:#8fd67a; border-color:#3c5c34; background:rgba(111,168,90,.08);}
.badge-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}

.el-chip{
  display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700;
  padding:3px 10px; border-radius:20px; border:1px solid currentColor;
}

.stat-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(96px,1fr));
  gap:10px; margin-bottom:22px;
}
.stat-tile{
  background:var(--ink-2); border:1px solid var(--line); border-radius:3px;
  padding:10px 12px;
}
.stat-tile .v{font-size:17px; font-weight:700; color:var(--gold-hi); font-variant-numeric:tabular-nums;}
.stat-tile .k{font-size:11px; color:var(--text-faint); margin-top:2px;}

.section-title{
  font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--gold);
  font-weight:700; margin:22px 0 10px; display:flex; align-items:center; gap:8px;
}
.section-title .count{color:var(--text-faint); font-weight:400; text-transform:none; letter-spacing:0;}

.map-chip-row{display:flex; flex-wrap:wrap; gap:8px;}
.map-chip{
  font-size:13px; padding:6px 12px; border-radius:3px; background:var(--ink-2);
  border:1px solid var(--line); color:var(--text); cursor:pointer;
}
.map-chip:hover{border-color:var(--gold);}

table.dtable{width:100%; border-collapse:collapse; font-size:13.5px;}
table.dtable th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
  color:var(--text-faint); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line);
}
table.dtable td{padding:9px 10px; border-bottom:1px solid rgba(255,255,255,.04); vertical-align:middle;}
table.dtable tr:hover td{background:rgba(255,255,255,.02);}
table.dtable tr.clickable{cursor:pointer;}
.rate{font-variant-numeric:tabular-nums; font-weight:700; color:var(--gold-hi);}
.rate.low{color:var(--text-dim); font-weight:500;}
.group-tag{
  font-size:10.5px; color:var(--text-faint); border:1px solid var(--line); border-radius:3px;
  padding:1px 6px; margin-left:6px;
}
.name-link{color:var(--text); font-weight:500; cursor:pointer;}
.name-link:hover{color:var(--gold-hi); text-decoration:underline;}
.lv-tag{color:var(--text-faint); font-size:12px; margin-right:6px;}

.item-picker{position:relative;}
.item-picker input{width:100%;padding:9px 10px;background:var(--ink-2);border:1px solid var(--line-hi);border-radius:4px;color:var(--text);font-size:13px;}
.item-picker .suggest{
  position:absolute;z-index:50;top:100%;left:0;right:0;background:var(--panel-hi);
  border:1px solid var(--line-hi);border-radius:4px;max-height:220px;overflow-y:auto;display:none;
}
.item-picker .suggest div{padding:8px 10px;cursor:pointer;font-size:13px;}
.item-picker .suggest div:hover{background:var(--ink-2);}
.item-picker .suggest.show{display:block;}

.equip-box{
  background:var(--ink-2); border:1px solid var(--line); border-radius:4px;
  padding:14px 16px; margin-bottom:18px;
}
.equip-box .row1{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.equip-box .slot{color:var(--gold-hi); font-weight:700; font-size:13.5px;}
.equip-stat-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(80px,1fr)); gap:8px;}
.equip-stat-grid div{font-size:12.5px; color:var(--text-dim);}
.equip-stat-grid b{color:var(--text); font-variant-numeric:tabular-nums;}

.price-row{display:flex; gap:18px; color:var(--text-dim); font-size:13px; margin-bottom:4px;}
.price-row b{color:var(--gold-hi); font-variant-numeric:tabular-nums;}

.welcome{
  text-align:center; padding:70px 20px; color:var(--text-faint);
}
.welcome .big{font-size:42px; margin-bottom:14px; opacity:.5;}
.welcome p{max-width:44ch; margin:0 auto; line-height:1.8; font-size:14px;}

footer{
  text-align:center; margin-top:40px; color:var(--text-faint); font-size:12px;
}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="eyebrow">Wish Compendium</div>
    <h1>希望圖鑑・<span>掉落查詢</span></h1>
    <p>輸入物品名稱，查出所有會掉落它的怪物、出現地圖與機率，以及哪些商店有賣；輸入怪物名稱，查出牠的能力與完整掉落表。</p>

    <div class="search-box">
      <span class="icon">⌕</span>
      <input id="searchInput" type="text" placeholder="搜尋物品或怪物名稱，例如：鐵、咕咕..." autocomplete="off" spellcheck="false">
    </div>
    <div class="hint-row" id="hintRow"></div>

    <div class="equip-filter">
      <div class="ef-field ef-short">
        <label>職業</label>
        <select id="filterJob"><option value="">無</option></select>
      </div>
      <div class="ef-field ef-short">
        <label>裝備位置</label>
        <select id="filterSlot"><option value="">無</option></select>
      </div>
      <div class="ef-field ef-long">
        <label>符合的裝備</label>
        <select id="filterResult" disabled><option value="">請先選擇職業或裝備位置...</option></select>
      </div>
    </div>
  </div>

  <div class="cols">
    <div class="panel">
      <h2 id="resultTitle">搜尋結果 <span class="count" id="resultCount"></span></h2>
      <ul class="result-list" id="resultList"></ul>
    </div>

    <div class="panel detail" id="detailPanel">
      <div class="welcome">
        <div class="big">◈</div>
        <p>在左上方輸入關鍵字開始查詢。<br>可以查「物品」被誰掉落，也可以查「怪物」會掉什麼。</p>
      </div>
    </div>
  </div>

  <footer>資料匯出時間：<span id="genTime"></span>　・　僅供遊戲內容查詢參考</footer>
</div>

<script src="希望/config.js"></script>
<script src="希望/maps.js"></script>
<script src="希望/towns.js"></script>
<script src="希望/items.js"></script>
<script src="希望/jobs.js"></script>
<script src="希望/equipSlots.js"></script>
<script src="希望/monsters.js"></script>
<script src="希望/dropIndex.js"></script>
<script src="希望/shopIndex.js"></script>
<script src="希望/quests.js"></script>
<script src="希望/missions.js"></script>
<script src="希望/enchant.js"></script>
<script src="希望/app.js"></script>
</body>
</html>
