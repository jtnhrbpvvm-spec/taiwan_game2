<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>去公告 書籤</title>
<style>
  body{font-family:"Microsoft JhengHei",sans-serif;text-align:center;padding:50px;background:#0f172a;color:#fff}
  .btn{display:inline-block;padding:16px 32px;background:#22c55e;color:#000;text-decoration:none;border-radius:12px;font-weight:bold;font-size:18px;cursor:grab}
  .btn:active{cursor:grabbing}
  .btn:hover{background:#4ade80}

  /* 動態示意圖 */
  .demo{margin-top:30px;padding:20px;background:#1e293b;border-radius:12px;max-width:400px;margin-left:auto;margin-right:auto}
  .bookmark-bar{height:40px;background:#334155;border-radius:8px;display:flex;align-items:center;padding:0 10px;gap:8px;margin-bottom:15px}
  .bookmark{width:80px;height:24px;background:#475569;border-radius:6px}
  .hand{font-size:40px;display:inline-block;animation:drag 2s infinite}
  @keyframes drag{
    0%{transform:translate(0,0)}
    40%{transform:translate(0,-20px)}
    60%{transform:translate(120px,-20px)}
    100%{transform:translate(120px,0)}
  }
  .arrow{color:#38bdf8;font-size:14px;margin-top:8px}
</style>
</head>
<body>
<h1>去公告 書籤</h1>
<p>把下面綠色按鈕直接拖到書籤列即可</p>

<a class="btn" href="javascript:(function(){ location.href='https://shines871.github.io/idle-lineage-class/'; setTimeout(()=>{ document.querySelectorAll('[class*="announce"],[id*="announce"],.modal,.popup,.overlay').forEach(el=>el.remove()); },1000); })();">拖我到書籤列</a>

<!-- 簡易動態示意圖 -->
<div class="demo">
  <div class="bookmark-bar">
    <div class="bookmark"></div>
    <div class="bookmark"></div>
  </div>
  <div class="hand">👆</div>
  <div class="arrow">⬇ 往上拖到書籤列 ⬇</div>
</div>

<p style="margin-top:20px;font-size:14px;color:#94a3b8">拖過去後，點一下書籤就會自動跳轉並移除公告</p>
</body>
</html>
