<meta charset="UTF-8">
<title>去公告 完整安裝教學</title>
<style>
  body{font-family:"Microsoft JhengHei",sans-serif;text-align:center;padding:20px;background:#0f172a;color:#fff}
  h1{margin-bottom:30px;color:#38bdf8}
  .section{background:#1e293b;border-radius:16px;padding:20px;margin-bottom:30px;max-width:500px;margin:0 auto 30px}
  h2{color:#22c55e;margin-top:0}
  
  /* 按鈕 */
  .btn{display:inline-block;padding:14px 28px;background:#22c55e;color:#000;text-decoration:none;border-radius:12px;font-weight:bold;font-size:16px;margin:10px}
  .btn:hover{background:#4ade80}
  .copy-btn{padding:10px 20px;background:#38bdf8;color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px}
  .copy-btn:hover{background:#0ea5e9}
  .copy-ok{color:#4ade80;font-size:14px;margin-top:5px;height:20px}

  /* 電腦動畫 */
  .demo{margin-top:20px;padding:20px;background:#0f172a;border-radius:12px;position:relative;overflow:hidden}
  .bookmark-bar{height:40px;background:#334155;border-radius:8px;display:flex;align-items:center;padding:0 10px;gap:8px;margin-bottom:15px;border:2px dashed #475569}
  .bookmark{width:70px;height:20px;background:#475569;border-radius:6px}
  .hand{font-size:40px;position:absolute;left:50%;bottom:40px;transform:translateX(-50%);animation:dragUp 2.5s infinite}
  @keyframes dragUp{0%{bottom:40px;opacity:0}20%{bottom:40px;opacity:1}60%{bottom:110px;opacity:1}80%{bottom:110px}100%{bottom:40px;opacity:0}}
  .tip{color:#38bdf8;font-size:14px;margin-top:10px}

  /* 手機 */
  .phone{width:220px;height:420px;background:#000;border-radius:35px;margin:15px auto;padding:12px;border:6px solid #334155}
  .screen{width:100%;height:100%;background:#fff;border-radius:25px;overflow:hidden;position:relative;color:#000}
  .bar{height:45px;background:#f1f5f9;display:flex;align-items:center;justify-content:space-around;font-size:14px}
  .finger{font-size:30px;position:absolute;animation:tap 3s infinite}
  .ios .finger{left:160px;top:360px;animation-name:tapIOS}
  @keyframes tapIOS{0%,100%{opacity:0}10%{opacity:1}20%{top:355px}30%{top:360px}40%{left:110px;top:180px}50%{top:175px}60%{top:180px}70%{left:110px;top:300px}80%{top:295px}90%{top:300px}}
  .android .finger{left:180px;top:25px;animation-name:tapAndroid}
  @keyframes tapAndroid{0%,100%{opacity:0}10%{opacity:1}20%{top:20px}30%{top:25px}40%{left:110px;top:130px}50%{top:125px}60%{top:130px}70%{left:110px;top:260px}80%{top:255px}90%{top:260px}}
  
  /* 程式碼框 */
  textarea{width:95%;height:80px;border-radius:8px;padding:8px;margin-top:10px;background:#020617;color:#0f0;border:1px solid #334155;font-size:11px;resize:none}
</style>
</head>
