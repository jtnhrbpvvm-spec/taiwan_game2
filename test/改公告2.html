  .btn{display:inline-block;padding:14px 24px;background:#22c55e;color:#000;text-decoration:none;border-radius:12px;font-weight:bold;font-size:15px;margin:10px 0}
  .btn:hover{background:#4ade80}
  .copy-btn{padding:8px 16px;background:#38bdf8;color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:8px;width:100%}

  .bookmark{width:60px;height:18px;background:#475569;border-radius:5px}

  .phone{width:200px;height:380px;background:#000;border-radius:30px;margin:10px auto;padding:10px;border:5px solid #334155}
  .screen{width:100%;height:100%;background:#fff;border-radius:22px;overflow:hidden;position:relative;color:#000;font-size:12px}
  .bar{height:40px;background:#f1f5f9;display:flex;align-items:center;justify-content:space-around}
  .finger{font-size:28px;position:absolute;animation:tap 3s infinite}
  .ios .finger{left:145px;top:330px;animation-name:tapIOS}
  @keyframes tapIOS{0%,100%{opacity:0}10%{opacity:1}20%{top:325px}30%{top:330px}40%{left:100px;top:160px}50%{top:155px}60%{top:160px}70%{left:100px;top:270px}80%{top:265px}90%{top:270px}}
  .android .finger{left:165px;top:20px;animation-name:tapAndroid}
  @keyframes tapAndroid{0%,100%{opacity:0}10%{opacity:1}20%{top:15px}30%{top:20px}40%{left:100px;top:115px}50%{top:110px}60%{top:115px}70%{left:100px;top:235px}80%{top:230px}90%{top:235px}}
  
  /* 程式碼框 */
  textarea{width:92%;height:70px;border-radius:8px;padding:6px;margin-top:8px;background:#020617;color:#0f0;border:1px solid #334155;font-size:10px;resize:none;word-break:break-all}
