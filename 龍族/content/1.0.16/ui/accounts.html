<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>帳號管理</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; padding: 14px 16px 18px; background: #0d0b08; color: #e9e4d8; font: 14px/1.6 "Microsoft JhengHei", sans-serif; }
      h1 { margin: 0 0 4px; font-size: 18px; color: #f2bb4f; }
      h2 { margin: 0 0 6px; font-size: 15px; color: #f2bb4f; }
      section { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: #17130e; border: 1px solid #3a2f20; }
      .hint { font-size: 12px; color: #98a2b6; }
      .acct { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #2a2218; }
      .acct:last-child { border-bottom: 0; }
      .acct .who { flex: 1; min-width: 0; }
      .acct .who small { display: block; color: #98a2b6; font-size: 12px; }
      .acct.current .who b { color: #8fe08a; }
      .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
      .row label { width: 64px; color: #c9b58a; white-space: nowrap; }
      input { flex: 1; padding: 4px 8px; border-radius: 6px; border: 1px solid #5a4a30; background: #0d0b08; color: #fff; font: inherit; }
      button { padding: 4px 12px; border: 0; border-radius: 6px; background: #3a2f20; color: #e9e4d8; font: inherit; cursor: pointer; white-space: nowrap; }
      button.main { background: #c9973f; color: #1b120a; font-weight: bold; }
      button.danger { background: #5a2420; }
      button:disabled { opacity: .4; cursor: default; }
      h1 small { font-size: 14px; }
      #msg { margin-top: 8px; font-size: 13px; min-height: 1.4em; }
      .warn { color: #ffb46a; }
      .ok { color: #8fe08a; }
    </style>
  </head>
  <body>
    <h1>多帳號與桌寵管理 <small id="pet-count"></small></h1>
    <div class="hint">記住帳號密碼後，要登入時桌寵會開 Chrome 幫你把帳號密碼填好，你只要勾人機驗證、按「登入」。<br />
      最多同時開啟五隻桌寵，每隻代表一個帳號，顯示該帳號目前登入角色的娃娃。登入、裝備外觀與自動功能各自獨立，重開程式會恢復上次開啟的桌寵。<br />密碼用 Windows 內建加密存在這台電腦，換電腦或換 Windows 使用者要重新輸入。</div>

    <section>
      <h2>帳號</h2>
      <div id="list"></div>
      <div id="legacy"></div>
    </section>

    <section>
      <h2 id="form-title">新增帳號</h2>
      <input type="hidden" id="f-id" />
      <div class="row"><label for="f-user">帳號</label><input id="f-user" maxlength="20" autocomplete="off" /></div>
      <div class="row"><label for="f-pass">密碼</label><input id="f-pass" type="password" maxlength="72" autocomplete="new-password" placeholder="" /></div>
      <div class="row"><label for="f-label">顯示名稱</label><input id="f-label" maxlength="20" placeholder="選填，例如「主帳號」" /></div>
      <div class="row" style="justify-content: flex-end">
        <button id="f-cancel" type="button" hidden>取消修改</button>
        <button id="f-save" class="main" type="button">儲存</button>
      </div>
      <div id="msg"></div>
    </section>
    <script src="accounts.js"></script>
  </body>
</html>
