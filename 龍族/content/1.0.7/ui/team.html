<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>組隊練功</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; padding: 14px 16px 18px; background: #0d0b08; color: #e9e4d8; font: 14px/1.6 "Microsoft JhengHei", sans-serif; }
      h1 { margin: 0 0 6px; font-size: 18px; color: #f2bb4f; }
      h2 { margin: 0 0 4px; font-size: 15px; color: #f2bb4f; }
      section { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: #17130e; border: 1px solid #3a2f20; }
      .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
      .row label.name { width: 84px; color: #c9b58a; white-space: nowrap; }
      select { max-width: 100%; padding: 3px 6px; border-radius: 6px; border: 1px solid #5a4a30; background: #0d0b08; color: #fff; font: inherit; }
      .hint { margin-top: 6px; font-size: 12px; color: #98a2b6; }
      .warn { color: #ffb46a; } .ok { color: #8fe08a; } .bad { color: #ff8f7a; } .muted { color: #8a8170; }
      .pet { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; border-bottom: 1px solid #2a2218; }
      .pet:last-child { border-bottom: 0; }
      .pet .who { flex: 1; }
      .pet .who b { color: #f2d9a6; }
      .pet .state { font-size: 12px; color: #c9c2b2; }
      button { margin-top: 10px; padding: 6px 18px; border: 0; border-radius: 8px; background: #c9973f; color: #1b120a; font: bold 14px "Microsoft JhengHei", sans-serif; cursor: pointer; }
      button.secondary { background: #3a2f20; color: #f2d9a6; }
      button:disabled { opacity: 0.5; cursor: default; }
      #msg { margin-left: 8px; font-size: 13px; }
      #log { margin-top: 6px; max-height: 180px; overflow: auto; font-size: 12px; color: #c9c2b2; white-space: pre-wrap; background: #0d0b08; border-radius: 6px; padding: 6px 8px; border: 1px solid #2a2218; }
    </style>
  </head>
  <body>
    <h1>組隊練功</h1>
    <div class="hint">指定一隻桌寵當隊長、勾其他桌寵當隊員，按「開始組隊」：<br />
      ① 隊員回主城等邀請　② 隊長建隊並邀請隊員，隊員自動接受（只接受這位隊長的邀請）<br />
      ③ 到齊後（最多等 2 分鐘）隊長帶隊伍進選定地圖的私人房，隊員自動跟上（跟遊戲的「帶隊伍去私人房」「跟上隊伍」一樣）<br />
      ④ 之後任何人倒下復活、回城補給，都回到同一間私人房。遊戲視窗叫出來的那隻會暫停（跟自動補給一樣）。</div>

    <section>
      <h2>設定</h2>
      <div class="row"><label class="name" for="leader">隊長</label><select id="leader"></select></div>
      <div class="row"><label class="name" for="map">去哪練功</label><select id="map"></select></div>
      <div class="row"><label class="name">隊員</label><span class="hint" style="margin:0">勾選下面的桌寵</span></div>
      <div id="pets"></div>
      <div class="row">
        <button id="start" type="button">開始組隊</button>
        <button id="stop" type="button" class="secondary">解散（全部離開隊伍）</button>
        <span id="msg"></span>
      </div>
    </section>

    <section>
      <h2>目前狀態</h2>
      <div id="now" class="hint">沒有在組隊。</div>
      <div id="log">（還沒有）</div>
    </section>
    <script src="team.js"></script>
  </body>
</html>
