<!-- 電腦版面先套好（站長 2026-10-25「電腦版會先跳直式再跳橫式」）：js/pcui.js 是 module、最後才跑，那之前畫面照手機直式排 → 這裡照同一套判斷（寬≥高；放得下 1 倍就鎖 800×600 舞台，同 stage.js setStage）先加 class，pcui.js 跑的時候接手 -->
<script>(function () { try {
  if (!matchMedia('(min-aspect-ratio: 1/1)').matches) return;
  var de = document.documentElement, W = de.clientWidth || innerWidth, H = de.clientHeight || innerHeight;
  var k = Math.max(0.5, Math.min(3, Math.round(Math.min(H / 540, (W - 400) / 258) * 4) / 4));
  document.body.classList.add('pcui');
  if (k >= 1) { var s = Math.min(W / 800, H / 600); de.style.setProperty('--sts', String(s)); de.style.setProperty('--stx', Math.round((W - 800 * s) / 2) + 'px'); de.style.setProperty('--sty', Math.round((H - 600 * s) / 2) + 'px'); de.classList.add('stage43'); de.style.setProperty('--pk', '1'); }
  else { de.style.setProperty('--pk', String(k)); document.body.classList.add('pcui-sm'); }
} catch (e) { } })();</script>
