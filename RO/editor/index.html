<!--
  諸神放置錄 — 存檔修改器（第三方輔助工具）
  跟遊戲本體、書籤工具是分開的專案，透過 postMessage 跟遊戲分頁溝通。
  不會、也不能單獨運作——一定要從遊戲內「開啟修改器」按鈕開啟。
-->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>存檔修改器 — 諸神放置錄</title>
<style>
  :root{
    --bg: #171224;
    --bg-panel: #211a33;
    --bg-panel-2: #2a2140;
    --bg-input: #1b1529;
    --line: #3c2f5c;
    --gold: #c9a227;
    --gold-soft: #e0c15a;
    --ink: #ece6f5;
    --ink-dim: #a99bc4;
    --danger: #e0607a;
    --ok: #6fcf97;
    --radius: 10px;
    font-size: 16px;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:radial-gradient(ellipse at top, #241c38 0%, var(--bg) 60%);
    color:var(--ink); font-family: "PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
    min-height:100vh; padding:14px;
  }
  h1,h2,h3{ font-weight:700; margin:0 0 8px; }
  .app{ max-width:520px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }

  .brand{ display:flex; align-items:center; gap:10px; padding:2px 2px 6px; }
  .brand .mark{ font-size:22px; }
  .brand h1{ font-size:17px; color:var(--gold-soft); letter-spacing:.5px; }
  .brand .sub{ font-size:11px; color:var(--ink-dim); margin-top:2px; }

  .warn-band{
    background:#3a2416; border:1px solid #6b4a1f; color:#f0c98a;
    border-radius:var(--radius); padding:9px 12px; font-size:12.5px; line-height:1.5;
  }

  .panel{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px;
  }
  .panel + .panel{ margin-top:0; }

  .center-msg{ text-align:center; padding:40px 10px; color:var(--ink-dim); }
  .spinner{
    width:34px; height:34px; margin:0 auto 14px; border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--gold);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .btn{
    appearance:none; border:1px solid var(--gold); background:var(--bg-panel-2);
    color:var(--gold-soft); border-radius:8px; padding:9px 14px; font-size:13.5px;
    cursor:pointer; font-weight:600; transition:background .15s, transform .05s;
  }
  .btn:hover{ background:#352a53; }
  .btn:active{ transform:scale(.97); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn.primary{ background:var(--gold); color:#2a2011; border-color:var(--gold); }
  .btn.primary:hover{ background:var(--gold-soft); }
  .btn.ghost{ background:transparent; border-color:var(--line); color:var(--ink-dim); }
  .btn.block{ width:100%; }
  .btn.sm{ padding:5px 9px; font-size:12px; }

  .slot-grid{ display:flex; flex-direction:column; gap:8px; max-height:60vh; overflow-y:auto; }
  .slot-row{
    display:flex; align-items:center; gap:10px; background:var(--bg-panel-2);
    border:1px solid var(--line); border-radius:8px; padding:10px 12px; cursor:pointer;
    text-align:left;
  }
  .slot-row:hover{ border-color:var(--gold); }
  .slot-row.empty{ opacity:.45; cursor:default; }
  .slot-row.empty:hover{ border-color:var(--line); }
  .slot-row .idx{
    width:26px; height:26px; border-radius:50%; background:var(--bg-input);
    display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--ink-dim);
    flex-shrink:0;
  }
  .slot-row .info{ flex:1; min-width:0; }
  .slot-row .name{ font-size:14px; font-weight:600; }
  .slot-row .meta{ font-size:11.5px; color:var(--ink-dim); margin-top:2px; }
  .badge-live{
    font-size:10.5px; background:#2c4a34; color:var(--ok); border:1px solid #3d6a49;
    padding:2px 7px; border-radius:20px; flex-shrink:0;
  }

  .editor-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .editor-head .who{ font-size:14px; font-weight:700; color:var(--gold-soft); }
  .editor-head .who small{ display:block; font-size:11px; color:var(--ink-dim); font-weight:400; margin-top:1px; }

  .tabs{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; }
  .tab-btn{
    flex:0 0 auto; background:var(--bg-input); border:1px solid var(--line); color:var(--ink-dim);
    border-radius:7px; padding:7px 11px; font-size:12.5px; cursor:pointer; white-space:nowrap;
  }
  .tab-btn.active{ background:var(--gold); color:#2a2011; border-color:var(--gold); font-weight:700; }

  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field.full{ grid-column:1 / -1; }
  .field label{ font-size:11.5px; color:var(--ink-dim); }
  .field input, .field select{
    background:var(--bg-input); border:1px solid var(--line); border-radius:6px;
    color:var(--ink); padding:8px 9px; font-size:13.5px; width:100%;
  }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--gold); }
  .field.dirty input{ border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset; }

  .list-row{
    display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--line);
  }
  .list-row:last-child{ border-bottom:none; }
  .list-row .ic{ width:22px; text-align:center; flex-shrink:0; }
  .list-row .nm{ flex:1; min-width:0; font-size:13px; }
  .list-row .nm small{ display:block; color:var(--ink-dim); font-size:10.5px; }
  .list-row input[type=number]{
    width:64px; background:var(--bg-input); border:1px solid var(--line); border-radius:6px;
    color:var(--ink); padding:5px 6px; font-size:13px; text-align:right;
  }
  .list-row .rm{
    background:none; border:none; color:var(--danger); font-size:16px; cursor:pointer; padding:2px 4px;
  }

  .add-row{
    display:flex; gap:6px; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);
  }
  .add-row input[list]{
    flex:1; background:var(--bg-input); border:1px solid var(--line); border-radius:6px;
    color:var(--ink); padding:8px 9px; font-size:13px; min-width:0;
  }
  .add-row input[type=number]{
    width:60px; background:var(--bg-input); border:1px solid var(--line); border-radius:6px;
    color:var(--ink); padding:8px 6px; font-size:13px; text-align:right;
  }

  .empty-hint{ color:var(--ink-dim); font-size:12.5px; padding:10px 0; text-align:center; }

  .apply-bar{
    position:sticky; bottom:0; display:flex; gap:8px; align-items:center;
    background:linear-gradient(180deg, transparent, var(--bg) 30%); padding-top:10px; margin-top:4px;
  }
  .apply-bar .status{ font-size:12px; color:var(--ink-dim); flex:1; }
  .apply-bar .status.dirty{ color:var(--gold-soft); }

  .toast{
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%) translateY(20px);
    background:#2a2140; border:1px solid var(--gold); color:var(--ink); padding:9px 16px;
    border-radius:20px; font-size:13px; opacity:0; pointer-events:none; transition:all .25s;
    max-width:90vw; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.err{ border-color:var(--danger); }

  .backline{ display:flex; align-items:center; gap:6px; }
  .backline .btn{ padding:6px 10px; font-size:12px; }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }

  .hidden{ display:none !important; }
</style>
</head>
<body>

<div class="app">
  <div class="brand">
    <div class="mark">🛠️</div>
    <div>
      <h1>存檔修改器</h1>
      <div class="sub">諸神放置錄・非官方輔助工具</div>
    </div>
  </div>

  <div class="warn-band">
    這是第三方輔助工具，直接改寫瀏覽器內的存檔資料。建議先在遊戲內「匯出」備份一份，改壞了才有得救。
  </div>

  <!-- 連線中 / 待命畫面 -->
  <div id="screen-connecting" class="panel">
    <div id="connecting-loading" class="center-msg">
      <div class="spinner"></div>
      <div>正在跟遊戲分頁要資料…</div>
    </div>
    <div id="connecting-standalone" class="center-msg hidden">
      <div style="font-size:34px;margin-bottom:10px;">🔌</div>
      <div style="color:var(--ink);font-size:14px;margin-bottom:6px;">沒有偵測到遊戲分頁</div>
      <div style="font-size:12.5px;">請回到遊戲內，在頂部輸入框打「開啟修改器」再按「開啟」，<br>不要直接把這個網址貼到新分頁開啟。</div>
    </div>
  </div>

  <!-- 選擇存檔欄位 -->
  <div id="screen-slots" class="panel hidden">
    <h3>選擇要編輯的存檔欄位</h3>
    <div id="slot-grid" class="slot-grid"></div>
    <div style="display:flex; gap:8px; margin-top:12px;">
      <button class="btn ghost block" id="btn-open-warehouse">🏬 編輯跨角色倉庫</button>
      <button class="btn ghost sm" id="btn-refresh-slots" title="重新跟遊戲要一次最新資料">🔄</button>
    </div>
  </div>

  <!-- 角色編輯畫面 -->
  <div id="screen-editor" class="panel hidden">
    <div class="backline"><button class="btn ghost sm" id="btn-back-slots">← 返回欄位列表</button></div>
    <div class="editor-head" style="margin-top:8px;">
      <div class="who" id="editor-who">—<small id="editor-who-sub"></small></div>
    </div>
    <div class="tabs" style="margin-top:10px;">
      <button class="tab-btn active" data-tab="basic">基本</button>
      <button class="tab-btn" data-tab="stats">屬性／技能點</button>
      <button class="tab-btn" data-tab="inv">背包</button>
      <button class="tab-btn" data-tab="equip">裝備</button>
    </div>

    <div id="tab-basic" class="tab-pane" style="margin-top:14px;">
      <div class="field-grid">
        <div class="field"><label>鋅幣</label><input type="number" min="0" id="f-gold"></div>
        <div class="field"><label>基礎等級</label><input type="number" min="1" id="f-baseLevel"></div>
        <div class="field"><label>基礎經驗值</label><input type="number" min="0" id="f-baseExp"></div>
        <div class="field"><label>職業等級</label><input type="number" min="1" id="f-jobLevel"></div>
        <div class="field"><label>職業經驗值</label><input type="number" min="0" id="f-jobExp"></div>
      </div>
    </div>

    <div id="tab-stats" class="tab-pane hidden" style="margin-top:14px;">
      <div class="field-grid">
        <div class="field"><label>剩餘屬性點</label><input type="number" min="0" id="f-statPoints"></div>
        <div class="field"><label>剩餘技能點</label><input type="number" min="0" id="f-skillPoints"></div>
      </div>
      <div class="field-grid" style="margin-top:10px;">
        <div class="field"><label>力量 STR</label><input type="number" min="1" id="f-str"></div>
        <div class="field"><label>敏捷 AGI</label><input type="number" min="1" id="f-agi"></div>
        <div class="field"><label>體力 VIT</label><input type="number" min="1" id="f-vit"></div>
        <div class="field"><label>智力 INT</label><input type="number" min="1" id="f-int"></div>
        <div class="field"><label>靈巧 DEX</label><input type="number" min="1" id="f-dex"></div>
        <div class="field"><label>幸運 LUK</label><input type="number" min="1" id="f-luk"></div>
      </div>
    </div>

    <div id="tab-inv" class="tab-pane hidden" style="margin-top:14px;">
      <div id="inv-list"></div>
      <div class="add-row">
        <input list="item-options" id="inv-add-id" placeholder="輸入道具 ID 或中文名稱搜尋">
        <input type="number" id="inv-add-qty" value="1" min="1">
        <button class="btn sm" id="inv-add-btn">加入</button>
      </div>
    </div>

    <div id="tab-equip" class="tab-pane hidden" style="margin-top:14px;">
      <div class="field-grid" id="equip-grid"></div>
      <div class="empty-hint">直接指定裝備欄位的道具 ID，留空＝卸下。只支援一般道具 ID，不含精煉值／插卡的個體裝備。</div>
    </div>

    <div class="apply-bar">
      <div class="status" id="slot-status">尚未變更</div>
      <button class="btn ghost sm" id="btn-discard">還原</button>
      <button class="btn primary" id="btn-apply-slot" disabled>套用修改</button>
    </div>
  </div>

  <!-- 倉庫編輯畫面 -->
  <div id="screen-warehouse" class="panel hidden">
    <div class="backline"><button class="btn ghost sm" id="btn-back-slots-2">← 返回欄位列表</button></div>
    <h3 style="margin-top:8px;">跨角色倉庫</h3>
    <div class="field" style="max-width:200px;">
      <label>倉庫鋅幣</label><input type="number" min="0" id="wh-gold">
    </div>
    <div id="wh-list" style="margin-top:10px;"></div>
    <div class="add-row">
      <input list="item-options" id="wh-add-id" placeholder="輸入道具 ID 或中文名稱搜尋">
      <input type="number" id="wh-add-qty" value="1" min="1">
      <button class="btn sm" id="wh-add-btn">加入</button>
    </div>
    <div class="apply-bar">
      <div class="status" id="wh-status">尚未變更</div>
      <button class="btn ghost sm" id="wh-discard">還原</button>
      <button class="btn primary" id="btn-apply-wh" disabled>套用修改</button>
    </div>
  </div>

  <datalist id="item-options"></datalist>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  // 遊戲本體（A 頁）的 origin，postMessage 只信任這個來源送的訊息。
  var GAME_ORIGIN = 'https://nba9001-sys.github.io';

  var EQUIP_SLOTS = [
    ['head_top','頭上'], ['head_mid','頭中'], ['head_bottom','頭下'],
    ['weapon','武器'], ['armor','身體'], ['shield','盾牌'],
    ['garment','披風'], ['footgear','鞋子'],
    ['accessory1','飾品1'], ['accessory2','飾品2'], ['ammo','彈藥']
  ];

  var state = {
    init: null,        // A 頁傳來的 {slots, warehouse, currentSlot, itemMeta, jobMeta}
    selectedSlot: null,
    slotPatch: {},      // 目前編輯欄位的 patch（只含改過的 key）
    slotWorking: null,  // 目前編輯欄位的工作副本（顯示用，= 原始資料 + patch 疊加）
    whPatch: {},
    whWorking: null
  };

  var $ = function (id) { return document.getElementById(id); };
  function show(id) { $(id).classList.remove('hidden'); }
  function hide(id) { $(id).classList.add('hidden'); }

  function toast(msg, isErr) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.toggle('err', !!isErr);
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  // ---------------- A 頁通訊 ----------------
  var opener = window.opener;

  function sendToGame(msg) {
    if (!opener) return;
    try { opener.postMessage(msg, GAME_ORIGIN); } catch (e) { /* 忽略 */ }
  }

  window.addEventListener('message', function (ev) {
    if (ev.origin !== GAME_ORIGIN) return;
    if (!opener || ev.source !== opener) return;
    var data = ev.data;
    if (!data || typeof data !== 'object') return;

    if (data.type === 'ro-editor:init') {
      state.init = data;
      hide('screen-connecting');
      renderSlotList();
      show('screen-slots');
    } else if (data.type === 'ro-editor:applied') {
      if (data.ok) {
        toast('✅ 已套用到欄位 ' + (data.slot + 1));
        state.slotPatch = {};
        sendToGame({ type: 'ro-editor:refresh' }); // 拿一份套用後的最新資料
      } else {
        toast('⚠️ 套用失敗，該欄位可能沒有存檔', true);
      }
      updateSlotStatus();
    } else if (data.type === 'ro-editor:applied-warehouse') {
      if (data.ok) {
        toast('✅ 倉庫已更新');
        state.whPatch = {};
        sendToGame({ type: 'ro-editor:refresh' });
      } else {
        toast('⚠️ 倉庫套用失敗', true);
      }
      updateWhStatus();
    }
  });

  if (!opener) {
    setTimeout(function () {
      hide('connecting-loading');
      show('connecting-standalone');
    }, 300);
  } else {
    sendToGame({ type: 'ro-editor:ready' });
    setTimeout(function () {
      if (!state.init) {
        hide('connecting-loading');
        show('connecting-standalone');
      }
    }, 4000);
  }

  // ---------------- 道具對照表／datalist ----------------
  function itemLabel(id) {
    var meta = state.init && state.init.itemMeta && state.init.itemMeta[id];
    if (!meta) return id;
    return (meta.icon || '') + ' ' + meta.name;
  }
  function populateItemDatalist() {
    var dl = $('item-options');
    dl.innerHTML = '';
    var meta = (state.init && state.init.itemMeta) || {};
    var frag = document.createDocumentFragment();
    for (var id in meta) {
      var opt = document.createElement('option');
      opt.value = id;
      opt.label = (meta[id].icon || '') + ' ' + meta[id].name + '（' + id + '）';
      frag.appendChild(opt);
    }
    dl.appendChild(frag);
  }

  // ---------------- 欄位選擇畫面 ----------------
  function renderSlotList() {
    populateItemDatalist();
    var grid = $('slot-grid');
    grid.innerHTML = '';
    var slots = state.init.slots;
    var jobMeta = state.init.jobMeta || {};
    for (var i = 0; i < 15; i++) {
      var s = slots[i];
      var row = document.createElement('div');
      row.className = 'slot-row' + (s ? '' : ' empty');
      var jobName = s ? ((jobMeta[s.jobId] && jobMeta[s.jobId].name) || s.jobId) : '';
      row.innerHTML =
        '<div class="idx">' + (i + 1) + '</div>' +
        '<div class="info">' +
          '<div class="name">' + (s ? escapeHtml(s.name) : '（空）') + '</div>' +
          '<div class="meta">' + (s ? ('Lv.' + s.baseLevel + ' ' + escapeHtml(jobName) + '　' + (s.gold || 0) + ' z') : '沒有存檔') + '</div>' +
        '</div>' +
        (i === state.init.currentSlot ? '<div class="badge-live">遊玩中</div>' : '');
      if (s) {
        row.addEventListener('click', function (idx) {
          return function () { openSlotEditor(idx); };
        }(i));
      }
      grid.appendChild(row);
    }
  }

  $('btn-open-warehouse').addEventListener('click', function () { openWarehouseEditor(); });
  $('btn-refresh-slots').addEventListener('click', function () {
    toast('重新整理中…');
    sendToGame({ type: 'ro-editor:refresh' });
  });
  $('btn-back-slots').addEventListener('click', function () { backToSlots(); });
  $('btn-back-slots-2').addEventListener('click', function () { backToSlots(); });

  function backToSlots() {
    if (Object.keys(state.slotPatch).length && !confirm('目前的修改還沒套用，離開會遺失，確定嗎？')) return;
    if (Object.keys(state.whPatch).length && !confirm('倉庫的修改還沒套用，離開會遺失，確定嗎？')) return;
    state.selectedSlot = null;
    state.slotPatch = {}; state.whPatch = {};
    hide('screen-editor'); hide('screen-warehouse');
    show('screen-slots');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ---------------- 角色編輯畫面 ----------------
  var currentTab = 'basic';
  document.querySelectorAll('.tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentTab = btn.dataset.tab;
      ['basic', 'stats', 'inv', 'equip'].forEach(function (t) {
        (t === currentTab ? show : hide)('tab-' + t);
      });
    });
  });

  function openSlotEditor(idx) {
    state.selectedSlot = idx;
    state.slotPatch = {};
    state.slotWorking = JSON.parse(JSON.stringify(state.init.slots[idx]));
    var jobMeta = state.init.jobMeta || {};
    var jobName = (jobMeta[state.slotWorking.jobId] && jobMeta[state.slotWorking.jobId].name) || state.slotWorking.jobId;
    $('editor-who').innerHTML = escapeHtml(state.slotWorking.name) +
      '<small>欄位 ' + (idx + 1) + '　' + escapeHtml(jobName) +
      (idx === state.init.currentSlot ? '　🟢 遊玩中' : '') + '</small>';
    fillBasicFields();
    fillStatsFields();
    renderInvList();
    renderEquipGrid();
    updateSlotStatus();
    hide('screen-slots');
    show('screen-editor');
  }

  function fillBasicFields() {
    var w = state.slotWorking;
    $('f-gold').value = w.gold || 0;
    $('f-baseLevel').value = w.baseLevel || 1;
    $('f-baseExp').value = w.baseExp || 0;
    $('f-jobLevel').value = w.jobLevel || 1;
    $('f-jobExp').value = w.jobExp || 0;
  }
  function fillStatsFields() {
    var w = state.slotWorking;
    $('f-statPoints').value = w.statPoints || 0;
    $('f-skillPoints').value = w.skillPoints || 0;
    var st = w.stats || {};
    ['str', 'agi', 'vit', 'int', 'dex', 'luk'].forEach(function (k) {
      $('f-' + k).value = st[k] || 1;
    });
  }

  function bindNumberField(inputId, patchKey, isNested) {
    $(inputId).addEventListener('input', function () {
      var v = parseInt(this.value, 10);
      if (isNaN(v)) return;
      if (isNested) {
        var obj = state.slotPatch[isNested] ? state.slotPatch[isNested] : Object.assign({}, state.slotWorking[isNested]);
        obj[patchKey] = v;
        state.slotPatch[isNested] = obj;
        state.slotWorking[isNested][patchKey] = v;
      } else {
        state.slotPatch[patchKey] = v;
        state.slotWorking[patchKey] = v;
      }
      updateSlotStatus();
    });
  }
  bindNumberField('f-gold', 'gold');
  bindNumberField('f-baseLevel', 'baseLevel');
  bindNumberField('f-baseExp', 'baseExp');
  bindNumberField('f-jobLevel', 'jobLevel');
  bindNumberField('f-jobExp', 'jobExp');
  bindNumberField('f-statPoints', 'statPoints');
  bindNumberField('f-skillPoints', 'skillPoints');
  ['str', 'agi', 'vit', 'int', 'dex', 'luk'].forEach(function (k) {
    bindNumberField('f-' + k, k, 'stats');
  });

  function renderInvList() {
    var wrap = $('inv-list');
    wrap.innerHTML = '';
    var inv = state.slotWorking.inventory || [];
    if (!inv.length) { wrap.innerHTML = '<div class="empty-hint">背包是空的</div>'; return; }
    inv.forEach(function (row, idx) {
      var meta = (state.init.itemMeta || {})[row.item] || {};
      var line = document.createElement('div');
      line.className = 'list-row';
      var isInstance = !!row.instanceId;
      line.innerHTML =
        '<div class="ic">' + (meta.icon || '📦') + '</div>' +
        '<div class="nm">' + escapeHtml(meta.name || row.item) +
          (isInstance ? '<small>個體裝備（精煉/插卡），修改器不支援編輯，只能移除整件</small>' : '<small>' + row.item + '</small>') +
        '</div>' +
        (isInstance ? '' : '<input type="number" min="0" value="' + row.qty + '" data-idx="' + idx + '">') +
        '<button class="rm" data-idx="' + idx + '" title="移除">✕</button>';
      wrap.appendChild(line);
    });
    wrap.querySelectorAll('input[type=number]').forEach(function (inp) {
      inp.addEventListener('input', function () {
        var idx = parseInt(this.dataset.idx, 10);
        var v = parseInt(this.value, 10);
        if (isNaN(v) || v < 0) return;
        state.slotWorking.inventory[idx].qty = v;
        touchInventoryPatch();
      });
    });
    wrap.querySelectorAll('.rm').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var idx = parseInt(this.dataset.idx, 10);
        state.slotWorking.inventory.splice(idx, 1);
        touchInventoryPatch();
        renderInvList();
      });
    });
  }
  function touchInventoryPatch() {
    state.slotPatch.inventory = state.slotWorking.inventory.slice();
    updateSlotStatus();
  }
  $('inv-add-btn').addEventListener('click', function () {
    var id = $('inv-add-id').value.trim();
    var qty = parseInt($('inv-add-qty').value, 10) || 1;
    if (!id) return;
    if (state.init.itemMeta && !state.init.itemMeta[id]) {
      toast('⚠️ 找不到這個道具 ID，請從建議清單選一個', true);
      return;
    }
    var inv = state.slotWorking.inventory || (state.slotWorking.inventory = []);
    var existing = inv.find(function (r) { return r.item === id && !r.instanceId; });
    if (existing) existing.qty += qty;
    else inv.push({ item: id, qty: qty });
    touchInventoryPatch();
    renderInvList();
    $('inv-add-id').value = '';
    $('inv-add-qty').value = 1;
  });

  function renderEquipGrid() {
    var grid = $('equip-grid');
    grid.innerHTML = '';
    var equip = state.slotWorking.equip || {};
    EQUIP_SLOTS.forEach(function (pair) {
      var key = pair[0], label = pair[1];
      var val = equip[key];
      var field = document.createElement('div');
      field.className = 'field';
      var isInstance = val && state.slotWorking.instances && state.slotWorking.instances[val];
      field.innerHTML =
        '<label>' + label + (isInstance ? '（個體裝備，唯讀）' : '') + '</label>' +
        '<input list="item-options" data-key="' + key + '" value="' + (isInstance ? '' : (val || '')) + '"' +
        (isInstance ? ' disabled placeholder="' + escapeHtml(itemLabel(state.slotWorking.instances[val].item)) + '"' : ' placeholder="留空＝卸下"') + '>';
      grid.appendChild(field);
    });
    grid.querySelectorAll('input[data-key]').forEach(function (inp) {
      inp.addEventListener('change', function () {
        var key = this.dataset.key;
        var v = this.value.trim();
        if (v && state.init.itemMeta && !state.init.itemMeta[v]) {
          toast('⚠️ 找不到這個道具 ID，已還原', true);
          this.value = (state.slotWorking.equip[key] || '');
          return;
        }
        var eq = state.slotPatch.equip ? state.slotPatch.equip : Object.assign({}, state.slotWorking.equip);
        eq[key] = v || null;
        state.slotPatch.equip = eq;
        state.slotWorking.equip[key] = v || null;
        updateSlotStatus();
      });
    });
  }

  function updateSlotStatus() {
    var n = Object.keys(state.slotPatch).length;
    $('slot-status').textContent = n ? ('有 ' + n + ' 項變更尚未套用') : '尚未變更';
    $('slot-status').classList.toggle('dirty', !!n);
    $('btn-apply-slot').disabled = !n;
  }
  $('btn-discard').addEventListener('click', function () {
    if (!Object.keys(state.slotPatch).length) return;
    if (!confirm('放棄目前所有未套用的修改？')) return;
    openSlotEditor(state.selectedSlot);
  });
  $('btn-apply-slot').addEventListener('click', function () {
    if (!Object.keys(state.slotPatch).length) return;
    sendToGame({ type: 'ro-editor:apply', slot: state.selectedSlot, patch: state.slotPatch });
  });

  // ---------------- 倉庫編輯畫面 ----------------
  function openWarehouseEditor() {
    state.whPatch = {};
    state.whWorking = JSON.parse(JSON.stringify(state.init.warehouse || { items: [], gold: 0 }));
    $('wh-gold').value = state.whWorking.gold || 0;
    renderWhList();
    updateWhStatus();
    hide('screen-slots');
    show('screen-warehouse');
  }
  $('wh-gold').addEventListener('input', function () {
    var v = parseInt(this.value, 10);
    if (isNaN(v)) return;
    state.whPatch.gold = v;
    state.whWorking.gold = v;
    updateWhStatus();
  });
  function renderWhList() {
    var wrap = $('wh-list');
    wrap.innerHTML = '';
    var items = state.whWorking.items || [];
    if (!items.length) { wrap.innerHTML = '<div class="empty-hint">倉庫是空的</div>'; return; }
    items.forEach(function (row, idx) {
      var meta = (state.init.itemMeta || {})[row.item] || {};
      var isInstance = !!row.instanceId;
      var line = document.createElement('div');
      line.className = 'list-row';
      line.innerHTML =
        '<div class="ic">' + (meta.icon || '📦') + '</div>' +
        '<div class="nm">' + escapeHtml(meta.name || row.item) +
          (isInstance ? '<small>個體裝備，只能整件移除</small>' : '<small>' + row.item + '</small>') + '</div>' +
        (isInstance ? '' : '<input type="number" min="0" value="' + row.qty + '" data-idx="' + idx + '">') +
        '<button class="rm" data-idx="' + idx + '">✕</button>';
      wrap.appendChild(line);
    });
    wrap.querySelectorAll('input[type=number]').forEach(function (inp) {
      inp.addEventListener('input', function () {
        var idx = parseInt(this.dataset.idx, 10);
        var v = parseInt(this.value, 10);
        if (isNaN(v) || v < 0) return;
        state.whWorking.items[idx].qty = v;
        touchWhPatch();
      });
    });
    wrap.querySelectorAll('.rm').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var idx = parseInt(this.dataset.idx, 10);
        state.whWorking.items.splice(idx, 1);
        touchWhPatch();
        renderWhList();
      });
    });
  }
  function touchWhPatch() {
    state.whPatch.items = state.whWorking.items.slice();
    updateWhStatus();
  }
  $('wh-add-btn').addEventListener('click', function () {
    var id = $('wh-add-id').value.trim();
    var qty = parseInt($('wh-add-qty').value, 10) || 1;
    if (!id) return;
    if (state.init.itemMeta && !state.init.itemMeta[id]) {
      toast('⚠️ 找不到這個道具 ID', true);
      return;
    }
    var items = state.whWorking.items || (state.whWorking.items = []);
    var existing = items.find(function (r) { return r.item === id && !r.instanceId; });
    if (existing) existing.qty += qty;
    else items.push({ item: id, qty: qty });
    touchWhPatch();
    renderWhList();
    $('wh-add-id').value = '';
    $('wh-add-qty').value = 1;
  });
  function updateWhStatus() {
    var n = Object.keys(state.whPatch).length;
    $('wh-status').textContent = n ? ('有 ' + n + ' 項變更尚未套用') : '尚未變更';
    $('wh-status').classList.toggle('dirty', !!n);
    $('btn-apply-wh').disabled = !n;
  }
  $('wh-discard').addEventListener('click', function () {
    if (!Object.keys(state.whPatch).length) return;
    if (!confirm('放棄目前所有未套用的修改？')) return;
    openWarehouseEditor();
  });
  $('btn-apply-wh').addEventListener('click', function () {
    if (!Object.keys(state.whPatch).length) return;
    sendToGame({ type: 'ro-editor:apply-warehouse', patch: state.whPatch });
  });

})();
</script>
</body>
</html>
