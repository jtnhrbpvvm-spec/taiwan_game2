<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>開始遊戲 自動縮放注入器 V1</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:auto;padding:20px}
button{padding:10px 16px}
#log{border:1px solid #ccc;padding:10px;margin-top:10px;height:180px;overflow:auto;white-space:pre-wrap}
</style>
</head>
<body>
<h2>開始遊戲 自動縮放注入器 V1</h2>
<p>上傳遊戲 HTML，加入手機/平板/電腦自動縮放功能。</p>

<input type="file" id="fileInput" accept=".html">
<button id="injectBtn">開始注入</button>
<button id="downloadBtn" disabled>下載修改版</button>

<div id="log"></div>

<script>
let modifiedHtml="";
let originalName="";

function log(t){
 document.getElementById('log').textContent += t + "\n";
}

function buildCode(){
return `
<style id="auto-scale-upgrade">
html,body{
 overflow-x:auto !important;
}
</style>

<script>
(function(){

function autoScaleGame(){

 const w = window.innerWidth;

 let scale = 1;

 if(w < 500){
    scale = 0.60;
 }else if(w < 800){
    scale = 0.75;
 }else if(w < 1200){
    scale = 0.90;
 }

 document.body.style.transform = 'scale(' + scale + ')';
 document.body.style.transformOrigin = 'top left';
 document.body.style.width = (100 / scale) + '%';

 console.log('Auto Scale:', scale);
}

window.addEventListener('resize', autoScaleGame);
window.addEventListener('load', autoScaleGame);

setTimeout(autoScaleGame,500);
setTimeout(autoScaleGame,1500);

})();
<\/script>
`;
}

document.getElementById('injectBtn').onclick = async ()=>{
 const f=document.getElementById('fileInput').files[0];
 if(!f){ alert('請選擇 HTML'); return; }

 originalName=f.name;
 let html=await f.text();

 const code=buildCode();

 if(html.includes('</body>')){
   html=html.replace('</body>', code + '\n</body>');
 }else{
   html += code;
 }

 modifiedHtml=html;
 document.getElementById('downloadBtn').disabled=false;
 log('注入完成，可下載測試。');
};

document.getElementById('downloadBtn').onclick=()=>{
 const blob=new Blob([modifiedHtml],{type:'text/html'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download=originalName.replace('.html','_自動縮放版.html');
 a.click();
};
</script>
</body>
</html>
