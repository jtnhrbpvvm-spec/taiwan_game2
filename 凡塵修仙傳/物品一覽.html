<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>物品一覽</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--fg:#1f2328;--mute:#6b7280;--line:#e5e7eb;--head:#f1f2f4;--acc:#a78bfa;--acct:#6d28d9;--link:#6d28d9;--get:#15803d;--use:#1d4ed8;--warn:#b91c1c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111318;--card:#1a1d24;--fg:#e5e7eb;--mute:#9ca3af;--line:#2d323c;--head:#232730;--acct:#c4b5fd;--link:#c4b5fd;--get:#86efac;--use:#93c5fd;--warn:#fca5a5}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Microsoft JhengHei",system-ui,sans-serif}
a{color:var(--link);text-underline-offset:2px}
.wrap{max-width:1150px;margin:0 auto;padding:20px 16px}
.back{color:var(--mute);font-size:13px;text-decoration:none}
h1{font-size:22px;margin:4px 0}
h2{font-size:17px;margin:24px 0 10px}
.sub{color:var(--mute);font-size:13px;line-height:1.7}
.ctl{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2;display:flex;flex-direction:column;gap:8px}
.ctl input{box-sizing:border-box;width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;font-size:13px;padding:4px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);cursor:pointer}
.chips button.on{border-color:var(--acc);background:var(--acc);color:#111;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.card h3{margin:0 0 8px;font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card h3 .ic{font-size:22px}
.row{display:grid;grid-template-columns:auto 1fr;gap:8px;font-size:13.5px;line-height:1.7;margin-top:4px}
.row>b{white-space:nowrap}
.row.get>b{color:var(--get)}.row.use>b{color:var(--use)}
.row ul{margin:0;padding-left:18px}
.note{font-size:12.5px;color:var(--warn);margin-top:6px}
.tag{font-size:11.5px;padding:0 7px;border-radius:8px;background:var(--head);color:var(--mute);font-weight:normal}
table.mini{border-collapse:collapse;font-size:12.5px;margin-top:4px;width:100%}
table.mini td,table.mini th{border:1px solid var(--line);padding:3px 6px;text-align:left}
table.mini th{background:var(--head)}
mark{background:#fde68a;color:#111;border-radius:2px}
.empty{color:var(--mute);padding:20px;text-align:center}
</style></head><body><div class="wrap">
<a class="back" href="index.html">← 回攻略首頁</a>
<h1>🎒 物品一覽</h1>
<div class="sub">「<b>取得</b>」＝從哪裡拿，「<b>能力／用途</b>」＝拿來做什麼。掉落類只寫「有機會」，不列機率。</div>
<div class="ctl"><input id="q" placeholder="搜尋物品、取得方式或用途，例如：星允鐵、千寶閣、渡劫、壽元…"><div class="chips" id="fc"></div></div>
<div id="out"></div>
<div class="empty" id="empty" hidden>找不到符合的物品</div>
</div>
<script src="profile.js"></script>
<script src="site.js"></script>
<script src="items.js"></script>
<script>
const CATS=[...new Set(ITEMS.map(i=>i.cat))];
let fc="";
const qEl=document.getElementById("q");
const strip=s=>s.replace(/<[^>]+>/g,"");
const hl=(s,q)=>{if(!q)return s;return s.split(/(<[^>]+>)/).map(p=>p.startsWith("<")?p:p.split(q).join(`<mark>${q}</mark>`)).join("")};
function render(){
  document.getElementById("fc").innerHTML=["",...CATS].map(c=>`<button data-c="${c}" class="${fc===c?"on":""}">${c||"全部"}${c?` (${ITEMS.filter(i=>i.cat===c).length})`:""}</button>`).join("");
  document.querySelectorAll("#fc button").forEach(b=>b.onclick=()=>{fc=b.dataset.c;render()});
  const q=qEl.value.trim().replace(/[<>&"]/g,"");
  let h="",n=0;
  CATS.forEach(c=>{
    if(fc&&fc!==c)return;
    const list=ITEMS.filter(i=>i.cat===c&&(!q||strip(i.name+i.get.join("")+i.use.join("")+(i.note||"")).includes(q)));
    if(!list.length)return;n+=list.length;
    h+=`<h2>${c}</h2><div class="grid">${list.map(i=>`<div class="card" data-itm-self="${i.name}"><h3><span class="ic">${i.icon}</span>${hl(i.name,q)}</h3>
      <div class="row get"><b>取得</b><ul>${i.get.map(x=>`<li>${hl(x,q)}</li>`).join("")}</ul></div>
      <div class="row use"><b>能力／用途</b><ul>${i.use.map(x=>`<li>${hl(x,q)}</li>`).join("")}</ul></div>
      ${i.note?`<div class="note">${hl(i.note,q)}</div>`:""}</div>`).join("")}</div>`;
  });
  document.getElementById("out").innerHTML=h;
  document.getElementById("empty").hidden=n>0;
}
qEl.addEventListener("input",render);render();
</script></body></html>
