<title>夥伴一覽</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--fg:#1f2328;--mute:#6b7280;--line:#e5e7eb;--head:#f1f2f4;--acc:#a78bfa;--acct:#6d28d9;--link:#6d28d9;--warn:#b91c1c;
  --t至高:#be185d;--t帝境:#c2410c;--t尊者:#7e22ce;--t天驕:#1d4ed8;--bar:#8b5cf6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111318;--card:#1a1d24;--fg:#e5e7eb;--mute:#9ca3af;--line:#2d323c;--head:#232730;--acct:#c4b5fd;--link:#c4b5fd;--warn:#f87171;
  --t至高:#f9a8d4;--t帝境:#fdba74;--t尊者:#d8b4fe;--t天驕:#93c5fd;--bar:#a78bfa}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Microsoft JhengHei",system-ui,sans-serif}
a{color:var(--link);text-underline-offset:2px}
.wrap{max-width:1150px;margin:0 auto;padding:20px 16px}
.back{color:var(--mute);font-size:13px;text-decoration:none}
h1{font-size:22px;margin:4px 0}
h2{font-size:17px;margin:26px 0 10px}
.sub{color:var(--mute);font-size:13px;line-height:1.7}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 16px;font-size:14px;line-height:1.85}
.box b{color:var(--acct)}
.box ul{margin:0;padding-left:20px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:12px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13.5px;line-height:1.55}
th{background:var(--head);font-size:13px;white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ctl{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2;display:flex;flex-direction:column;gap:8px}
.ctl input{box-sizing:border-box;width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;font-size:13px;padding:4px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);cursor:pointer}
.chips button.on{border-color:var(--acc);background:var(--acc);color:#111;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--tc);border-radius:10px;padding:12px 14px;min-width:0}
.card h3{margin:0;font-size:17px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:baseline}
.card h3 .tt{color:var(--mute);font-size:13px;font-weight:normal}
.tier{font-size:12px;font-weight:bold;padding:0 8px;border-radius:9px;border:1px solid currentColor;color:var(--tc)}
.meta{color:var(--mute);font-size:12.5px;margin:4px 0 8px;line-height:1.6}
.pw{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;font-size:12px;margin-bottom:8px}
.pw .b{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.pw .b i{display:block;height:100%;background:var(--bar)}
.pw span:nth-child(3n){font-variant-numeric:tabular-nums;color:var(--mute)}
.fx{font-size:13.5px;line-height:1.65}
.fx b{color:var(--acct)}
.how{font-size:12.5px;color:var(--mute);margin-top:6px}
.no,.how.no{color:var(--warn)}
details{margin-top:6px}details summary{cursor:pointer;color:var(--acct);font-size:12.5px}
details p{font-size:13px;color:var(--mute);line-height:1.7;margin:4px 0 0}
mark{background:#fde68a;color:#111;border-radius:2px}
.empty{color:var(--mute);padding:20px;text-align:center}
.tag{font-size:11px;padding:0 6px;border-radius:8px;background:var(--head);color:var(--mute);font-weight:normal}
</style></head><body><div class="wrap">

    ${howGet(p)}
    <details><summary>戰力分析</summary><p>${hl(p.analysis)}</p></details></div>`).join("");
  document.getElementById("empty").hidden=list.length>0;
}
qEl.addEventListener("input",render);render();
</script></body></html>
