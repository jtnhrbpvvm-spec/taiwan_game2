  const groups=[];
  D[cur].forEach(r=>{let g=groups.find(x=>x.grade===r.grade);if(!g)groups.push(g={grade:r.grade,color:r.color,rainbow:r.rainbow,ch:0,items:[]});g.ch+=r.chance;g.items.push(r)});
  groups.sort((a,b)=>a.ch-b.ch);groups.forEach(g=>g.items.sort((a,b)=>a.chance-b.chance));
  let h=`<table><thead><tr><th>名稱</th><th>能力加成</th></tr></thead><tbody>`,n=0;
  groups.forEach(g=>{
    const items=g.items.filter(r=>!q||(r.name+r.desc+r.grade+r.eff.join("")).includes(q));
    if(!items.length)return;n+=items.length;
    h+=`<tr class="g"><td colspan="2"><span class="grade ${g.rainbow?"rainbow":""}" style="${fill(g)}">${esc(g.grade)}</span>　${q?items.length+" / ":""}${g.items.length} 種</td></tr>`;
    items.forEach(r=>{h+=`<tr><td><div class="nm">${r.icon} ${hl(r.name,q)}</div><div class="desc">${hl(r.desc,q)}</div></td><td><div class="eff">${r.eff.map(e=>`<span class="${/ -/.test(e)?"neg":""}">${hl(e,q)}</span>`).join("")}</div></td></tr>`});
  });
  document.getElementById("out").innerHTML=n?h+"</tbody></table>":`<div class="empty">找不到符合「${esc(q)}」的項目</div>`;
  chips();
}
qEl.addEventListener("input",render);
// ---- 抽數試算 ----
const BOTH_TOP=0.0004,TOP={roots:"至尊靈根",phys:"神體"};
function gradeOrder(k){const m={};D[k].forEach(r=>m[r.grade]=(m[r.grade]||0)+r.chance);return Object.keys(m).sort((a,b)=>m[a]-m[b])}
function fillSel(id,k){
  let h=`<option value="">不限（隨便都好）</option>`;
  gradeOrder(k).forEach(g=>{const it=D[k].filter(r=>r.grade===g);
    h+=`<optgroup label="${g}">`+(it.length>1?`<option value="g:${g}">任一種${g}（${it.length} 種都可以）</option>`:"")+it.map(r=>`<option value="n:${r.name}">${r.icon} ${r.name}</option>`).join("")+`</optgroup>`});
  document.getElementById(id).innerHTML=h;
}
// 選到的項目：p＝一般擲骰抽中的機會；top＝在最頂級組裡佔的比例（算兩項同時最頂級那一道用）
function target(k,v){
  if(!v)return{p:1,top:1,any:true};
  const it=D[k].filter(r=>v.startsWith("g:")?r.grade===v.slice(2):r.name===v.slice(2));
  const n=D[k].filter(r=>r.grade===TOP[k]).length;
  return{p:it.reduce((s,r)=>s+r.chance,0),top:it.filter(r=>r.grade===TOP[k]).length/n};
}
const geoQ=(p,q)=>p>=1?1:Math.max(1,Math.ceil(Math.log(1-q)/Math.log(1-p)));
// 兩種丹藥各自抽到為止，合計顆數的分位數
function sumQ(p1,p2,qs){
  if(p1>=1)return qs.map(q=>geoQ(p2,q)-1);if(p2>=1)return qs.map(q=>geoQ(p1,q)-1);
  const out=[];let qi=0,n=1;const a=1-p1,b=1-p2;
  while(qi<qs.length&&n<5e6){n++;let c=0,t=p1;for(let k=1;k<n;k++){c+=t*(1-Math.pow(b,n-k));t*=a}
    while(qi<qs.length&&c>=qs[qi]){out.push(n);qi++}
    if(n>20000){const mean=1/p1+1/p2;while(qi<qs.length)out.push(Math.round(mean*-Math.log(1-qs[qi]))),qi++}}
  return out;
}
const fmt=n=>n.toLocaleString("zh-TW");
function rowHtml(label,med,max,scale){return`<div class="row"><span>${label}</span><span class="rng"><small>中間值</small> <b>${fmt(med)}</b> <small>～ 最多約</small> <b>${fmt(max)}</b> <small>次</small></span></div><div class="range"><i style="left:${med/scale*100}%;right:${100-max/scale*100}%"></i></div>`}
function calc(){
  const vr=document.getElementById("selR").value,vp=document.getElementById("selP").value;
  const R=target("roots",vr),P=target("phys",vp);
  if(!vr&&!vp){document.getElementById("calcOut").innerHTML=`<div class="empty">請至少選一個想要的靈根或體質</div>`;return}
  // 入門測試：兩項一起抽
  const pBoth=(1-BOTH_TOP)*R.p*P.p+BOTH_TOP*R.top*P.top;
  const f=[geoQ(pBoth,.5),geoQ(pBoth,.99)];
  let h=`<div class="cards"><div class="card"><h3>🎲 入門資質測試「再來一次」</h3><div class="how">第一次拜入宗門時可以免費無限重抽，但靈根和體質會一起重抽，必須同一次同時抽中。</div>${rowHtml("抽到想要的組合",f[0],f[1],f[1])}</div>`;
  // 丹藥：各自重抽，抽到就保留
  const rows=[];
  if(vr)rows.push(["🧪 洗髓丹（重測靈根）",geoQ(R.p,.5),geoQ(R.p,.99)]);
  if(vp)rows.push(["🦴 伐骨丹（重測體質）",geoQ(P.p,.5),geoQ(P.p,.99)]);
  const tot=vr&&vp?sumQ(R.p,P.p,[.5,.99]):[rows[0][1],rows[0][2]];
  const scale=Math.max(tot[1],...rows.map(r=>r[2]));
  h+=`<div class="card"><h3>💊 入門後用丹藥重測</h3><div class="how">兩種丹藥各自只重抽一項，抽到想要的就保留，另一項不受影響。每顆丹藥 1 顆七彩補天石。</div>${rows.map(r=>rowHtml(r[0],r[1],r[2],scale)).join("")}${vr&&vp?rowHtml("🌈 合計七彩補天石",tot[0],tot[1],scale):""}</div></div>`;
  document.getElementById("calcOut").innerHTML=h;
}
fillSel("selR","roots");fillSel("selP","phys");
document.getElementById("selR").value="g:至尊靈根";document.getElementById("selP").value="g:神體";
["selR","selP"].forEach(id=>document.getElementById(id).addEventListener("change",calc));
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  const c=b.dataset.k==="calc";document.getElementById("calc").hidden=!c;document.getElementById("list").hidden=c;
  if(c)calc();else{cur=b.dataset.k;render()}});
render();
</script></body></html>
