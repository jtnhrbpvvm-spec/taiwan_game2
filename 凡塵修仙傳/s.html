<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>開啟分享的配裝</title>
<style>
:root{--bg:#f7f7f9;--fg:#1f2430;--mute:#5b6472;--link:#5b3fd6;--card:#fff;--line:#d9dce3}
@media(prefers-color-scheme:dark){:root{--bg:#111318;--fg:#e6e8ee;--mute:#9ca3af;--link:#c4b5fd;--card:#1a1d24;--line:#2c313c}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:560px;margin:18vh auto 0;padding:0 18px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
a{color:var(--link)}small{color:var(--mute)}
</style></head><body><div class="wrap"><div class="box">
<div id="msg">正在開啟分享的配裝…</div>
<small id="sub"></small>
</div></div>
<script>
// 短連結的中繼頁：用代號向短網址服務問回完整連結，再轉到試算頁。這樣手機上的聊天軟體就算不會自動跳轉、或把網址後半截吃掉，也打得開。
(async function(){
  const msg=document.getElementById("msg"),sub=document.getElementById("sub"),id=(location.search.slice(1).split("&")[0]||"").trim();
  const calc=new URL("屬性與技能.html",location.href).href,fail=t=>{msg.innerHTML=t;sub.innerHTML='<a href="'+calc+'">前往屬性與技能試算</a>'};
  if(!/^[\w-]{3,24}$/.test(id))return fail("這條分享連結不完整，請對方重新複製。");
  try{
    const c=new AbortController(),tm=setTimeout(()=>c.abort(),12000);
    const r=await fetch("https://da.gd/coshorten/"+id,{signal:c.signal});clearTimeout(tm);
    const long=(await r.text()).trim(),i=long.indexOf("#b=");
    // 只接受指回這個攻略站試算頁的連結
    if(!r.ok||i<0||!/^[\w-]+$/.test(long.slice(i+3))||new URL(long).origin!==location.origin)return fail("找不到這條分享連結，可能已經失效，請對方重新分享。");
    location.replace(calc+long.slice(i));
  }catch(e){fail("這個網路連不上短網址服務，所以打不開這條短連結。<br>請對方改傳「分享配裝」產生的長連結，或換個網路（例如關掉擋廣告的 DNS、VPN）再試一次。")}
})();
</script></body></html>
