<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>套裝效果一覽</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--fg:#1f2328;--mute:#6b7280;--line:#e5e7eb;--head:#f1f2f4;--acc:#a78bfa;
  --金:#8a6500;--木:#15803d;--水:#2563eb;--火:#dc2626;--土:#92400e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111318;--card:#1a1d24;--fg:#e5e7eb;--mute:#9ca3af;--line:#2d323c;--head:#232730;
  --金:#facc15;--木:#4ade80;--水:#60a5fa;--火:#f87171;--土:#d6a36a}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Microsoft JhengHei",system-ui,sans-serif}
.wrap{max-width:1150px;margin:0 auto;padding:20px 16px}
.back{color:var(--mute);font-size:13px;text-decoration:none}
h1{font-size:22px;margin:4px 0}
.sub{color:var(--mute);font-size:13px;line-height:1.7}
.rules{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:12px 0;font-size:14px;line-height:1.8}
.rules b{color:var(--acct)}
.ctl{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2;display:flex;flex-direction:column;gap:8px}
.ctl input{box-sizing:border-box;width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;font-size:13px;padding:4px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);cursor:pointer}
.chips button.on{border-color:var(--acc);background:var(--acc);color:#111;font-weight:bold}
h2{font-size:17px;margin:24px 0 8px}
.tmpl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;font-size:13px}
.tmpl span{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px 9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:8px;padding:12px 14px}
.card h3{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
.el{font-size:12px;font-weight:bold;padding:0 8px;border-radius:9px;border:1px solid currentColor}
.th{font-size:12px;color:var(--mute);font-weight:normal;margin-left:auto}
.tiers{margin:8px 0;display:flex;flex-direction:column;gap:4px}
.tier{display:flex;gap:8px;font-size:13.5px;line-height:1.5}
.tier b{flex:none;background:var(--head);border-radius:4px;padding:0 6px;font-size:12px;height:20px;line-height:20px;white-space:nowrap}
.pcs{width:100%;border-collapse:collapse;font-size:13px}
.pcs td{padding:5px 4px;border-top:1px dashed var(--line);vertical-align:top}
.pcs td.s{color:var(--mute);white-space:nowrap;width:36px}
.pcs td.n{white-space:nowrap;font-weight:bold}
.fx{color:var(--acct);font-weight:bold;white-space:nowrap}
.fxd{color:var(--mute);font-size:12px}
.c金{color:var(--金);--c:var(--金)}.c木{color:var(--木);--c:var(--木)}.c水{color:var(--水);--c:var(--水)}.c火{color:var(--火);--c:var(--火)}.c土{color:var(--土);--c:var(--土)}
.card.c金,.card.c木,.card.c水,.card.c火,.card.c土{color:var(--fg)}
mark{background:#fde68a;color:#111;border-radius:2px}
.empty{color:var(--mute);padding:24px;text-align:center}
:root{--link:#6d28d9;--acct:#6d28d9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--link:#c4b5fd;--acct:#c4b5fd}}
a{color:var(--link);text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}

<h1>❖ 套裝效果一覽</h1>
<div class="rules">
共 <b>30 組套裝</b>＝6 種主題（物攻、法攻、防禦、閃避、屬性、收益）× 5 種五行，每組 <b>6 件</b>，部位都不同，可以同時穿滿。<br>
只計算 <b>紫色以上</b>（紫、橙、白金）的件數；穿到 <b>2／4／6 件</b>分別啟動三階效果，而且會累加。<br>
取得：秘境「<b>魔屠天南</b>」守城掉落，一次只掉一件；每 10 波的首領波必掉 1 件，第 20 波起一般波也可能掉。拍賣場不賣套裝部件。<br>
💡 同一組套裝 6 件都是同一種五行，所以穿滿 6 件也會觸發該五行的「星君加持」（見<a href="五行共鳴一覽.html">五行共鳴一覽</a>）。<br>
部件特效的數值依品質：<b>紫／橙／白金</b>，同名特效多件相加，有上限。
</div>
<div class="ctl">
  <input id="q" placeholder="搜尋套裝名、效果、部件或特效，例如：太乙、連發、閃避、破甲、刀…">
  <div class="chips" id="fTheme"></div>
  <div class="chips" id="fElem"></div>
</div>
<div id="out"></div>
</div>

let fT="",fE="";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hl=(s,q)=>{s=esc(s);if(!q)return s;const e=esc(q);return s.split(e).join(`<mark>${e}</mark>`)};
function chips(){
  document.getElementById("fTheme").innerHTML=["",...THEMES].map(t=>`<button data-t="${t}" class="${fT===t?"on":""}">${t?TICON[t]+" "+t:"全部主題"}</button>`).join("");
  document.getElementById("fElem").innerHTML=["",...EL].map(e=>`<button data-e="${e}" class="${fE===e?"on":""} ${e?"c"+e:""}">${e||"全部五行"}</button>`).join("");
  document.querySelectorAll("#fTheme button").forEach(b=>b.onclick=()=>{fT=b.dataset.t;render()});
  document.querySelectorAll("#fElem button").forEach(b=>b.onclick=()=>{fE=b.dataset.e;render()});
}
// 已帶入角色時：標出身上穿的套裝部件（紫色以上才算件數）
const PF=window.PROFILE||null;
function worn(s){
  const o={any:0,n:0,slots:{}};if(!PF)return o;
  s.pieces.forEach(p=>{const q=(PF.equipment||{})[p.slot];if(q&&q._set===s.name){o.any++;o.slots[p.slot]=1;if(["紫色","橙色","白金"].includes(q.quality))o.n++}});
  return o;
}
function render(){
  chips();
  const q=document.getElementById("q").value.trim();let h="",n=0;
  THEMES.forEach(t=>{
    if(fT&&fT!==t)return;
    const list=SETS.filter(s=>s.theme===t&&(!fE||s.elem===fE)&&(!q||(s.name+s.theme+s.elem+s.tiers.map(x=>x.desc).join("")+s.pieces.map(p=>p.slot+p.name+p.fx+p.fxDesc).join("")).includes(q)));
    if(!list.length)return;n+=list.length;
    h+=`<h2>${TICON[t]} ${t}套裝 <span class="sub">（${list.length} 組）</span></h2><div class="grid">`;
    list.forEach(s=>{
      const w=worn(s);
      h+=`<div class="card c${s.elem}"><h3>${hl(s.name,q)}<span class="el c${s.elem}">${s.elem}</span><span class="th">${t}</span></h3>
      ${PF&&w.any?`<div style="font-size:13px;font-weight:bold;color:var(--acct);margin-bottom:4px">👤 你穿了 ${w.any} 件${w.any>w.n?`（其中 ${w.n} 件紫色以上、算進套裝）`:""}</div>`:""}
      <div class="tiers">${s.tiers.map(x=>`<div class="tier"><b>${PF&&w.n>=x.n?"✅ ":""}${x.n} 件</b><span>${hl(x.desc,q)}</span></div>`).join("")}</div>
      <table class="pcs">${s.pieces.map(p=>`<tr><td class="s">${w.slots[p.slot]?"✅ ":""}${hl(p.slot,q)}</td><td class="n">${hl(p.name,q)}</td><td><span class="fx">${hl(p.fx,q)}</span> <span class="fxd">${hl(p.fxDesc,q)}（上限 ${p.cap}）</span></td></tr>`).join("")}</table></div>`;
    });
    h+="</div>";
  });
  document.getElementById("out").innerHTML=n?h:`<div class="empty">找不到符合的套裝</div>`;
}
document.getElementById("q").addEventListener("input",render);render();
if(PF){const act=SETS.map(s=>[s,worn(s)]).filter(x=>x[1].any);
  document.getElementById("out").insertAdjacentHTML("beforebegin",`<div style="background:var(--card);border:1px solid var(--acct);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:14px;line-height:1.8">👤 你身上的套裝：${act.length?act.map(([s,w])=>{const on=s.tiers.filter(x=>w.n>=x.n);return `<b>${s.name}套 ${w.n} 件</b>（${on.length?on.map(x=>x.desc).join("；"):"還沒到 2 件，尚未生效"}）`}).join("、"):"目前沒有穿任何套裝部件。"}</div>`)}
