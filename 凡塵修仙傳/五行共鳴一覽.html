<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>五行共鳴一覽</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--fg:#1f2328;--mute:#6b7280;--line:#e5e7eb;--head:#f1f2f4;--acc:#a78bfa;
  --金:#8a6500;--木:#15803d;--水:#2563eb;--火:#dc2626;--土:#92400e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111318;--card:#1a1d24;--fg:#e5e7eb;--mute:#9ca3af;--line:#2d323c;--head:#232730;
  --金:#facc15;--木:#4ade80;--水:#60a5fa;--火:#f87171;--土:#d6a36a}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Microsoft JhengHei",system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:26px 0 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 small{font-weight:normal;color:var(--mute);font-size:13px}
.sub{color:var(--mute);font-size:13px;line-height:1.7}
.rules{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:12px 0;font-size:14px;line-height:1.8}
.rules b{color:var(--acct)}
.tabs{display:flex;gap:8px;margin:14px 0}
.tabs button{font:inherit;padding:8px 16px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;cursor:pointer}
.tabs button.on{border-color:var(--acc);box-shadow:inset 0 -3px 0 var(--acc);font-weight:bold}
.ctl{position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:2}
.ctl input{box-sizing:border-box;width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px;line-height:1.55}
th{background:var(--head);font-size:13px;white-space:nowrap}
.nm{font-weight:bold;white-space:nowrap}
.eff{color:var(--fg)}.note{color:var(--mute);font-size:12px;margin-top:2px}
.lay{display:flex;gap:3px;flex-wrap:wrap}
.lay span{font-size:12.5px;padding:1px 7px;border-radius:4px;border:1px solid currentColor;white-space:nowrap;font-weight:bold}
.lay span.free{color:var(--mute);font-weight:normal;border-style:dashed}
.e金{color:var(--金)}.e木{color:var(--木)}.e水{color:var(--水)}.e火{color:var(--火)}.e土{color:var(--土)}
.also{font-size:12px;color:var(--mute);margin-top:4px}
mark{background:#fde68a;color:#111;border-radius:2px}
.empty{color:var(--mute);padding:20px;text-align:center}
.calc{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0}
.calc label{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:bold;font-size:18px}
.calc .st{display:flex;align-items:center;gap:6px}
.calc button{font:inherit;width:32px;height:32px;border-radius:6px;border:1px solid var(--line);background:var(--head);color:var(--fg);cursor:pointer;font-size:18px;line-height:1}
.calc output{min-width:28px;text-align:center;font-size:20px;color:var(--fg);font-variant-numeric:tabular-nums}
.total{font-size:14px;margin-bottom:8px}.total.bad{color:var(--火)}
.res{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
.res .it{padding:8px 0;border-top:1px dashed var(--line)}.res .it:first-child{border-top:0}
.res .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:var(--head);color:var(--mute);margin-right:6px;vertical-align:1px}
.hint{font-size:13px;color:var(--mute);margin-top:10px;line-height:1.7}
@media (max-width:640px){.calc{grid-template-columns:repeat(3,1fr)}
  .nm,th{white-space:normal}th,td{padding:7px 6px;font-size:13px}
  #out table{display:block;overflow-x:auto}}
:root{--link:#6d28d9;--acct:#6d28d9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--link:#c4b5fd;--acct:#c4b5fd}}
a{color:var(--link);text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}
</style></head><body><div class="wrap">
<a href="index.html" style="color:var(--mute);font-size:13px;text-decoration:none">← 回攻略首頁</a>
<h1>☯️ 五行共鳴一覽</h1>
<div class="rules">
計算範圍：身上 <b>17 個裝備部位</b>的五行（<b>神器不算</b>）。每件鍛造裝備帶一種五行：金、木、水、火、土。<br>
<b>套數</b>＝五種五行件數裡最少的那個，也就是能湊出幾組完整的「金木水火土」；<b>剩餘</b>＝某五行件數 − 套數。<br>
① <b>星君加持</b>：同一五行 ≥ 5 件就啟動，可以同時有好幾種（17 格最多 3 種）。<br>
② <b>特殊共鳴</b>：同時只會有一個，優先順序是 <b>五行聖共鳴 ＞ 純化共鳴 ＞ 雙屬性共鳴</b>。<br>
①② 可以疊加：倍率類（攻擊、氣血、技能傷害…）互相相乘，數值類（屬性傷害、減傷、回血）相加。
</div>
<div class="tabs"><button data-k="list" class="on">📜 共鳴列表（22 種）</button><button data-k="calc">🧮 配裝試算</button></div>

<div id="pList">
<div class="ctl"><input id="q" placeholder="搜尋名稱、效果或五行，例如：雷、減傷、火、攻擊…"></div>
<div id="out"></div>
</div>

<div id="pCalc" hidden>
<div class="sub">輸入 17 件裝備（不含神器）各五行的件數，看會啟動哪些共鳴。</div>
<div class="calc" id="calcIn"></div>
<div class="total" id="total"></div>
<div class="res" id="calcOut"></div>
</div>
</div>
<script src="profile.js"></script>
<script>
const EL=["金","木","水","火","土"];
// lay＝一種可以達成的 17 格配法（free＝不論屬性）
const DATA=[
 {cat:"五行聖共鳴",catNote:"3 套完整五行（15 件），剩下 2 件不論屬性。優先權最高。",items:[
  {name:"五行聖共鳴",icon:"☯️",eff:"全屬性傷害 +15%（冰／火／毒／金／雷）、減傷 +15%、攻擊 +30%，且不受五行相剋影響（雙向都不生效）",
   cond:"金、木、水、火、土各 ≥ 3 件",lay:{金:3,木:3,水:3,火:3,土:3,free:2},also:"剩下 2 件如果放同一種五行，那一種就湊到 5 件，會再多一個星君加持（例如截圖的「土靈星君加持」）"}]},
 {cat:"純化共鳴",catNote:"2 套五行 ＋ 某一五行再多 6 件（共 16 件）。",items:[
  {name:"冰共鳴",icon:"❄️",eff:"冰傷 +25%、自身被凍結機率減半",cond:"2 套五行 ＋ 水多 6 件（水 ≥ 8，其他各 ≥ 2）",lay:{金:2,木:2,水:8,火:2,土:2,free:1},also:"水 8 件 → 同時啟動水靈星君加持"},
  {name:"炎共鳴",icon:"🔥",eff:"火傷 +25%、燒傷可疊 4 層（預設 3 層）",cond:"2 套五行 ＋ 火多 6 件（火 ≥ 8，其他各 ≥ 2）",lay:{金:2,木:2,水:2,火:8,土:2,free:1},also:"火 8 件 → 同時啟動火靈星君加持"},
  {name:"罡共鳴",icon:"⚔️",eff:"金傷 +25%",cond:"2 套五行 ＋ 金多 6 件（金 ≥ 8，其他各 ≥ 2）",lay:{金:8,木:2,水:2,火:2,土:2,free:1},also:"金 8 件 → 同時啟動金靈星君加持"},
  {name:"生共鳴",icon:"🌿",eff:"戰鬥中每回合回復最大氣血 3%",cond:"2 套五行 ＋ 木多 6 件（木 ≥ 8，其他各 ≥ 2）",lay:{金:2,木:8,水:2,火:2,土:2,free:1},also:"木 8 件 → 同時啟動木靈星君加持"},
  {name:"岩共鳴",icon:"🛡️",eff:"減傷 +10%",cond:"2 套五行 ＋ 土多 6 件（土 ≥ 8，其他各 ≥ 2）",lay:{金:2,木:2,水:2,火:2,土:8,free:1},also:"土 8 件 → 同時啟動土靈星君加持"}]},
 {cat:"雙屬性共鳴",catNote:"1 套五行 ＋ 兩種五行各再多 5 件（共 15 件）。金＋水會依哪種比較多分成兩種。",items:[
  {name:"雷共鳴",icon:"⚡",eff:"雷傷 +25%",cond:"1 套五行 ＋ 金、水各多 5 件，而且<b>水比金多</b>",lay:{金:6,木:1,水:7,火:1,土:1,free:1},also:"金、水都 ≥ 5 → 同時啟動金、水靈星君加持"},
  {name:"毒共鳴",icon:"☠️",eff:"毒傷 +25%",cond:"1 套五行 ＋ 金、水各多 5 件，而且<b>金 ≥ 水</b>（一樣多也算這個）",lay:{金:6,木:1,水:6,火:1,土:1,free:2},also:"金、水都 ≥ 5 → 同時啟動金、水靈星君加持"},
  {name:"庚共鳴",icon:"⚔️",eff:"金傷 +20%、攻擊 +10%",cond:"1 套五行 ＋ 金、木各多 5 件",lay:{金:6,木:6,水:1,火:1,土:1,free:2},also:"同時啟動金、木靈星君加持"},
  {name:"煉共鳴",icon:"⚔️",eff:"金傷 +20%、技能傷害 +10%",cond:"1 套五行 ＋ 金、火各多 5 件",lay:{金:6,木:1,水:1,火:6,土:1,free:2},also:"同時啟動金、火靈星君加持"},
  {name:"鋒岩共鳴",icon:"🛡️",eff:"減傷 +8%、金傷 +15%",cond:"1 套五行 ＋ 金、土各多 5 件",lay:{金:6,木:1,水:1,火:1,土:6,free:2},also:"同時啟動金、土靈星君加持"},
  {name:"榮共鳴",icon:"🌿",eff:"戰鬥中每回合回復 2%、氣血上限 +10%",cond:"1 套五行 ＋ 木、水各多 5 件",lay:{金:1,木:6,水:6,火:1,土:1,free:2},also:"同時啟動木、水靈星君加持"},
  {name:"焚共鳴",icon:"🔥",eff:"火傷 +20%、攻擊 +10%",cond:"1 套五行 ＋ 木、火各多 5 件",lay:{金:1,木:6,水:1,火:6,土:1,free:2},also:"同時啟動木、火靈星君加持"},
  {name:"蠱共鳴",icon:"☠️",eff:"毒傷 +20%、中毒可疊 7 層（預設 5 層）",cond:"1 套五行 ＋ 木、土各多 5 件",lay:{金:1,木:6,水:1,火:1,土:6,free:2},also:"同時啟動木、土靈星君加持"},
  {name:"既濟共鳴",icon:"❄️",eff:"冰傷、火傷各 +15%",cond:"1 套五行 ＋ 水、火各多 5 件",lay:{金:1,木:1,水:6,火:6,土:1,free:2},also:"同時啟動水、火靈星君加持"},
  {name:"瘴共鳴",icon:"☠️",eff:"毒傷 +20%、氣血上限 +10%",cond:"1 套五行 ＋ 水、土各多 5 件",lay:{金:1,木:1,水:6,火:1,土:6,free:2},also:"同時啟動水、土靈星君加持"},
  {name:"熔共鳴",icon:"🔥",eff:"火傷 +20%、減傷 +8%",cond:"1 套五行 ＋ 火、土各多 5 件",lay:{金:1,木:1,水:1,火:6,土:6,free:2},also:"同時啟動火、土靈星君加持"}]},
 {cat:"星君加持（單屬性）",catNote:"同一五行 ≥ 5 件就啟動，可同時多種，並且可以和上面的特殊共鳴疊加。",items:[
  {name:"金靈星君加持",icon:"⚔️",eff:"技能傷害 +20%",note:"宗門技能與靈寶閣禁術的傷害 ×1.2（普攻、靈寵技能不受影響）。適合技能流。",cond:"金 ≥ 5 件",lay:{金:5,free:12}},
  {name:"木靈星君加持",icon:"🌿",eff:"生命恢復 +20%",note:"安全區打坐每秒回血由最大氣血 10% 提升為 12%（野外戰鬥中無效）。效果最弱，只加快回城療傷。",cond:"木 ≥ 5 件",lay:{木:5,free:12}},
  {name:"水靈星君加持",icon:"💧",eff:"生命 +20%",note:"氣血上限 ×1.2（含境界帶來的部分）。生存流，高難度地圖常被打回城時選它。",cond:"水 ≥ 5 件",lay:{水:5,free:12}},
  {name:"火靈星君加持",icon:"🔥",eff:"傷害 +20%",note:"物理與法術攻擊力 ×1.2，普攻、宗門技能、靈寵攻擊都提升。輸出流，最通用的首選。",cond:"火 ≥ 5 件",lay:{火:5,free:12}},
  {name:"土靈星君加持",icon:"⛰️",eff:"體質 +20%",note:"遊戲寫體質 +20%，實際是氣血上限的增益 +20%（體質點數不變），效果和水靈星君相同。",cond:"土 ≥ 5 件",lay:{土:5,free:12}}]}
];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip=s=>s.replace(/<[^>]+>/g,"");
const hl=(s,q,raw)=>{s=raw?s:esc(s);if(!q)return s;const e=esc(q);return s.split(/(<[^>]+>)/).map(p=>p.startsWith("<")?p:p.split(e).join(`<mark>${e}</mark>`)).join("")};
const layHtml=l=>`<div class="lay">${EL.filter(e=>l[e]).map(e=>`<span class="e${e}">${e}×${l[e]}</span>`).join("")}${l.free?`<span class="free">任意×${l.free}</span>`:""}</div>`;
const qEl=document.getElementById("q");
function render(){
  const q=qEl.value.trim();let h="",n=0;
  DATA.forEach(g=>{
    const it=g.items.filter(r=>!q||(g.cat+r.name+r.eff+(r.note||"")+strip(r.cond)+(r.also||"")).includes(q));
    if(!it.length)return;n+=it.length;
    h+=`<h2>${esc(g.cat)} <small>${esc(g.catNote)}</small></h2><table><thead><tr><th>名稱</th><th>能力</th><th>達成條件</th><th>配法範例（17 格）</th></tr></thead><tbody>`;
    it.forEach(r=>{h+=`<tr><td class="nm">${r.icon} ${hl(r.name,q)}</td><td><div class="eff">${hl(r.eff,q)}</div>${r.note?`<div class="note">${hl(r.note,q)}</div>`:""}</td><td>${hl(r.cond,q,true)}${r.also?`<div class="also">＋ ${hl(r.also,q)}</div>`:""}</td><td>${layHtml(r.lay)}</td></tr>`});
    h+="</tbody></table>";
  });
  document.getElementById("out").innerHTML=n?h:`<div class="empty">找不到符合「${esc(q)}」的共鳴</div>`;
}
qEl.addEventListener("input",render);render();

// ---- 配裝試算 ----
const cnt={金:3,木:3,水:3,火:3,土:5};
// 已帶入角色時：用身上 17 件裝備的五行當起點，並在最上面顯示目前啟動的共鳴
const PF=window.PROFILE||null;
if(PF){EL.forEach(e=>cnt[e]=0);Object.keys(PF.equipment||{}).forEach(s=>{const q=PF.equipment[s];if(s!=="神器"&&q&&cnt[q.element]!==undefined)cnt[q.element]++})}
const find=nm=>DATA.flatMap(g=>g.items).find(r=>r.name===nm);
const PURE={水:"冰共鳴",火:"炎共鳴",金:"罡共鳴",木:"生共鳴",土:"岩共鳴"};
const DUAL={"木+水":"榮共鳴","金+木":"庚共鳴","金+火":"煉共鳴","金+土":"鋒岩共鳴","木+火":"焚共鳴","木+土":"蠱共鳴","水+火":"既濟共鳴","水+土":"瘴共鳴","火+土":"熔共鳴"};
function judge(c){
  const sets=Math.min(...EL.map(e=>c[e])),rest={};EL.forEach(e=>rest[e]=c[e]-sets);
  const singles=EL.filter(e=>c[e]>=5);let sp=null;
  if(sets>=3)sp="五行聖共鳴";
  else if(sets>=2){const p=EL.find(e=>rest[e]>=6);if(p)sp=PURE[p]}
  if(!sp&&sets>=1){const pr=EL.filter(e=>rest[e]>=5);if(pr.length>=2){const k=pr[0]+"+"+pr[1];
    if(k==="金+水")sp=rest["水"]>rest["金"]?"雷共鳴":"毒共鳴";else sp=DUAL[k]}}
  return{sets,rest,singles,sp};
}
function calcRender(){
  const tot=EL.reduce((s,e)=>s+cnt[e],0);
  document.getElementById("calcIn").innerHTML=EL.map(e=>`<label class="e${e}">${e}<div class="st"><button data-e="${e}" data-d="-1">−</button><output>${cnt[e]}</output><button data-e="${e}" data-d="1">＋</button></div></label>`).join("");
  document.querySelectorAll("#calcIn button").forEach(b=>b.onclick=()=>{const e=b.dataset.e,v=cnt[e]+ +b.dataset.d;if(v<0||v>17)return;if(+b.dataset.d>0&&tot>=17)return;cnt[e]=v;calcRender()});
  const t=document.getElementById("total");t.textContent=`已放 ${tot} / 17 件`+(tot<17?`（還有 ${17-tot} 格可放，或放沒有五行的裝備）`:"");t.className="total";
  const r=judge(cnt);let h="";
  const item=(tag,nm)=>{const x=find(nm);return`<div class="it"><span class="tag">${tag}</span><b>${x.icon} ${x.name}</b>：${esc(x.eff)}</div>`};
  if(r.sp)h+=item("特殊共鳴",r.sp);
  r.singles.forEach(e=>h+=item("星君加持",e+"靈星君加持"));
  if(!h)h=`<div class="it" style="color:var(--mute)">目前沒有啟動任何共鳴</div>`;
  // 提示下一步
  const tips=[];
  if(r.sets<3)tips.push(`目前 ${r.sets} 套完整五行（湊到 3 套＝五行聖共鳴）`);
  const miss=EL.filter(e=>cnt[e]>0&&cnt[e]<5).map(e=>`${e}再 ${5-cnt[e]} 件`);
  if(miss.length)tips.push(`差一點的星君加持：${miss.join("、")}`);
  h+=tips.length?`<div class="hint">💡 ${tips.join("<br>💡 ")}</div>`:"";
  document.getElementById("calcOut").innerHTML=h;
}
calcRender();
if(PF){const r=judge(cnt),names=(r.sp?[r.sp]:[]).concat(r.singles.map(e=>e+"靈星君加持")),tot=EL.reduce((s,e)=>s+cnt[e],0);
  document.querySelector(".tabs").insertAdjacentHTML("beforebegin",`<div class="rules" style="border-color:var(--acct)">👤 你身上 ${tot} 件有五行的裝備：${EL.map(e=>`<span class="e${e}"><b>${e} ${cnt[e]}</b></span>`).join("、")}。<br>目前啟動：<b>${names.length?names.map(n=>{const x=find(n);return x.icon+" "+x.name+"（"+esc(x.eff)+"）"}).join("；"):"沒有任何共鳴"}</b><br>「配裝試算」分頁已經帶入這個配置，可以直接調整看看差幾件。</div>`)}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  const c=b.dataset.k==="calc";document.getElementById("pCalc").hidden=!c;document.getElementById("pList").hidden=c});
</script></body></html>
