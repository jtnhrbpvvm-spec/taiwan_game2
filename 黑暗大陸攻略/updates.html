<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>更新紀錄｜黑暗大陸攻略百科</title>
<meta name="description" content="黑暗大陸遊戲更新紀錄：依日期列出遊戲內公開的更新內容，可搜尋關鍵字。">
<link rel="stylesheet" href="assets/wiki.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%94%3C/text%3E%3C/svg%3E">
<style>
    .day { margin: 12px 0; }
    .day h2 { margin: 0 0 8px; font-size: 18px; }
    .day ul { margin: 0; padding-left: 20px; }
    .day li { margin: 6px 0; }
    .ver { font-size: 12px; color: var(--dim); margin-left: 6px; white-space: nowrap; }
</style>
<script>addEventListener('load',function(){if(location.protocol==='file:')return;var s=document.createElement('script');s.async=true;s.src='https://gc.zgo.at/count.js';s.setAttribute('data-goatcounter','https://taiwangame2.goatcounter.com/count');document.head.appendChild(s);});</script>
</head>
<body data-page="updates">
<main>
    <h1>📰 更新紀錄</h1>
    <p class="lead">遊戲內點版本號看到的更新內容，依日期整理。目前收錄到遊戲版本 <b id="ver"></b>，較早的更新不在這份紀錄裡。</p>
    <div class="filters">
        <input type="search" id="q" placeholder="搜尋更新內容…" aria-label="搜尋更新內容">
        <small class="dim" id="count"></small>
    </div>
    <div id="list"></div>
</main>
<script src="data/wiki-data.js"></script>
<script src="assets/wiki.js"></script>
<script>
$('#ver').textContent = W.meta.version;
const dateOf = v => `${v.slice(0, 4)}-${v.slice(4, 6)}-${v.slice(6, 8)}`;
function draw(q) {
    const days = new Map();
    let n = 0;
    for (const u of W.updates) {
        const items = u.items.filter(t => !q || t.toLowerCase().includes(q));
        if (!items.length) continue;
        n += items.length;
        const d = dateOf(u.version);
        if (!days.has(d)) days.set(d, []);
        days.get(d).push(...items.map(t => [u.version, t]));
    }
    $('#count').textContent = `共 ${n} 則`;
    $('#list').innerHTML = [...days].map(([d, rows]) => `<section class="card day"><h2>${d}</h2><ul>${rows.map(([v, t]) => `<li>${esc(t)}<span class="ver">${esc(v)}</span></li>`).join('')}</ul></section>`).join('')
        || '<p class="dim">找不到符合的更新。</p>';
}
$('#q').addEventListener('input', e => { if (!e.isComposing) draw(e.target.value.trim().toLowerCase()); });
$('#q').addEventListener('compositionend', e => draw(e.target.value.trim().toLowerCase()));
draw('');
</script>
</body>
</html>
