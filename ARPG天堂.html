<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>存檔編輯器 V1</title>
<style>
  :root {
    --bg: #1a1d24;
    --panel: #23272f;
    --panel2: #2b303a;
    --border: #3a3f4b;
    --text: #e6e9ef;
    --muted: #9aa3b2;
    --accent: #4a9eff;
    --danger: #ff5d5d;
    --ok: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
    margin: 0;
    padding: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .bar {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 20px;
  }
  input[type=file] { color: var(--text); }
  button {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #06121f; font-weight: 600; }
  button.danger { color: var(--danger); }
  .status { font-size: 13px; color: var(--muted); margin-left: auto; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--danger); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .field {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .field input {
    width: 100%;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 6px 8px;
    font-size: 14px;
  }

  section { margin-bottom: 28px; }
  section h2 {
    font-size: 15px;
    border-left: 3px solid var(--accent);
    padding-left: 10px;
    margin-bottom: 10px;
  }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 10px; overflow: hidden; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 13px; text-align: left; }
  th { background: var(--panel2); color: var(--muted); font-weight: 500; }
  td input {
    width: 100%;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 5px 7px;
    font-size: 13px;
  }
  td.narrow { width: 70px; }
  td.checkbox { width: 40px; text-align: center; }
  .row-actions { display: flex; gap: 8px; margin-top: 10px; }
  .add-item-widget {
    margin-top: 14px;
    padding: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: flex-end;
  }
  .add-item-widget .field-inline { display: flex; flex-direction: column; gap: 4px; }
  .add-item-widget .field-inline label { font-size: 11px; color: var(--muted); }
  .add-item-widget select,
  .add-item-widget input[type=text],
  .add-item-widget input[type=number] {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 6px 8px;
    font-size: 13px;
  }
  .add-item-widget select { min-width: 140px; }
  .add-item-widget .item-select { min-width: 220px; }
  .add-item-widget .search-input { min-width: 180px; }
  .add-item-widget .qty-input { width: 70px; }
  .empty-hint { color: var(--muted); font-size: 13px; padding: 16px; text-align: center; }
  .hidden { display: none !important; }

  /* ==== 側邊選單版面 ==== */
  .layout {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }
  .sidebar {
    flex: 0 0 160px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: sticky;
    top: 24px;
  }
  .sidebar button {
    text-align: left;
    padding: 12px 14px;
    font-size: 14px;
    border-radius: 8px;
  }
  .sidebar button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #06121f;
    font-weight: 600;
  }
  .content { flex: 1; min-width: 0; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ==== 物品名稱唯讀顯示：中文在上、代號在下，避免手滑改到內容 ==== */
  .item-name-display {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 7px;
    cursor: default;
    user-select: text;
  }
  .item-name-display .name-line {
    font-size: 13px;
    color: var(--text);
  }
  .item-name-display .name-line.missing { color: var(--muted); font-style: italic; }
  .item-name-display .code-line {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }
</style>
</head>
<body>

<h1>存檔編輯器 V1</h1>
<div class="sub">載入存檔檔案後可直接編輯數值,完成後匯出成新的存檔檔案。僅在本機瀏覽器中運作,不會上傳任何資料。</div>

<div class="bar" id="dataBar">
  <span id="dataStatus" class="status">正在載入物品/技能名稱資料...</span>
  <button id="reloadDataBtn">重新載入</button>
</div>

<div class="bar">
  <input type="file" id="fileInput" accept=".json,.save,.dat,.txt,*">
  <button class="primary" id="saveBtn" disabled>匯出修改後的存檔</button>
  <span class="status" id="status">尚未載入檔案</span>
</div>

<div id="editorArea" class="hidden layout">

  <div class="sidebar" id="sidebarNav">
    <button class="nav-btn active" data-tab="tab-basic">基本資料</button>
    <button class="nav-btn" data-tab="tab-skills">技能</button>
    <button class="nav-btn" data-tab="tab-equip">裝備</button>
    <button class="nav-btn" data-tab="tab-items">物品</button>
    <button class="nav-btn" data-tab="tab-warehouse">倉庫</button>
  </div>

  <div class="content">

    <div class="tab-panel active" id="tab-basic">
      <section>
        <h2>角色基本數值</h2>
        <div class="grid" id="basicFields"></div>
      </section>

      <section>
        <h2>能力值</h2>
        <div class="grid" id="statFields"></div>
      </section>

      <section>
        <h2>戰鬥與快捷設定</h2>
        <div class="grid" id="settingFields"></div>
      </section>
    </div>

    <div class="tab-panel" id="tab-skills">
      <section>
        <h2>已學技能 (learnedSkills)</h2>
        <table>
          <thead>
            <tr>
              <th>技能 ID</th>
              <th class="narrow">刪除</th>
            </tr>
          </thead>
          <tbody id="skillBody"></tbody>
        </table>
        <div class="row-actions">
          <button id="addSkillRow">+ 新增技能</button>
        </div>
      </section>
    </div>

    <div class="tab-panel" id="tab-equip">
      <section>
        <h2>裝備欄位 (equippedItems)</h2>
        <table>
          <thead>
            <tr>
              <th class="narrow">裝備位置</th>
              <th>物品</th>
              <th class="narrow">強化值</th>
              <th class="checkbox">鎖定</th>
              <th class="narrow">刪除</th>
            </tr>
          </thead>
          <tbody id="equipBody"></tbody>
        </table>
        <div class="add-item-widget" id="equipAddWidget"></div>
      </section>
    </div>

    <div class="tab-panel" id="tab-items">
      <section>
        <h2>背包物品 (inventoryStacks)</h2>
        <table>
          <thead>
            <tr>
              <th>物品</th>
              <th class="narrow">數量</th>
              <th class="narrow">強化值</th>
              <th class="checkbox">鎖定</th>
              <th class="narrow">刪除</th>
            </tr>
          </thead>
          <tbody id="inventoryBody"></tbody>
        </table>
        <div class="add-item-widget" id="inventoryAddWidget"></div>
      </section>
    </div>

    <div class="tab-panel" id="tab-warehouse">
      <section>
        <h2>倉庫物品 (Warehouse.items)</h2>
        <table>
          <thead>
            <tr>
              <th>物品</th>
              <th class="narrow">數量</th>
              <th class="narrow">強化值</th>
              <th class="checkbox">鎖定</th>
              <th class="narrow">刪除</th>
            </tr>
          </thead>
          <tbody id="warehouseBody"></tbody>
        </table>
        <div class="add-item-widget" id="warehouseAddWidget"></div>
      </section>
    </div>

  </div>

</div>

<script>
// ==== 物品/技能 ID → 中文名稱對照表 ====
// 資料來源改為遊戲本身的完整資料庫 save/DB.json（同一份檔案，遊戲本體與存檔編輯器共用，
// 不需要再另外維護一份對照表）。DB.json 內含大量戰鬥計算用欄位(傷害、機率、特效等)，
// 編輯器讀取後只抽取用得到的「名稱」與「分類」，其餘內容不保留，避免佔用多餘記憶體。
// 優先讀取本機同層 save 資料夾；若讀取失敗(常見於直接雙擊開啟、或缺少該資料夾)，
// 會改成從 GitHub 上的專案倉庫抓取最新版本。
let ITEM_NAMES = {};
let SKILL_NAMES = {};

// 若之後倉庫路徑或使用者帳號有變動，只需要改這兩個網址
const GITHUB_DB_URL = 'https://raw.githubusercontent.com/jtnhrbpvvm-spec/taiwan_game2/main/save/DB.json';
const GITHUB_ITEM_EX_URL = 'https://raw.githubusercontent.com/jtnhrbpvvm-spec/taiwan_game2/main/save/item_ex.js';

const dataStatus = document.getElementById('dataStatus');
const reloadDataBtn = document.getElementById('reloadDataBtn');

async function fetchJson(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

// 從完整的 DB.json（或格式相同的 item_ex.js）中只抽取名稱/分類欄位，讓大型物件用完即丟，不長期佔用記憶體
function extractNamesFromDb(db) {
  const items = {};
  for (const [id, entry] of Object.entries(db.items || {})) {
    // noEnhance: DB.json 裡明確標記「這件物品不能強化」的旗標。
    // 過去版本用「type 是不是武器/防具」來猜測能不能強化，會誤判：
    // 實際上有一部分武器/防具本身也標記不能強化，而部分飾品(戒指/耳環/項鍊等)是可以強化的。
    // stackable: DB.json 標記「這件物品可以疊加數量」的旗標。武器/防具/飾品/技能書完全沒有
    // 這個標記(視為不可疊加,每件都是獨立個體);藥水/卷軸/部分素材類才有 stackable:true。
    items[id] = { n: entry.n || id, type: entry.type || 'misc', noEnhance: !!entry.noEnhance, stackable: !!entry.stackable };
  }
  const skills = {};
  for (const [id, entry] of Object.entries(db.skills || {})) {
    skills[id] = entry.n || id;
  }
  return { items, skills };
}

async function loadNameData() {
  dataStatus.textContent = '正在載入物品/技能名稱資料...';
  dataStatus.className = 'status';
  reloadDataBtn.disabled = true;

  let dbSource = null;
  let db = null;

  // 主資料庫 DB.json：先試本機 save 資料夾，失敗再試 GitHub
  try {
    db = await fetchJson('save/DB.json');
    dbSource = '本機 DB.json';
  } catch (err) {
    try {
      db = await fetchJson(GITHUB_DB_URL);
      dbSource = 'GitHub DB.json';
    } catch (err2) {
      dataStatus.textContent = '本機與 GitHub 皆載入失敗,物品/技能將只顯示 ID,不影響其他編輯功能。點「重新載入」可再試一次。';
      dataStatus.className = 'status err';
      reloadDataBtn.disabled = false;
      refreshNameDependentUI();
      return;
    }
  }

  const base = extractNamesFromDb(db);
  ITEM_NAMES = base.items;
  SKILL_NAMES = base.skills;

  // item_ex.js：存放「不在遊戲本體 DB.json 裡、但確認遊戲中真的存在」的後補物品/技能，
  // 跟 DB.json 分開維護，避免每次手動補資料都要動到主資料庫。格式與 DB.json 完全相同，
  // 找不到這個檔案是正常情況(代表目前沒有需要後補的資料)，不會顯示成錯誤。
  let exCount = 0;
  try {
    const ex = await fetchJson('save/item_ex.js');
    const exNames = extractNamesFromDb(ex);
    Object.assign(ITEM_NAMES, exNames.items);
    Object.assign(SKILL_NAMES, exNames.skills);
    exCount = Object.keys(exNames.items).length + Object.keys(exNames.skills).length;
  } catch (err) {
    try {
      const ex = await fetchJson(GITHUB_ITEM_EX_URL);
      const exNames = extractNamesFromDb(ex);
      Object.assign(ITEM_NAMES, exNames.items);
      Object.assign(SKILL_NAMES, exNames.skills);
      exCount = Object.keys(exNames.items).length + Object.keys(exNames.skills).length;
    } catch (err2) {
      // 本機與 GitHub 都沒有 item_ex.js，略過即可，不影響主資料庫
    }
  }

  dataStatus.textContent = '物品/技能名稱資料已載入(' + dbSource + (exCount > 0 ? ' + item_ex.js 後補 ' + exCount + ' 筆' : '') + ') — ' + Object.keys(ITEM_NAMES).length + ' 個物品、' + Object.keys(SKILL_NAMES).length + ' 個技能';
  dataStatus.className = 'status ok';
  reloadDataBtn.disabled = false;
  refreshNameDependentUI();
}

// 資料庫載入完成(或重新載入)後，若已經開啟存檔，重新整理會用到名稱對照的畫面
function refreshNameDependentUI() {
  if (!playerObj) return;
  skillDatalistBuilt = false;
  itemsByCategory = null;
  renderSkillList();
  renderEquipmentTable();
  renderInventoryTable();
  renderWarehouseTable();
  setupAddWidgets();
}

reloadDataBtn.addEventListener('click', loadNameData);
loadNameData();

let rootData = null;      // 最外層 parse 出來的物件
let playerObj = null;     // Player 欄位再 parse 一次
let warehouseObj = null;  // Warehouse 欄位再 parse 一次
let originalFileName = "save";

const fileInput = document.getElementById('fileInput');
const saveBtn = document.getElementById('saveBtn');
const statusEl = document.getElementById('status');
const editorArea = document.getElementById('editorArea');
const basicFields = document.getElementById('basicFields');
const statFields = document.getElementById('statFields');
const equipBody = document.getElementById('equipBody');
const skillBody = document.getElementById('skillBody');
const settingFields = document.getElementById('settingFields');
const inventoryBody = document.getElementById('inventoryBody');
const warehouseBody = document.getElementById('warehouseBody');

function setStatus(msg, cls) {
  statusEl.textContent = msg;
  statusEl.className = 'status' + (cls ? ' ' + cls : '');
}

// ==== 側邊選單分頁切換 ====
document.getElementById('sidebarNav').addEventListener('click', (e) => {
  const btn = e.target.closest('.nav-btn');
  if (!btn) return;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(btn.dataset.tab).classList.add('active');
});

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  originalFileName = file.name.replace(/\.[^.]+$/, '');
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      rootData = JSON.parse(ev.target.result);
    } catch (err) {
      setStatus('無法解析檔案,不是有效的 JSON: ' + err.message, 'err');
      return;
    }
    try {
      playerObj = typeof rootData.Player === 'string' ? JSON.parse(rootData.Player) : rootData.Player;
    } catch (err) {
      setStatus('Player 欄位解析失敗: ' + err.message, 'err');
      return;
    }
    try {
      warehouseObj = typeof rootData.Warehouse === 'string' ? JSON.parse(rootData.Warehouse) : rootData.Warehouse;
    } catch (err) {
      warehouseObj = null;
    }
    renderBasicFields();
    renderStatFields();
    renderEquipmentTable();
    renderSkillList();
    renderSettingFields();
    renderInventoryTable();
    renderWarehouseTable();
    setupAddWidgets();
    editorArea.classList.remove('hidden');
    saveBtn.disabled = false;
    setStatus('已載入: ' + file.name, 'ok');
  };
  reader.readAsText(file, 'utf-8');
});

// ==== 依遊戲原始碼 ClassGrowthRules.cs 換算出的職業成長參數 ====
// 來源：使用者提供的 IdleLineage.Combat.ClassGrowthRules 類別。
// FreePoints：該職業六維配點的「總點數上限」(allocations 六個值加總不可超過這個數字)。
// MaxHpCap / MaxMpCap：該職業血量/魔力的存檔上限，對應 LevelUpHp/LevelUpMp 逐級隨機累加後的封頂值
//   (經比對實際存檔證實這只是自然成長的參考值，裝備/祝福等加成可以超過，不是硬上限)。
// base：職業的六維基礎值(對應 C# ClassGrowthProfile 建構子的 Str,Dex,Con,Int,Wis,Cha 六個參數)，
//   用來換算「基礎值 + 配點」是否超過單一能力最終上限。
// 找不到對應職業代號時(跟原始碼行為一致)一律 fallback 用法師(mage)的參數。
const MAX_SINGLE_ATTRIBUTE = 35; // 原始碼 Program.MaximumAttribute 常數：單一能力最終數值上限
const CLASS_GROWTH_PROFILES = {
  royal:    { freePoints: 8,  maxHpCap: 1400, maxMpCap: 800,  base: { str: 13, dex: 10, con: 10, int: 10, wis: 11, cha: 13 } },
  knight:   { freePoints: 4,  maxHpCap: 2200, maxMpCap: 600,  base: { str: 16, dex: 12, con: 14, int: 8,  wis: 9,  cha: 12 } },
  elf:      { freePoints: 7,  maxHpCap: 1600, maxMpCap: 900,  base: { str: 11, dex: 12, con: 12, int: 12, wis: 12, cha: 9  } },
  mage:     { freePoints: 16, maxHpCap: 1300, maxMpCap: 1300, base: { str: 8,  dex: 7,  con: 12, int: 12, wis: 12, cha: 8  } },
  dark:     { freePoints: 10, maxHpCap: 1600, maxMpCap: 900,  base: { str: 12, dex: 15, con: 8,  int: 11, wis: 10, cha: 9  } },
  dragon:   { freePoints: 6,  maxHpCap: 2000, maxMpCap: 600,  base: { str: 13, dex: 11, con: 14, int: 11, wis: 12, cha: 8  } },
  illusion: { freePoints: 10, maxHpCap: 1200, maxMpCap: 1200, base: { str: 11, dex: 10, con: 12, int: 12, wis: 12, cha: 8  } },
  warrior:  { freePoints: 4,  maxHpCap: 2310, maxMpCap: 570,  base: { str: 16, dex: 12, con: 14, int: 8,  wis: 9,  cha: 12 } }
};
function currentClassProfile() {
  const classId = rootData && rootData.ClassId;
  return CLASS_GROWTH_PROFILES[classId] || CLASS_GROWTH_PROFILES.mage;
}

function makeField(container, label, getter, setter, type) {
  const wrap = document.createElement('div');
  wrap.className = 'field';
  const lab = document.createElement('label');
  lab.textContent = label;
  const input = document.createElement('input');
  input.type = type || 'text';
  input.value = getter();
  input.addEventListener('input', () => {
    let v = input.value;
    if (type === 'number') v = v === '' ? 0 : Number(v);
    setter(v);
  });
  wrap.appendChild(lab);
  wrap.appendChild(input);
  container.appendChild(wrap);
}

function renderBasicFields() {
  basicFields.innerHTML = '';

  makeField(basicFields, '角色名稱', () => rootData.CharacterName ?? '', v => { rootData.CharacterName = v; }, 'text');
  makeField(basicFields, '金幣 (Player.gold)', () => playerObj.gold ?? 0, v => { playerObj.gold = v; }, 'number');
  makeField(basicFields, '飽食度 (satiety)', () => playerObj.satiety ?? 0, v => { playerObj.satiety = v; }, 'number');
  makeField(basicFields, '倉庫容量上限', () => (warehouseObj ? warehouseObj.capacity ?? 0 : 0), v => { if (warehouseObj) warehouseObj.capacity = v; }, 'number');

  // Hp/MaxHp/Mp/MaxMp：依 ClassGrowthRules.cs 的 LevelUpHp/LevelUpMp，這兩個數值是升級時
  // 擲隨機數逐級累加、直接存起來的結果，遊戲讀檔不會重新計算，所以可以直接編輯。
  // 注意：MaxHpCap/MaxMpCap 經比對實際存檔(法師 MaxHp=1320、MaxMp=1350)發現會被超過，
  // 研判這兩個 Cap 只是「自然升級成長」的封頂值，裝備/祝福等額外加成不受此限，
  // 所以這裡的數字只能當參考，不是絕對不能超過的硬上限。
  const profile = currentClassProfile();

function statField(container, label, allocKey, topKey, editable) {
  const wrap = document.createElement('div');
  wrap.className = 'field';
  const lab = document.createElement('label');
  lab.textContent = label;
  wrap.appendChild(lab);

  const row = document.createElement('div');
  row.style.display = 'flex';
  row.style.gap = '6px';

  const profile = currentClassProfile();
  const baseVal = (profile.base && profile.base[allocKey]) ?? 0;

  const inAlloc = document.createElement('input');
  inAlloc.type = 'number';
  inAlloc.title = '基礎配點 (Player.allocations.' + allocKey + ')';
  inAlloc.value = (playerObj.allocations && playerObj.allocations[allocKey]) ?? 0;

  const capHint = document.createElement('div');
  capHint.style.fontSize = '10px';
  capHint.style.marginTop = '4px';

  if (editable) {
    // 依作者提供的原始碼：Program.MaximumAttribute = 35，是「單一能力最終數值」的上限。
    // 這裡用「職業基礎值 + 配點」去逼近最終值(尚未含裝備加成)，超過就自動夾回 35 上限，
    // 避免存出一個連遊戲對照表都沒列出來的能力值。
    inAlloc.addEventListener('input', () => {
      let v = inAlloc.value === '' ? 0 : Number(inAlloc.value);
      const finalVal = baseVal + v;
      if (finalVal > MAX_SINGLE_ATTRIBUTE) {
        v = MAX_SINGLE_ATTRIBUTE - baseVal;
        inAlloc.value = v;
      }
      if (!playerObj.allocations) playerObj.allocations = {};
      playerObj.allocations[allocKey] = v;
      updateAllocSummary();
      capHint.textContent = '基礎值 ' + baseVal + ' + 配點 ' + v + ' = ' + (baseVal + v) + '　（單一能力上限 ' + MAX_SINGLE_ATTRIBUTE + '）';
      capHint.style.color = (baseVal + v) >= MAX_SINGLE_ATTRIBUTE ? 'var(--danger)' : 'var(--muted)';
    });
    capHint.textContent = '基礎值 ' + baseVal + ' + 配點 ' + inAlloc.value + ' = ' + (baseVal + Number(inAlloc.value)) + '　（單一能力上限 ' + MAX_SINGLE_ATTRIBUTE + '）';
    capHint.style.color = 'var(--muted)';
  } else {
    inAlloc.disabled = true;
  }

  // 最外層顯示用數值：目前還不確定是遊戲即時重算的快取、還是也包含裝備加成的另一個存好的值，
  // 保守起見先繼續唯讀，避免存出跟遊戲內顯示對不起來的數字。
  const inTop = document.createElement('input');
  inTop.type = 'number';
  inTop.title = '顯示數值 (最外層 ' + topKey + ')';
  inTop.value = rootData[topKey] ?? 0;
  inTop.disabled = true;

  row.appendChild(inAlloc);
  row.appendChild(inTop);
  wrap.appendChild(row);

  const hint = document.createElement('div');
  hint.style.fontSize = '10px';
  hint.style.color = 'var(--muted)';
  hint.style.marginTop = '4px';
  hint.textContent = editable
    ? '左:基礎配點(可編輯,測試用)　右:顯示數值(唯讀)'
    : '左:基礎配點(暫鎖回唯讀)　右:顯示數值(唯讀)';
  wrap.appendChild(hint);

  if (editable) wrap.appendChild(capHint);

  container.appendChild(wrap);
}

let skillLabelToId = {};   // "中文名稱 (id)" -> id 反查表
let skillDatalistBuilt = false;

function ensureSkillDatalist() {
  const existing = document.getElementById('skillNameList');
  if (existing) existing.remove();
  skillLabelToId = {};
  const datalist = document.createElement('datalist');
  datalist.id = 'skillNameList';
  const entries = Object.entries(SKILL_NAMES).sort((a, b) => a[1].localeCompare(b[1], 'zh-Hant'));
  for (const [id, name] of entries) {
    const label = name + '（' + id + '）';
    skillLabelToId[label] = id;
    const opt = document.createElement('option');
    opt.value = label;
    datalist.appendChild(opt);
  }
  document.body.appendChild(datalist);
  skillDatalistBuilt = true;
}

function skillLabelFor(skillId) {
  if (!skillId) return '';
  const name = SKILL_NAMES[skillId];
  return name ? (name + '（' + skillId + '）') : skillId;
}

function renderSkillList() {
  if (!skillDatalistBuilt || Object.keys(SKILL_NAMES).length !== Object.keys(skillLabelToId).length) {
    ensureSkillDatalist();
  }
  skillBody.innerHTML = '';
  if (!playerObj.learnedSkills) playerObj.learnedSkills = [];
  const list = playerObj.learnedSkills;
  if (list.length === 0) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 2;
    td.className = 'empty-hint';
    td.textContent = '（沒有已學技能）';
    tr.appendChild(td);
    skillBody.appendChild(tr);
    return;
  }
  list.forEach((skillId, idx) => {
    const tr = document.createElement('tr');
    const tdKey = document.createElement('td');
    const inKey = document.createElement('input');
    inKey.setAttribute('list', 'skillNameList');
    inKey.placeholder = '輸入中文技能名稱搜尋,或直接輸入代碼';
    inKey.value = skillLabelFor(skillId);
    tdKey.appendChild(inKey);

    const hint = document.createElement('div');
    hint.style.fontSize = '11px';
    hint.style.color = 'var(--muted)';
    hint.style.marginTop = '3px';
    tdKey.appendChild(hint);

    function resolveAndStore() {
      const typed = inKey.value.trim();
      if (skillLabelToId[typed]) {
        list[idx] = skillLabelToId[typed];
        hint.textContent = '已選擇：' + SKILL_NAMES[list[idx]];
        hint.style.color = 'var(--ok)';
      } else {
        // 使用者可能直接輸入代碼本身
        list[idx] = typed;
        hint.textContent = skillNameHint(typed);
        hint.style.color = 'var(--muted)';
      }
    }
    resolveAndStore();
    inKey.addEventListener('input', resolveAndStore);
    inKey.addEventListener('change', resolveAndStore);

    const tdDel = document.createElement('td');
    tdDel.className = 'narrow';
    const btnDel = document.createElement('button');
    btnDel.textContent = '刪除';
    btnDel.className = 'danger';
    btnDel.addEventListener('click', () => {
      list.splice(idx, 1);
      renderSkillList();
    });
    tdDel.appendChild(btnDel);

    tr.appendChild(tdKey);
    tr.appendChild(tdDel);
    skillBody.appendChild(tr);
  });
}

// 避免使用者手滑改到內容。要更換物品內容請用下方「搜尋加入」的方式重新選擇。
function buildItemNameDisplay(itemKey) {
  const wrap = document.createElement('div');
  wrap.className = 'item-name-display';

  const nameLine = document.createElement('div');
  const entry = ITEM_NAMES[itemKey];
  if (itemKey && entry) {

  } else if (itemKey) {
    nameLine.className = 'name-line missing';

  } else {
    nameLine.className = 'name-line missing';
    nameLine.textContent = '（尚未選擇物品）';

  const codeLine = document.createElement('div');

// 物品分類：武器/防具/飾品各自獨立，其餘全部歸類為「雜物」
const ITEM_CATEGORY_LABELS = { wpn: '武器', arm: '防具', acc: '飾品', misc: '雜物' };
function itemCategoryOf(type) {
  if (type === 'wpn' || type === 'arm' || type === 'acc') return type;
  return 'misc';
}

// 是否可強化：以 DB.json 的 noEnhance 欄位為準（真實遊戲資料），而非用類型硬猜。
// 只有武器/防具/飾品這三種「裝備類」物品才有強化的意義；
// 其中，若該物品本身標記 noEnhance = true（例如許多活動戒指、部分特殊武具），
// 就算是武器/防具/飾品也一樣鎖定不可強化。
// 查無資料的 itemKey（DB.json 裡沒有這筆）保守起見一律鎖定，避免誤開放。
function isEnhanceableItem(itemKey) {
  const entry = ITEM_NAMES[itemKey];
  if (!entry) return false;
  if (entry.noEnhance) return false;
  return entry.type === 'wpn' || entry.type === 'arm' || entry.type === 'acc';
}

let itemsByCategory = null; // { wpn: [[id,name],...], arm: [...], acc: [...], misc: [...] }
function buildItemsByCategory() {
  itemsByCategory = { wpn: [], arm: [], acc: [], misc: [] };
  for (const [id, entry] of Object.entries(ITEM_NAMES)) {
    const cat = itemCategoryOf(entry.type);
    itemsByCategory[cat].push([id, entry.n]);
  }
  for (const cat of Object.keys(itemsByCategory)) {
    itemsByCategory[cat].sort((a, b) => a[1].localeCompare(b[1], 'zh-Hant'));
  }
}

function skillNameHint(skillId) {
  if (!skillId) return '';
  return SKILL_NAMES[skillId] || '（查無此技能）';
}

// 依照存檔實際觀察到的規則產生 uid：
// - 背包/裝備物品：player:item:<序號>，序號來自 Player.itemUidSequence 並遞增
// - 倉庫物品：standard:item:<序號>，序號來自 Warehouse.itemUidSequence 並遞增
// 倉庫物品另外多一個背包沒有的 "junk" 欄位，兩者結構並不完全相同。
function nextItemUid(kind) {
  if (kind === 'warehouse') {
    if (!warehouseObj) throw new Error('warehouseObj 不存在');
    warehouseObj.itemUidSequence = (warehouseObj.itemUidSequence || 0) + 1;
    return 'standard:item:' + warehouseObj.itemUidSequence;
  }
  playerObj.itemUidSequence = (playerObj.itemUidSequence || 0) + 1;
  return 'player:item:' + playerObj.itemUidSequence;
}

function blankItem(kind) {
  const base = {
    uid: nextItemUid(kind),
    itemKey: '',
    quantity: 1,
    enhancement: 0,
    blessing: 0,
    brokenBladeStacks: 0,
    chargeCount: 0,
    locked: false,
    isIdentified: true,
    itemLevel: 0,
    affixes: [],
    petUid: '',
    monsterCardLevel: 0,
    monsterCardExperience: 0,
    monsterCardReadyAtUnixMilliseconds: 0,
    itemDelayReadyAtUnixMilliseconds: 0,
    attrEnchantKind: 0,
    attrEnchantLevel: 0
  };
  // 比對實際存檔後發現：sealed 與 junk 是互斥的兩個欄位，
  // 背包/裝備物品(Player)有 sealed、沒有 junk；倉庫物品(Warehouse)有 junk、沒有 sealed。
  // 舊版曾經誤把 sealed 無條件加進所有物品，導致透過編輯器加進倉庫的物品格式錯誤、遊戲讀檔失敗。
  if (kind === 'warehouse') {
    base.junk = false;
  } else {
    base.sealed = false;
  }
  return base;
}

function renderInventoryTable() {
  if (!playerObj.inventoryStacks) playerObj.inventoryStacks = [];
  // 自動修補：背包/裝備物品應該有 sealed、不該有 junk（junk 是倉庫專用欄位）。
  for (const item of playerObj.inventoryStacks) {
    if (!('sealed' in item)) item.sealed = false;
    if ('junk' in item) delete item.junk;
  }
  if (playerObj.equippedItems) {
    for (const item of Object.values(playerObj.equippedItems)) {
      if (!('sealed' in item)) item.sealed = false;
      if ('junk' in item) delete item.junk;
    }
  }
  renderItemTable(inventoryBody, playerObj.inventoryStacks);
}

function renderWarehouseTable() {
  if (!warehouseObj) return;
  if (!warehouseObj.items) warehouseObj.items = [];
  // 自動修補：舊版編輯器產生的倉庫物品可能缺少 junk 欄位、誤植了背包專用的 sealed 欄位、
  // 或 uid 前綴不是 standard:item:，這類存檔載入遊戲會直接開不了角色。這裡順手補正，
  // 不影響原本就正常的物品。
  for (const item of warehouseObj.items) {
    if (!('junk' in item)) item.junk = false;
    if ('sealed' in item) delete item.sealed;
    if (!/^standard:item:\d+$/.test(item.uid)) {
      item.uid = nextItemUid('warehouse');
    }
  }
  renderItemTable(warehouseBody, warehouseObj.items);
}

  catLabel.textContent = '物品類型';
  const catSelect = document.createElement('select');
  for (const [type, label] of Object.entries(ITEM_CATEGORY_LABELS)) {
    const opt = document.createElement('option');
    opt.value = type;
    opt.textContent = label;
    catSelect.appendChild(opt);
  }
  catField.appendChild(catLabel);
  catField.appendChild(catSelect);

  const searchField = document.createElement('div');
  searchField.className = 'field-inline';
  const searchLabel = document.createElement('label');
  searchLabel.textContent = '關鍵字搜尋(可跨類型)';
  const searchInput = document.createElement('input');
  searchInput.type = 'text';
  searchInput.className = 'search-input';
  searchInput.placeholder = '輸入物品名稱關鍵字';
  searchField.appendChild(searchLabel);
  searchField.appendChild(searchInput);

  const itemField = document.createElement('div');
  itemField.className = 'field-inline';
  const itemLabel = document.createElement('label');
  itemLabel.textContent = '選擇物品';
  const itemSelect = document.createElement('select');
  itemSelect.className = 'item-select';
  itemField.appendChild(itemLabel);
  itemField.appendChild(itemSelect);

  function populateItemSelect() {
    const keyword = searchInput.value.trim();
    itemSelect.innerHTML = '';
    let candidates;
    if (keyword) {
      // 關鍵字搜尋時跨所有類型比對
      candidates = [];
      for (const cat of Object.keys(itemsByCategory)) {
        for (const [id, name] of itemsByCategory[cat]) {
          if (name.includes(keyword) || id.includes(keyword)) candidates.push([id, name]);
        }
      }
    } else {
      candidates = itemsByCategory[catSelect.value] || [];
    }
    if (candidates.length === 0) {
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = '（查無符合物品）';
      itemSelect.appendChild(opt);
      return;
    }
    for (const [id, name] of candidates) {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = name + '（' + id + '）';
      itemSelect.appendChild(opt);
    }
  }

  catSelect.addEventListener('change', () => {
    searchInput.value = '';
    populateItemSelect();
  });
  searchInput.addEventListener('input', populateItemSelect);

  if (!itemsByCategory) buildItemsByCategory();
  populateItemSelect();

  return { catField, searchField, itemField, catSelect, searchInput, itemSelect, populateItemSelect };
}

function buildAddItemWidget(container, getList, onAdded, kind) {
  container.innerHTML = '';

  const picker = createItemPickerControls();

  const qtyField = document.createElement('div');
  qtyField.className = 'field-inline';
  const qtyLabel = document.createElement('label');
  qtyLabel.textContent = '數量';
  const qtyInput = document.createElement('input');
  qtyInput.type = 'number';
  qtyInput.className = 'qty-input';
  qtyInput.value = 1;
  qtyField.appendChild(qtyLabel);
  qtyField.appendChild(qtyInput);

  const addBtn = document.createElement('button');
  addBtn.className = 'primary';
  addBtn.textContent = '+ 加入清單';

  addBtn.addEventListener('click', () => {
    const chosenId = picker.itemSelect.value;
    if (!chosenId) return;
    const qty = Number(qtyInput.value) || 1;
    const list = getList();
    const entry = ITEM_NAMES[chosenId];
    // 只有 DB.json 標記 stackable 的物品才會合併數量；武器/防具/飾品/技能書等
    // 完全沒有這個標記，一律視為獨立個體，每次「加入」都會產生新的一列，符合遊戲實際規則。
    if (entry && entry.stackable) {
      // 新增出來的物品一律是「未祝福、已鑑定、未鎖定」的預設狀態，
      // 要合併堆疊也只能找清單裡狀態完全相同的那一疊（跟遊戲一樣：祝福/詛咒/未鑑定不會混在一起）。
      const existing = list.find(it =>
        it.itemKey === chosenId &&
        (it.blessing || 0) === 0 &&
        it.isIdentified !== false &&
        !it.locked
      );
      if (existing) {
        existing.quantity = (existing.quantity || 0) + qty;
        onAdded();
        return;
      }
    }
    const item = blankItem(kind);
    item.itemKey = chosenId;
    item.quantity = qty;
    list.push(item);
    onAdded();
  });

  container.appendChild(picker.catField);
  container.appendChild(picker.searchField);
  container.appendChild(picker.itemField);
  container.appendChild(qtyField);
  container.appendChild(addBtn);
}

// 裝備位置常見代號；「自訂」則顯示自由輸入欄位，供非標準位置使用。
const EQUIP_SLOT_OPTIONS = ['wpn', 'armor', 'helm', 'shield', 'boots', 'gloves', 'cloak', 'tshirt', 'belt', 'amulet', 'ring1', 'ring2', 'lantern'];

// 裝備欄位專用的小工具：選裝備位置 + 搜尋選擇物品 → 裝備上去(若該位置已有裝備會直接覆蓋)。
// 取代舊版用 prompt() 手動輸入位置代號、再手動打 itemKey 的做法。
function buildEquipAddWidget(container) {
  container.innerHTML = '';

  const slotField = document.createElement('div');
  slotField.className = 'field-inline';
  const slotLabel = document.createElement('label');
  slotLabel.textContent = '裝備位置';
  const slotSelect = document.createElement('select');
  for (const slot of EQUIP_SLOT_OPTIONS) {
    const opt = document.createElement('option');
    opt.value = slot;
    opt.textContent = slot;
    slotSelect.appendChild(opt);
  }
  const customOpt = document.createElement('option');
  customOpt.value = '__custom__';
  customOpt.textContent = '其他(自訂代號)';
  slotSelect.appendChild(customOpt);
  slotField.appendChild(slotLabel);
  slotField.appendChild(slotSelect);

  const customSlotInput = document.createElement('input');
  customSlotInput.type = 'text';
  customSlotInput.placeholder = '輸入自訂裝備位置代號';
  customSlotInput.style.display = 'none';
  slotField.appendChild(customSlotInput);

  slotSelect.addEventListener('change', () => {
    customSlotInput.style.display = slotSelect.value === '__custom__' ? '' : 'none';
  });

  const picker = createItemPickerControls();

  const addBtn = document.createElement('button');
  addBtn.className = 'primary';
  addBtn.textContent = '裝備到此欄位';
  addBtn.title = '若該位置已裝備物品,會直接覆蓋替換';

  addBtn.addEventListener('click', () => {
    const chosenId = picker.itemSelect.value;
    if (!chosenId) return;
    const slotName = slotSelect.value === '__custom__' ? customSlotInput.value.trim() : slotSelect.value;
    if (!slotName) { alert('請輸入裝備位置代號'); return; }
    if (!playerObj.equippedItems) playerObj.equippedItems = {};
    const item = blankItem('player');
    item.itemKey = chosenId;
    playerObj.equippedItems[slotName] = item;
    renderEquipmentTable();
  });

  container.appendChild(slotField);
  container.appendChild(picker.catField);
  container.appendChild(picker.searchField);
  container.appendChild(picker.itemField);
  container.appendChild(addBtn);
}

function setupAddWidgets() {
  buildEquipAddWidget(document.getElementById('equipAddWidget'));
  buildAddItemWidget(
    document.getElementById('inventoryAddWidget'),
    () => playerObj.inventoryStacks,
    () => renderInventoryTable(),
    'player'
  );
  const warehouseWidget = document.getElementById('warehouseAddWidget');
  if (warehouseObj) {
    buildAddItemWidget(
      warehouseWidget,
      () => warehouseObj.items,
      () => renderWarehouseTable(),
      'warehouse'
    );
  } else {
    warehouseWidget.innerHTML = '<span class="empty-hint">（此存檔沒有可用的倉庫資料）</span>';
  }
}

saveBtn.addEventListener('click', () => {
  if (!rootData) return;
  try {
    rootData.Player = JSON.stringify(playerObj);
    if (warehouseObj) rootData.Warehouse = JSON.stringify(warehouseObj);
    const out = JSON.stringify(rootData);
    const blob = new Blob([out], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = originalFileName + '_edited.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setStatus('已匯出: ' + originalFileName + '_edited.json', 'ok');
  } catch (err) {
    setStatus('匯出失敗: ' + err.message, 'err');
  }
});
