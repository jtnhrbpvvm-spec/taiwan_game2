<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>無意義</title>
<style>
  body { margin: 0; padding: 24px 16px; font-family: system-ui, sans-serif; background: #f4f4f7; color: #222; text-align: center; }
  button { font-size: 22px; padding: 12px 40px; border: 0; border-radius: 10px; background: #3b6ef5; color: #fff; cursor: pointer; }
  button:active { transform: scale(0.97); }
  table { margin: 24px auto 0; border-collapse: collapse; }
  td { width: 64px; height: 44px; border: 1px solid #ccc; background: #fff; font-size: 20px; }
  tr.free td:not(.sum) { background: #fff6d6; }
  td.sum { border: 0; background: none; color: #888; font-size: 16px; width: 56px; }
  #weather { margin-left: 8px; background: #2a9d6f; }
  th { padding: 6px 8px; font-size: 16px; }
  #grid td.time { width: 72px; color: #666; font-size: 16px; }
  th { min-width: 96px; }
  #msg { margin-top: 16px; color: #888; }
</style>
</head>
<body>
<button id="gen">生成</button><button id="weather">天氣</button>
<table id="grid"></table>
<div id="msg"></div>
<script>
const ROWS = 11, LIMIT_ROWS = 5, FIRST_MAX = 7, NO_TEN_ROWS = 8, TARGET = 15, MIN = 1, MAX = 14;
const rand = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));

// 產生 11 排，每排 3 格加總 15，同一排三格數字不重複，皆為 1～14 的正整數
// 前 5 排第一格不超過 7；前 8 排任兩格相加不等於 10；不同排不能是同一組數字（換順序也算）
function generate() {
  const rows = [], usedSets = new Set();
  while (rows.length < ROWS) {
    const a = rand(MIN, MAX), b = rand(MIN, MAX), c = TARGET - a - b;
    const row = [a, b, c], key = [...row].sort((x, y) => x - y).join();
    if (c < MIN || c > MAX || new Set(row).size < 3 || usedSets.has(key)) continue;
    if (rows.length < LIMIT_ROWS && a > FIRST_MAX) continue;
    if (rows.length < NO_TEN_ROWS && (a + b === 10 || a + c === 10 || b + c === 10)) continue;
    usedSets.add(key);
    rows.push(row);
  }
  return rows;
}

const grid = document.getElementById('grid'), msg = document.getElementById('msg');

document.getElementById('gen').onclick = () => {
  msg.textContent = '';
  grid.innerHTML = generate()
    .map((r, i) => `<tr${i >= NO_TEN_ROWS ? ' class="free"' : ''}>${r.map(n => `<td>${n}</td>`).join('')}<td class="sum">= ${r[0] + r[1] + r[2]}</td></tr>`)
    .join('');
};

// 天氣：由 GitHub Actions 每小時存到 weather-data 分支的白沙灣逐時氣溫
const WEATHER_URL = 'https://raw.githubusercontent.com/jtnhrbpvvm-spec/taiwan_game2/weather-data/weather.json';
const taipeiDate = ms => new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Taipei' }).format(ms); // YYYY-MM-DD
const pad = n => String(n).padStart(2, '0');

document.getElementById('weather').onclick = async () => {
  grid.innerHTML = '';
  msg.textContent = '讀取中…';
  let data;
  try {
    const res = await fetch(`${WEATHER_URL}?t=${Date.now()}`);
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
  } catch (e) {
    msg.textContent = `讀不到氣溫資料（${e.message}），可能排程還沒開始記錄`;
    return;
  }
  const id = Object.keys(data.stations)[0];
  const now = Date.now(), today = taipeiDate(now), yesterday = taipeiDate(now - 86400000);
  const nowHour = Number(new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Taipei', hour: '2-digit', hourCycle: 'h23' }).format(now));
  // 今天尚未到的時段留空，已過但沒資料的顯示 —
  const cell = (date, h, future) => {
    const t = data.records[`${date}T${pad(h)}:00:00+08:00`]?.[id];
    return `<td>${t !== undefined ? t.toFixed(1) : future ? '' : '—'}</td>`;
  };
  grid.innerHTML = `<tr><th>時間</th><th>昨天<br>${yesterday}</th><th>今天<br>${today}</th></tr>`
    + Array.from({ length: 24 }, (_, h) =>
      `<tr><td class="time">${pad(h)}:00</td>${cell(yesterday, h, false)}${cell(today, h, h > nowHour)}</tr>`).join('');
  msg.textContent = `${data.stations[id]}測站，單位 °C，資料來源：中央氣象署；— 表示該小時沒有紀錄`;
};
</script>
</body>
</html>
