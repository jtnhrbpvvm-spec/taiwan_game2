<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>無意義</title>
<style>
  body { margin: 0; padding: 24px 16px; font-family: system-ui, sans-serif; background: #f4f4f7; color: #222; text-align: center; }
  button { font-size: 22px; padding: 12px 40px; border: 0; border-radius: 10px; background: #3b6ef5; color: #fff; cursor: pointer; }
  button:active { transform: scale(0.97); }
  table { margin: 24px auto 0; border-collapse: collapse; }
  td { width: 64px; height: 44px; border: 1px solid #ccc; background: #fff; font-size: 20px; }
  td.sum { border: 0; background: none; color: #888; font-size: 16px; width: 56px; }
</style>
</head>
<body>
<button id="gen">生成</button>
<table id="grid"></table>
<script>
const ROWS = 10, TARGET = 15, MIN = 1, MAX = 14;
const rand = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));

// 產生 10 排，每排 3 格加總 15，同一排三格數字不重複，皆為 1～14 的正整數，且任兩格相加不等於 10
function generate() {
  const rows = [];
  while (rows.length < ROWS) {
    const a = rand(MIN, MAX), b = rand(MIN, MAX), c = TARGET - a - b;
    const row = [a, b, c];
    if (c < MIN || c > MAX || new Set(row).size < 3 || a + b === 10 || a + c === 10 || b + c === 10) continue;
    rows.push(row);
  }
  return rows;
}

document.getElementById('gen').onclick = () => {
  document.getElementById('grid').innerHTML = generate()
    .map(r => `<tr>${r.map(n => `<td>${n}</td>`).join('')}<td class="sum">= ${r[0] + r[1] + r[2]}</td></tr>`)
    .join('');
};
</script>
</body>
</html>
