<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob:; style-src 'self' 'unsafe-inline'" />
    <title>選擇桌寵外觀</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body { display: flex; flex-direction: column; font: 14px/1.5 "Microsoft JhengHei", sans-serif; color: #e9dcc0; background: #1d1612; }
      header { padding: 12px; display: grid; gap: 8px; border-bottom: 1px solid #4a3a28; background: #261d17; }
      #follow { font: inherit; padding: 8px 10px; border: 1px solid #5a4630; border-radius: 8px; background: #2b211a; color: inherit; cursor: pointer; text-align: left; }
      #follow small { display: block; color: #b39a72; }
      #list { flex: 1; overflow-y: auto; padding: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; align-content: start; }
      .card { display: grid; justify-items: center; gap: 2px; padding: 6px 4px; border: 1px solid #5a4630; border-radius: 10px; background: #2b211a; cursor: pointer; font: inherit; color: inherit; }
      .card canvas { width: 80px; height: 80px; }
      .card span { font-size: 13px; }
      .card:hover, #follow:hover { border-color: #d9a54a; }
      .on { border-color: #d9a54a !important; box-shadow: 0 0 0 2px #d9a54a inset; }
      /* 整隻調色：三條拉條，下面清單的縮圖會跟著變色當預覽 */
      #color { margin: 0; padding: 6px 10px 8px; border: 1px solid #5a4630; border-radius: 8px; background: #2b211a; display: grid; grid-template-columns: auto 1fr 3.5em; gap: 2px 8px; align-items: center; }
      #color legend { padding: 0 4px; color: #b39a72; font-size: 13px; }
      #color input { width: 100%; accent-color: #d9a54a; }
      #color output { text-align: right; font-variant-numeric: tabular-nums; }
      #color-reset { grid-column: 1 / -1; justify-self: end; font: inherit; font-size: 13px; padding: 2px 10px; border: 1px solid #5a4630; border-radius: 6px; background: #1d1612; color: inherit; cursor: pointer; }
      #list canvas { filter: var(--pet-filter, none); }
    </style>
  </head>
  <body>
    <header>
      <button id="follow" type="button">跟著目前角色的職業<small>預設。換角色玩，桌寵也跟著換</small></button>
      <fieldset id="color">
        <legend>顏色（整隻一起變，換了外觀也會留著）</legend>
        <label for="color-hue">色相</label><input id="color-hue" type="range" /><output id="color-hue-value"></output>
        <label for="color-sat">鮮豔度</label><input id="color-sat" type="range" /><output id="color-sat-value"></output>
        <label for="color-light">亮度</label><input id="color-light" type="range" /><output id="color-light-value"></output>
        <button id="color-reset" type="button">恢復原色</button>
      </fieldset>
    </header>
    <div id="list"></div>
    <script src="picker.js"></script>
  </body>
</html>
