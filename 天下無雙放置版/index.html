*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#05090b;color:var(--text);font-family:system-ui,"Microsoft JhengHei","Noto Sans TC",sans-serif}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#game{width:100%;max-width:560px;height:100dvh;background:
 radial-gradient(80% 30% at 50% 0%,rgba(90,160,150,.17),transparent 70%),
 linear-gradient(180deg,#15282d 0%,#0d1b20 48%,#071013 100%);display:flex;flex-direction:column;overflow:hidden;position:relative}
/* 畫面模式：手機 9:16／PC 16:9／自動尺寸 */

body.screen-portrait #game{width:min(100vw,calc(100dvh * 9 / 16));max-width:none;height:min(100dvh,calc(100vw * 16 / 9));aspect-ratio:9/16}

body.screen-pc #game{width:min(100vw,calc(100dvh * 16 / 9));max-width:none;height:min(100dvh,calc(100vw * 9 / 16));aspect-ratio:16/9}
body.screen-auto #game{width:100%;max-width:560px;height:100dvh}

main{position:relative;z-index:3;display:flex;flex:1;min-height:0;overflow:hidden}.side{width:58px;padding:7px 5px;display:flex;flex-direction:column;gap:6px;overflow:auto}.nav{width:48px;min-height:54px;border:1px solid #6f5734;border-radius:11px;background:linear-gradient(180deg,#203138,#0b1216);color:var(--gold);font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.nav i{font-style:normal;font-size:18px}.nav.active{border-color:var(--gold2);background:linear-gradient(180deg,#3e3b29,#101817);box-shadow:0 0 12px #e9d5a333}
.content{flex:1;min-width:0;overflow:auto;padding:7px 8px calc(var(--dock) + 12px) 1px}.panel{display:none}.panel.active{display:block}.card{background:linear-gradient(180deg,rgba(23,34,41,.96),rgba(10,16,20,.97));border:1px solid #394950;border-radius:12px;padding:11px;box-shadow:inset 0 0 0 1px #b58f5526,0 7px 20px #0007;margin-bottom:8px}.title{margin:0 0 3px;color:var(--gold);font:700 19px/1.2 serif;letter-spacing:.06em}.desc{margin:0;color:var(--mute);font-size:11px;line-height:1.5}.subtabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}.tab{border:1px solid var(--bronze);background:#081014;color:var(--gold);border-radius:14px;padding:5px 10px;font-size:11px}.tab.active{background:linear-gradient(180deg,#f6e6bd,#c9a25f);color:#3b2b12;font-weight:800}

.inventory-tabs{display:flex;gap:5px;overflow:auto;margin-bottom:7px}.side .nav:first-child{margin-bottom:1px}.item{padding:8px;border:1px solid #38484d;border-radius:10px;background:#0a1418}.item strong{color:var(--gold);font-size:12px}.qty{color:var(--jade);font-size:10px}
.shopgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.shopitem{padding:9px;border:1px solid #445158;border-radius:10px;background:#091317}.price{color:#f0dca8;font-weight:800}.skill{padding:9px;border:1px solid #435158;border-radius:10px;background:#091317}.skill.eqd{border-color:var(--gold2)}.skill-name{color:var(--gold);font-weight:800}.skill-info{font-size:10px;color:#b7c7c2;margin-top:3px}.skill-tag{font-size:9px;padding:2px 6px;border-radius:10px;background:#1b3438;color:#9ee5d7;border:1px solid #416d67}

function slotOf(name){
 const weapons=['劍','刀','槍','戟','錐','鏜','杖','刃','噬','含光','皓月','龍脊','凝霜','吞龍貫','乘風','無極','萬刃','追雲','蓼葉','金背','金剛','日劍','天刑','巨闕','司命','鳳羽'];
 if(name==='乾坤頂')return 'helmet';
 if(name==='金錐帽')return 'helmet';
 if(/靴|履/.test(name))return 'shoes';
 if(/項鍊/.test(name))return 'necklace';
 if(/戒指/.test(name))return 'ring';
 if(/法寶/.test(name))return 'artifact';
 if(/護符/.test(name))return 'talisman';
 if(/腰帶/.test(name))return 'belt';
 if(/冠|盔|帽|巾|面甲|面罩|鬼臉/.test(name))return 'helmet';
 if(/袍|衣|甲/.test(name))return 'armor';
 if(/護腕/.test(name))return 'bracer';
 if(weapons.some(w=>name.includes(w)))return 'weapon';
 return 'talisman';
}
function qByLevel(lv){return lv>=90?'gold':lv>=65?'purple':lv>=42?'blue':lv>=25?'green':'white'}
function buildEquipDB(){
 const out={};
 OFFICIAL.monsters3.forEach(row=>{
  const lv=row[1], elements=row[5], eq=row[8]||[];
  eq.forEach(name=>{
   const slot=slotOf(name);if(out[name]){out[name].level=Math.max(out[name].level,lv);return}
   const q=qByLevel(lv), weapon=slot==='weapon';
   const attr={狠:0,快:0,穩:0,智:0,準:0};
   if(weapon)attr.狠=Math.round(lv*.55); else if(slot==='shoes'||slot==='bracer')attr.快=Math.round(lv*.25); else if(slot==='helmet'||slot==='armor'||slot==='belt')attr.穩=Math.round(lv*.45); else if(slot==='necklace'||slot==='artifact')attr.智=Math.round(lv*.32); else if(slot==='ring'||slot==='talisman')attr.準=Math.round(lv*.32);
   out[name]={name,slot,level:lv,quality:q,element:ELEM[elements]||'none',baseAtk:weapon?Math.round(10*Math.pow(lv,.98)):Math.round(slot==='ring'?lv*.4:0),baseDef:['helmet','armor','bracer','belt','shoes'].includes(slot)?Math.round(6*Math.pow(lv,.9)):Math.round(lv*.16),hp:['helmet','armor','belt','shoes'].includes(slot)?Math.round(18*Math.pow(lv,1.03)):Math.round(lv*.8),mp:['necklace','artifact','talisman'].includes(slot)?Math.round(7*Math.pow(lv,.9)):0,attr,source:`3.0怪物掉落（Lv.${lv} ${row[0]}）`};
  });
 });
 ['烈火','八步伏魔槍','絕煞','太乙'].forEach((name,i)=>{out[name]={name,slot:'weapon',level:75,quality:'gold',element:['fire','earth','metal','water'][i],baseAtk:210,baseDef:0,hp:0,mp:0,attr:{狠:42,快:i===2?16:0,穩:i===1?8:0,智:i===3?18:0,準:i===2?18:0},source:'官方3.0職業武器'};});
 return out;
}

function equipItem(name,quiet=false,force=false){const inv=G.inventory[name]||0;if(!inv||!EQUIP_DB[name])return false;const reqLv=Number(EQUIP_DB[name].level)||1;if(G.player.level<reqLv){if(!quiet)toast(`需要 Lv.${reqLv} 才能裝備 ${name}`);return false;}let it=null;const stack=G.inventoryInstances?.[name];if(stack&&stack.length)it=stack.pop();else it=makeEquip(name);if(!it)return false;const slot=it.slot,old=G.equipment[slot];if(old&&!force&&equipScore(old)>=equipScore(it)){if(stack)stack.push(it);return false}if(old){const oldName=old.name||'';if(oldName){G.inventory[oldName]=(G.inventory[oldName]||0)+1;G.inventoryInstances[oldName]=G.inventoryInstances[oldName]||[];G.inventoryInstances[oldName].push(old)}}G.equipment[slot]=it;G.inventory[name]=Math.max(0,(G.inventory[name]||0)-1);ensureStats();if(!quiet)toast(`裝備：${name}`);save(true);return true}

function compareEquip(name){const d=EQUIP_DB[name];if(!d)return null;const cur=G.equipment[d.slot];const candidate=makeEquip(name);if(!candidate)return null;const keys=[['baseAtk','攻'],['baseDef','防'],['hp','HP'],['mp','MP']];const lines=keys.map(([k,label])=>{const a=Number(cur?.[k]||0),b=Number(candidate?.[k]||d[k]||0),diff=b-a;return `${label}:${diff>0?'+':''}${fmt(diff)}`}).filter(x=>!/:0$/.test(x));for(const k of ['狠','準','穩','快','智']){const diff=Number(candidate?.attr?.[k]||d.attr?.[k]||0)-Number(cur?.attr?.[k]||0);if(diff)lines.push(`${k}:${diff>0?'+':''}${fmt(diff)}`)}return {slot:d.slot,cur,candidate,text:lines.join(' · ')||'主要數值無變化'} }

function monsterData(name,lvOverride){const row=OFFICIAL_MONSTER_DATA.find(r=>r[0]===name),base=bossBase[name]||localMons[name]||null;if(base){const sc=lvOverride?lvOverride/base.lv:1;return {name,level:lvOverride||row?.[1]||base.lv,hp:Math.round(base.hp*Math.pow(sc,1.08)*3),maxHp:Math.round(base.hp*Math.pow(sc,1.08)*3),atk:Math.round(base.atk*Math.pow(sc,1.04)*3),def:Math.round(base.def*Math.pow(sc,1.02)),speed:base.spd,interval:Math.max(850,2200-(base.spd||20)*8),element:ELEM[row?.[5]??base.elem]||'none',race:row?.[3]??base.race,size:row?.[2]??base.size??'中',alignment:row?.[4]??base.alignment??'惡',isBoss:!!bossBase[name],drops:row?.[6]||'',dropSkills:row?.[7]||'',equip:row?.[8]||[]}}

function pickWeighted(pool){let total=pool.reduce((a,b)=>a+b.weight,0),r=Math.random()*total;for(const x of pool){if(r<x.weight)return x;r-=x.weight}return pool[0]}

function startEncounter(name,level,mapId,manual=false,extra={}){if(battle?.active)return;ensureStats();const e=monsterData(name,level);battle={mapId,enemy:e,startedAt:Date.now(),pAt:Date.now()+250,eAt:Date.now()+Math.max(850,2200-e.speed*8),petAt:Date.now()+2200,damageTotal:0,turn:0,active:true,status:{burn:0,freeze:0,shock:0,break:0},manual:!!manual,comboIndex:0,...extra};hlog(`遭遇 ${e.name} Lv.${e.level}${e.isBoss?'【BOSS】':''}`,e.isBoss?'lg-boss':'lg-sys');if(manual)openBattleScreen();syncHud()}

function playerAttack(){const s=G.player.stats,e=battle.enemy;if(Math.random()>hitChance({accuracy:s.accuracy},{evasion:e.evasion||0})){G.auto.stats.miss++;hlog(`你攻擊 ${e.name} 未命中`,'lg-sys');return}const crit=Math.random()<s.critRate;const r=calcDamage(s,e,1,'none',crit);e.hp=Math.max(0,e.hp-r.damage);battle.damageTotal+=r.damage;battle.turn++;if(crit)G.auto.stats.crit++;hlog(`普攻命中 ${e.name}：${fmt(r.damage)} 傷害${crit?'（暴擊）':''}`,crit?'lg-crit':'lg-hit')}
function castSkill(sk,manual=false){const s=G.player.stats,e=battle.enemy;if(!sk||!skillReady(sk)||s.mp<(sk.mp||0))return false;if(sk.hpCost&&s.hp<=s.maxHp*(sk.hpCost+.12))return false;if(sk.cleanse){s.mp-=(sk.mp||0);battle.status={burn:0,freeze:0,shock:0,break:battle.status.break||0};G.skills.cooldowns[sk.id]=Date.now()+4000;hlog(`${sk.name} 清除異常`,'lg-heal');return true}if(sk.type==='body'&&sk.heal){s.mp-=(sk.mp||0);const heal=Math.round(s.maxHp*sk.heal);s.hp=Math.min(s.maxHp,s.hp+heal);battle.status.guard=.35;G.skills.cooldowns[sk.id]=Date.now()+3000;hlog(`${sk.name} 回復 ${fmt(heal)} 氣血並進入防禦姿態`,'lg-heal');return true}if(sk.type==='body'&&sk.haste){s.mp-=(sk.mp||0);s.speed+=s.speed*sk.haste;G.skills.cooldowns[sk.id]=Date.now()+5000;hlog(`${sk.name} 提升出手速度`,'lg-heal');return true}

 let skillLevel=Math.max(1,Math.min(5,G.skills.learned[sk.id]?.level||1));const official=officialSkillData(sk,skillLevel,e);let rr=official?1:sk.r*(1+(skillLevel)*.04);const elem=sk.element||'none';const crit=Math.random()<(s.critRate+(official?.critRate??sk.crit??0));const def={...e,def:Math.round(e.def*(battle.status.break?0.72:1))};const r=official?calcDamage(s,def,1,elem,crit,official.base,official.raceMult):calcDamage(s,def,rr,elem,crit);e.hp=Math.max(0,e.hp-r.damage);battle.damageTotal+=r.damage;battle.turn++;G.skills.cooldowns[sk.id]=Date.now()+(sk.cd||Math.max(2,Math.round(3+(sk.mp||0)/18)))*1000;if(crit)G.auto.stats.crit++;if(sk.type==='sword')battle.status.break=1;if(sk.type==='body')battle.status.guard=.35;if(sk.type==='charm'&&sk.stun&&Math.random()<sk.stun)battle.status.shock=1;if(sk.element==='fire'&&Math.random()<.45)battle.status.burn=3;if(sk.element==='water'&&Math.random()<.30)battle.status.freeze=1;if(sk.element==='metal'&&Math.random()<.28)battle.status.shock=1;const om=official?.source?`（${official.source}）`:'';hlog(`${typeName(sk.type)}·${sk.name}：${fmt(r.damage)} 傷害${r.elem>1?'（五行克制）':r.elem<1?'（被克）':''}${crit?'（暴擊）':''}${om}`,crit?'lg-crit':'lg-skill');return true}
function enemyAttack(){const e=battle.enemy,s=G.player.stats;if(battle.status.freeze>0){battle.status.freeze--;hlog(`${e.name} 被凍結，無法行動`,'lg-skill');return}if(battle.status.shock>0){battle.status.shock--;hlog(`${e.name} 感電，行動受阻`,'lg-skill');return}if(battle.status.burn>0){const b=Math.max(1,Math.round(e.maxHp*.035));e.hp=Math.max(0,e.hp-b);battle.status.burn--;hlog(`${e.name} 灼燒 ${fmt(b)}`,'lg-skill');if(e.hp<=0)return}
 const chance=clamp(.8+(e.speed-s.speed)*.0025,0.48,.92);if(Math.random()<s.evasion){hlog(`${e.name} 攻擊落空，你閃身避開`,'lg-sys');return}let raw=Math.max(1,e.atk-s.def*.5)*(battle.status.guard||0?0.65:1)*(G.auto.mode==='guard'?.8:1);const crit=Math.random()<.08;raw*=crit?1.4:1;const d=Math.max(1,Math.round(raw*randomVariance()));s.hp=Math.max(0,s.hp-d);hlog(`${e.name} 反擊：你受 ${fmt(d)} 傷害${crit?'（暴擊）':''}`,'lg-hurt')}
function combatTick(now){if(!battle?.active)return;ensureStats();if(G.auto.enabled&&G.auto.autoPotion&&!battle.manualOnly)autoSupport();if(G.player.stats.hp<=0)return playerDown();if(now>=battle.pAt){if(!battle.manualOnly){if(G.auto.enabled&&G.auto.autoSkill){const sk=chooseAutoSkill();if(sk){if(!castSkill(sk))playerAttack()}else playerAttack()}else playerAttack();battle.pAt=now+Math.max(550,1500-G.player.stats.speed*10)}else{battle.pAt=now+900}}if(battle.enemy.hp<=0)return onKill();if(battle.manualOnly&&battle.enemy.hp>0&&now>=battle.partyAt){const base=Math.max(1,Math.round(G.player.stats.atk*.18));const team=[.85,1.05,.65].map((m,i)=>Math.max(1,Math.round(base*m*randomVariance())));const aid=team.reduce((a,b)=>a+b,0);battle.enemy.hp=Math.max(0,battle.enemy.hp-aid);battle.damageTotal+=aid;hlog(`三人助戰：合計 ${fmt(aid)} 傷害`,'lg-skill');battle.partyAt=now+2200;if(battle.enemy.hp<=0)return onKill()}if(battle.enemy.hp<=0)return onKill();if(now>=battle.eAt){enemyAttack();battle.eAt=now+battle.enemy.interval}if(battle?.active&&now>=battle.petAt){const pet=petData();if(pet&&battle.enemy.hp>0){const pd={...battle.enemy,def:battle.enemy.def*.75};const pc={atk:Math.round((pet.atk||0)+(G.player.stats.atk*.12)),elem:G.player.preferredElement||'none',elemPower:G.player.stats.elemPower||{}};const pr=calcDamage(pc,pd,.85,pc.elem,false);battle.enemy.hp=Math.max(0,battle.enemy.hp-pr.damage);battle.damageTotal+=pr.damage;hlog(`${pet.name} 協戰：${fmt(pr.damage)} 傷害`,'lg-skill');battle.petAt=now+Math.max(1200,Math.round(2800-(pet.fast||0)*90))}}if(G.player.stats.hp<=0)return playerDown();if(battle.enemy.hp<=0)onKill()}
function autoSupport(){const s=G.player.stats,a=G.auto;if(s.hp/s.maxHp<a.hpThreshold)usePotion('hp');if(s.mp/s.maxMp<a.mpThreshold)usePotion('mp')}

function monsterExp(e){const lv=Number(e.level)||1,gap=Math.max(-20,Math.min(30,lv-G.player.level));return e.isBoss?Math.floor(lv*60+gap*5):Math.floor(lv*16+gap*2+lv*lv*.06)}

function forgeEnhance(slot){const it=G.equipment[slot];if(!it)return toast('該部位沒有裝備');if((it.enhance||0)>=15)return toast('已達 +15');const lv=(it.enhance||0)+1,cost=30000*lv; if(G.player.spiritStone<cost)return toast('靈石不足');G.player.spiritStone-=cost;const rate=lv<=6?1:lv<=13?1/3:1/6;if(Math.random()<rate){it.enhance=lv;it.baseAtk=Math.round((it.baseAtk||0)*1.06+2);it.baseDef=Math.round((it.baseDef||0)*1.06+1);if(it.hp)it.hp=Math.round(it.hp*1.045);toast(`${it.name} 強化 +${lv}`)}else{toast(`${it.name} 強化失敗`)}ensureStats();renderAll()}

function forgeSocket(slot){const it=G.equipment[slot];if(!it)return toast('該部位沒有裝備');if((it.sockets||0)>=3)return toast('最多 3 孔');if((G.inventory['打孔石']||0)<1)return toast('需要打孔石');G.inventory['打孔石']--;it.sockets=(it.sockets||0)+1;it.gems=it.gems||[];toast(`${it.name} 開孔至 ${it.sockets} 孔`);renderAll()}

function forgeGem(slot,key){const it=G.equipment[slot];if(!it)return toast('該部位沒有裝備');if((it.gems||[]).includes(key)&&typeof key==='string'&&key.endsWith('血珀'))return toast('已鑲嵌');if((it.sockets||0)<=((it.gems||[]).length))return toast('沒有空孔');if((G.inventory[key]||0)<1)return toast('沒有 '+key);G.inventory[key]--;it.gems=it.gems||[];it.gems.push(key);toast(`鑲嵌 ${key}`);ensureStats();renderAll()}
function forgeReroll(slot){const it=G.equipment[slot];if(!it)return toast('該部位沒有裝備');if((G.inventory['玄鐵']||0)<3)return toast('需要玄鐵 ×3');G.inventory['玄鐵']-=3;it.affix=randomAffix(it.level);toast(`${it.name} 洗煉為 ${it.affix.key}+${it.affix.value}`);ensureStats();renderAll()}
function dismantleInventory(name){const qty=G.inventory[name]||0;if(!qty||!EQUIP_DB[name])return toast('沒有可分解裝備');G.inventory[name]--;if(G.inventoryInstances?.[name]?.length)G.inventoryInstances[name].pop();const it=EQUIP_DB[name];const iron=Math.max(1,Math.floor(it.level/8));const stone=Math.max(1,Math.floor(it.level/15));G.inventory['玄鐵']=(G.inventory['玄鐵']||0)+iron;G.player.spiritStone+=stone;toast(`${name} 分解：玄鐵×${iron}、靈石×${stone}`);renderAll()}
function synthesize(name){const d=EQUIP_DB[name];if(!d)return;const q=G.inventoryQuality?.[name]||d.quality;const same=EQUIP_NAMES.filter(n=>EQUIP_DB[n].slot===d.slot&&(G.inventoryQuality?.[n]||EQUIP_DB[n].quality)===q).filter(n=>(G.inventory[n]||0)>0);const selected=[];for(const n of same){while((G.inventory[n]||0)>0&&selected.length<3){selected.push(n);G.inventory[n]--;if(selected.length===3)break}}if(selected.length<3){selected.forEach(n=>G.inventory[n]=(G.inventory[n]||0)+1);return toast('需要 3 件同品質同部位裝備')}const order=['white','green','blue','purple','gold'],next=order[Math.min(order.length-1,order.indexOf(q)+1)];G.inventoryQuality[name]=next;G.inventory[name]=(G.inventory[name]||0)+1;toast(next==='gold'?`合成成功：${name} 已達天品`:`合成成功：${name} 品質提升至 ${QUALITY[next]}`);renderAll()}
function enhanceEquippedAll(){let n=0;for(const s of SLOT_ORDER){const it=G.equipment[s];if(it?.enhance<15){const before=it.enhance;for(let i=before;i<15&&G.player.spiritStone>=30000*(i+1);i++)forgeEnhance(s);n++}}if(n)toast('已強化可用裝備')}

function buyShopItem(kind,key,name){const item=G.market?.[key];const row=MARKET[key];if(!row)return;const cost=item?.price||row[1];if(G.player.spiritStone<cost)return toast('靈石不足');G.player.spiritStone-=cost;if(row[2]==='potion'||row[2]==='item')G.inventory[row[3]]=(G.inventory[row[3]]||0)+1;else G.inventory[row[3]]=(G.inventory[row[3]]||0)+1;toast('購入 '+row[0]);renderAll()}
function buyEquip(name){const d=EQUIP_DB[name];if(!d)return;if(d.level>50)return toast('Lv.51以上裝備改由打怪掉落');if(G.player.level<d.level)return toast(`需要 Lv.${d.level}`);if(G.player.level<d.level)return toast(`需要 Lv.${d.level}`);const cost=Math.max(100,Math.round(Math.pow(d.level,1.58)*12));if(G.player.spiritStone<cost)return toast('靈石不足');G.player.spiritStone-=cost;G.inventory[name]=(G.inventory[name]||0)+1;toast(`購入 ${name}`);renderAll()}

function paintLog(){const h=huntLog.map(x=>`<div class="${x.cls}">${x.t}</div>`).join('');if($('huntLog'))$('huntLog').innerHTML=h;if($('fightLog'))$('fightLog').innerHTML=h}
function syncHud(){ensureStats();const p=G.player,s=p.stats,c=classData();const set=(id,v)=>{const el=$(id);if(el&&el.textContent!==String(v))el.textContent=String(v)};set('pname',G.name||'少俠');set('prealm',c?`${G.player.classKey} · Lv.${p.level}`:`Lv.${p.level}`);set('lv',String(p.level));set('className',c?G.player.classKey:'未選門派');const av=$('avatar');if(av)av.textContent=c?c.icon:'✦';set('realmText',fmt(p.exp)+'/'+fmt(expNeed()));set('power',fmt(power()));set('powerRate','+'+fmt(powerRate())+'/s');set('stone',fmt(p.spiritStone));set('hereMap',currentMap().name);set('autoState',pendingBoss?'Boss對峙':battle?.active?(G.auto.enabled?'自動戰鬥':'手動戰鬥'):(G.auto.enabled?'搜敵中':'閒置'));const hp=clamp(s.hp/s.maxHp,0,1),mp=clamp(s.mp/s.maxMp,0,1);if($('hpFill'))$('hpFill').style.width=hp*100+'%';if($('mpFill'))$('mpFill').style.width=mp*100+'%';set('hpText','氣血 '+fmt(s.hp)+' / '+fmt(s.maxHp));set('mpText','法力 '+fmt(s.mp)+' / '+fmt(s.maxMp));if($('powerFill'))$('powerFill').style.width=clamp(p.exp/expNeed(),0,1)*100+'%';set('powerText',fmt(p.exp)+' / '+fmt(expNeed()));const ab=$('autoBtn');if(ab)ab.classList.toggle('on',G.auto.enabled);if($('huntFoe')){if(battle?.active){$('huntFoe').textContent=(battle.enemy.isBoss?'★ ':'')+battle.enemy.name+' Lv.'+battle.enemy.level;$('huntFoe').className='foe '+(battle.enemy.isBoss?'lv-boss':'lv-even');$('huntBarFill').style.width=clamp(battle.enemy.hp/battle.enemy.maxHp,0,1)*100+'%';$('huntMeta').textContent=`${elementName(battle.enemy.element)} · HP ${fmt(battle.enemy.hp)}/${fmt(battle.enemy.maxHp)} · 攻 ${fmt(battle.enemy.atk)} · 防 ${fmt(battle.enemy.def)}`}else{$('huntFoe').textContent=G.auto.enabled?'搜尋對手…':'尚未開戰';$('huntFoe').className='foe lv-easy';$('huntBarFill').style.width='0%';$('huntMeta').textContent=currentMap().name+' · '+currentMap().zone}}set('tkKill',fmt(G.auto.stats.kills));set('tkStone',fmt(G.auto.stats.stones));set('tkDrop',fmt(G.auto.stats.drops));if($('huntBuffs'))$('huntBuffs').textContent=`${G.player.classKey||'未選'} · 五行 ${elementName(p.preferredElement)} · 五屬 ${Object.entries(s.attr||{}).map(([k,v])=>k+Math.floor(v)).join(' ')}`}
function syncBattle(){if(!battle)return;const s=G.player.stats,e=battle.enemy;const pp=clamp(s.hp/s.maxHp,0,1)*100,ep=clamp(e.hp/e.maxHp,0,1)*100,mp=clamp(s.mp/s.maxMp,0,1)*100;$('bfPlayerPct').textContent=Math.round(pp)+'%';$('bfEnemyPct').textContent=Math.round(ep)+'%';$('bfPHP').style.width=pp+'%';$('bfEHP').style.width=ep+'%';$('bfPMP').style.width=mp+'%';$('bfPlayer').textContent=G.name;$('bfEnemy').textContent=(e.isBoss?'★ ':'')+e.name;$('battleTitle').textContent=e.name+' Lv.'+e.level;$('battleStatus').textContent=`${G.player.classKey||'門派'} · ${battle.turn} 回 · 傷害 ${fmt(battle.damageTotal)}${battle.manualOnly?' · 沙魔巢穴禁止自動出招':''}`;$('bfPStatus').textContent=`HP ${fmt(s.hp)} · MP ${fmt(s.mp)} · 狠${Math.floor(s.attr.狠)} 快${Math.floor(s.attr.快)} 穩${Math.floor(s.attr.穩)} 智${Math.floor(s.attr.智)} 準${Math.floor(s.attr.準)}`;$('bfEStatus').textContent=`${elementName(e.element)} · ${e.race||'獸'}${battle.status.burn?' · 灼燒':''}${battle.status.freeze?' · 凍結':''}${battle.status.shock?' · 感電':''}`;const btns=G.skills.equipped.map((id,i)=>{const sk=Object.values(SKILLS).find(x=>x.id===id);if(!sk)return `<button class="smallbtn" disabled>連招${i+1}<br>空槽</button>`;const ready=skillReady(sk)&&G.player.stats.mp>=(sk.mp||0);return `<button class="smallbtn" ${ready?'':'disabled'} onclick="manualSkill('${sk.id}')">連招${i+1} · ${sk.name}<br><span style="font-size:9px">${elementName(sk.element)} · MP ${sk.mp||0}</span></button>`}).join('');$('battleActions').innerHTML=btns+`<button class="smallbtn good" onclick="manualAttack()">普通攻擊</button><button class="smallbtn" onclick="manualPotion('hp')">氣血丹</button><button class="smallbtn" onclick="manualPotion('mp')">聚靈丹</button><button class="smallbtn danger" onclick="flee()">離開</button>`}

function renderWorld(){const m=currentMap();const pool=mapPool();return `<div class="hunt" id="huntBox"><div class="huntline"><span class="foe lv-easy" id="huntFoe">${G.auto.enabled?'搜尋對手…':'尚未開戰'}</span><span class="monster-meta" id="huntBuffs">${G.player.classKey||''}</span></div><div class="foebar"><i id="huntBarFill" style="width:0%"></i></div><div class="monster-meta" id="huntMeta" style="margin-top:5px">${m.name} · ${m.zone}</div><div class="tickers"><div class="ticker">擊殺<b id="tkKill">${fmt(G.auto.stats.kills)}</b></div><div class="ticker">靈石<b id="tkStone">${fmt(G.auto.stats.stones)}</b></div><div class="ticker">掉落<b id="tkDrop">${fmt(G.auto.stats.drops)}</b></div></div><div class="row" style="margin-top:8px"><button class="smallbtn hot" onclick="toggleAuto()">${G.auto.enabled?'停止掛機':'開始掛機'}</button><button class="smallbtn" onclick="openBattleScreen()">戰鬥畫面</button><button class="smallbtn danger" onclick="flee()">撤退</button></div><div class="battlelog" id="huntLog"></div></div><div class="card"><h2 class="title">${m.name}</h2><p class="desc">${m.desc}</p><div class="maplist">${pool.map(x=>{const d=monsterData(x.name,x.level);return `<div class="map"><div class="line"><strong class="mapname">${x.name}</strong><span class="badge">Lv.${x.level} · ${elementName(d.element)}</span></div><div class="monster-meta">種族 ${d.race||'獸'} · 攻 ${fmt(d.atk)} · 防 ${fmt(d.def)} · HP ${fmt(d.maxHp)}</div></div>`}).join('')}</div></div>`}
function inventorySellPrice(name){const d=EQUIP_DB[name];if(!d)return 0;return Math.max(1,Math.floor(Math.max(100,Math.round(Math.pow(d.level,1.58)*12))*.35))}
function sellInventoryAll(name){const qty=Number(G.inventory[name]||0);if(!qty)return toast('沒有可販賣的物品');const price=inventorySellPrice(name);if(!price)return toast('此物品不可販賣');const total=qty*price;G.inventory[name]=0;if(G.inventoryInstances?.[name])G.inventoryInstances[name]=[];G.player.spiritStone+=total;save(true);closeInventoryDetail();toast(`全部賣出：${name} ×${qty}，獲得靈石 ${fmt(total)}`);renderAll()}
function openInventoryDetail(name){const qty=Number(G.inventory[name]||0);if(qty<=0)return;const d=EQUIP_DB[name];const title=$('inventoryDetailTitle'),body=$('inventoryDetailBody');if(!title||!body)return;title.textContent=name;if(d){const q=G.inventoryQuality?.[name]||d.quality;const c=compareEquip(name);body.innerHTML=`<div class="card"><p class="desc">裝備：${SLOT_NAMES[d.slot]} · ${QUALITY[q]} · Lv.${d.level}</p><div class="inventory-detail-grid"><div class="stat">攻擊<em>${fmt(d.baseAtk)}</em></div><div class="stat">防禦<em>${fmt(d.baseDef)}</em></div><div class="stat">HP<em>${fmt(d.hp)}</em></div><div class="stat">MP<em>${fmt(d.mp)}</em></div></div><p class="desc" style="margin-top:7px">${Object.entries(d.attr||{}).filter(([,v])=>v).map(([k,v])=>k+'+'+v).join('、')||'基礎屬性'} · 持有 ×${qty}</p>${c?`<p class="desc">與目前裝備比較：${c.cur?c.cur.name:'空'} · ${c.text}</p>`:''}<p class="footer-note">${d.source||'可由戰鬥掉落或商店取得。'}</p><div class="row" style="margin-top:8px"><button class="smallbtn hot" onclick="equipItem('${name}',false,true);closeInventoryDetail();renderAll()">裝備</button><button class="smallbtn danger" onclick="sellInventoryAll('${name}')">販賣全部 ×${qty}（${fmt(inventorySellPrice(name)*qty)}）</button><button class="smallbtn" onclick="dismantleInventory('${name}');closeInventoryDetail()">分解 1 件</button></div></div>`}else{body.innerHTML=`<div class="card"><p class="desc">物品：${name}</p><p class="desc">持有數量：×${qty}</p><p class="footer-note">材料／道具，可用於商店、煉器或戰鬥消耗。</p></div>`}$('inventoryDetailModal').classList.add('show')}
function closeInventoryDetail(){$('inventoryDetailModal')?.classList.remove('show')}

function renderInventory(){const names=Object.keys(G.inventory).filter(k=>G.inventory[k]>0);const equips=names.filter(n=>EQUIP_DB[n]).sort((a,b)=>(EQUIP_DB[a].level||0)-(EQUIP_DB[b].level||0));const mats=names.filter(n=>!EQUIP_DB[n]);const tab=window.inventoryTab||'all';const shown=tab==='all'?equips:equips.filter(n=>tab==='weapon'?EQUIP_DB[n].slot==='weapon':['helmet','armor','bracer','belt','shoes','necklace','ring','artifact','talisman'].includes(EQUIP_DB[n].slot));const eqHtml=shown.map(n=>{const d=EQUIP_DB[n],q=G.inventoryQuality?.[n]||d.quality;return `<div class="item" onclick="openInventoryDetail('${n}')" style="cursor:pointer"><div class="line"><strong class="quality-${q}">${n}</strong><span class="qty">×${G.inventory[n]}</span></div><div class="desc">${SLOT_NAMES[d.slot]} · ${QUALITY[q]} · Lv.${d.level} · 攻 ${fmt(d.baseAtk)} · 防 ${fmt(d.baseDef)} · ${Object.entries(d.attr).filter(([,v])=>v).map(([k,v])=>k+'+'+v).join('、')}</div>${equipCompareHtml(n)}<div class="row" style="margin-top:5px"><button class="smallbtn hot" onclick="event.stopPropagation();openInventoryDetail('${n}')">選擇</button></div></div>`}).join('');const matHtml=mats.map(n=>`<div class="item" onclick="openInventoryDetail('${n}')" style="cursor:pointer"><div class="line"><strong>${n}</strong><span class="qty">×${G.inventory[n]}</span></div><div class="desc">材料／道具 · 點選查看文字與說明</div></div>`).join('');return `<div class="card"><h2 class="title">背包</h2><div class="inventory-tabs"><button class="tab ${tab==='all'?'active':''}" onclick="inventoryTab='all';renderAll()">全部裝備</button><button class="tab ${tab==='weapon'?'active':''}" onclick="inventoryTab='weapon';renderAll()">武器</button><button class="tab ${tab==='armor'?'active':''}" onclick="inventoryTab='armor';renderAll()">防具</button><button class="tab ${tab==='item'?'active':''}" onclick="inventoryTab='item';renderAll()">物品</button></div><p class="footer-note">點選物品查看文字與說明；選擇裝備後可裝備、販賣全部或分解。販賣不包含身上已穿戴裝備。</p></div><div class="card"><h2 class="title">身上裝備</h2><div>${SLOT_ORDER.map(s=>{const it=G.equipment[s];return `<div class="item"><div class="line"><span class="equip-chip"><b>${SLOT_NAMES[s]}</b>${it?it.name+' +'+(it.enhance||0):'空'}</span>${it?`<button class="smallbtn danger" onclick="unequipItem('${s}')">卸下</button>`:''}</div>${it?`<div class="desc">攻 ${fmt(it.baseAtk)} · 防 ${fmt(it.baseDef)} · HP ${fmt(it.hp)} · MP ${fmt(it.mp)} · ${Object.entries(it.attr||{}).filter(([,v])=>v).map(([k,v])=>k+'+'+v).join('、')||'基礎屬性'}</div>`:''}</div>`}).join('')}</div></div><div class="card"><h2 class="title">${tab==='item'?'物品欄':tab==='weapon'?'武器物品欄':tab==='armor'?'防具物品欄':'全部裝備物品欄'}</h2><div class="invgrid">${tab==='item'?matHtml:(eqHtml||'<p class="desc">尚無裝備。</p>')}</div></div>`}

function renderSkills(){const equip=G.skills.equipped.map((id,i)=>Object.values(SKILLS).find(s=>s.id===id));const rows=SKILL_LIST.map(sk=>{const got=!!G.skills.learned[sk.id],eqIdx=G.skills.equipped.indexOf(sk.id);return `<div class="skill ${eqIdx>=0?'eqd':''}"><div class="line"><strong class="skill-name">${sk.name}</strong><span class="skill-tag">${typeName(sk.type)} · ${QUALITY[sk.q]} · Lv.${sk.lv}</span></div><div class="skill-info">倍率 ${(sk.r*100).toFixed(0)}% · ${elementName(sk.element)} · MP ${sk.mp||0}${sk.hpCost?' · HP消耗 '+Math.round(sk.hpCost*100)+'%':''} · ${sk.desc}<br><span class="muted">來源：${sk.src}</span></div><div class="row" style="margin-top:5px;align-items:center"><select class="smallbtn" style="padding:6px 8px" ${got?'':'disabled'} onchange="assignSkillSlot('${sk.id}',Number(this.value))"><option value="-1" ${eqIdx<0?'selected':''}>不上陣</option>${[0,1,2,3].map(i=>`<option value="${i}" ${eqIdx===i?'selected':''}>連招${i+1}</option>`).join('')}</select>${got?'':(sk.lv<=50?'<button class="smallbtn good" onclick="buySkill(\''+sk.id+'\')">研讀</button>':'<span class="skill-tag">怪物掉落</span>')}</div></div>`}).join('');return `<div class="card"><h2 class="title">神通／4槽連招</h2><p class="desc">全門派共用神通庫。可自由把已學招式放入 1～4 槽，戰鬥 AI 依槽位順序輪轉；五行克制、MP 與冷卻仍會即時判斷。</p><div class="combo-grid">${equip.map((sk,i)=>`<div class="combo-slot ${sk?'active':''}"><b>連招 ${i+1}</b><strong>${sk?sk.name:'空槽'}</strong><span>${sk?elementName(sk.element)+' · MP '+(sk.mp||0):'等待配置'}</span></div>`).join('')}</div><div class="dungeon-note">連招：1 → 2 → 3 → 4 循環。當當前槽位因 MP／冷卻不可用時，AI 會往後尋找下一招，不會卡住。</div></div><div class="skilllist">${rows}</div>`}
function buySkill(id){const sk=Object.values(SKILLS).find(s=>s.id===id);if(!sk)return;if(sk.lv>50)return toast('Lv.51以上招式只能由怪物掉落');if(G.player.level<sk.lv)return toast(`需要 Lv.${sk.lv}`);if(G.player.spiritStone<Math.max(60,sk.lv*18))return toast('靈石不足');G.player.spiritStone-=Math.max(60,sk.lv*18);learnSkill(sk.name);renderAll()}
function assignSkillSlot(id,slot){const sk=Object.values(SKILLS).find(s=>s.id===id);if(!sk)return;slot=Number(slot);G.skills.equipped=Array.isArray(G.skills.equipped)?G.skills.equipped.slice(0,4):[null,null,null,null];while(G.skills.equipped.length<4)G.skills.equipped.push(null);for(let i=0;i<4;i++)if(G.skills.equipped[i]===id)G.skills.equipped[i]=null;if(slot>=0&&slot<4){const old=G.skills.equipped[slot];if(old&&old!==id){const oldIdx=G.skills.equipped.indexOf(old);if(oldIdx>=0)G.skills.equipped[oldIdx]=null}G.skills.equipped[slot]=id}save(true);renderAll()}
function equipSkill(id){const idx=(G.skills.equipped||[]).indexOf(id);if(idx>=0){assignSkillSlot(id,-1);return}const slot=(G.skills.equipped||[]).findIndex(x=>!x);assignSkillSlot(id,slot<0?0:slot)}
function renderShop(){const L=G.player.level;const all=EQUIP_NAMES.slice().filter(n=>EQUIP_DB[n].level<=50).sort((a,b)=>EQUIP_DB[a].level-EQUIP_DB[b].level);const weapons=all.filter(n=>EQUIP_DB[n].slot==='weapon');const armor=all.filter(n=>EQUIP_DB[n].slot!=='weapon');const equipCard=n=>{const d=EQUIP_DB[n],locked=L<d.level,cost=Math.max(100,Math.round(Math.pow(d.level,1.58)*12));return `<div class="shopitem"><div class="line"><strong class="quality-${d.quality}">${d.slot==='weapon'?'⚔':'🛡'} ${n}</strong><span class="price">${fmt(cost)}</span></div><div class="desc">Lv.${d.level} · ${SLOT_NAMES[d.slot]} · 五行 ${elementName(d.element)} · 攻 ${fmt(d.baseAtk)} · 防 ${fmt(d.baseDef)} · HP ${fmt(d.hp)}<br>${Object.entries(d.attr).filter(([,v])=>v).map(([k,v])=>k+'+'+v).join('、')||'基礎屬性'}<br><span class="muted">${d.source}</span></div><button class="smallbtn ${locked?'':'good'}" style="margin-top:5px" ${locked?'disabled':''} onclick="buyEquip('${n}')">${locked?'Lv.'+d.level+'解鎖':'購買'}</button></div>`};const starter=`<div class="shopgrid">${Object.values(BASIC_EQUIP).map(d=>`<div class="shopitem"><div class="line"><strong>${d.name}</strong><span class="price">50</span></div><div class="desc">新手通用裝 · ${SLOT_NAMES[d.slot]}</div><button class="smallbtn" onclick="G.player.spiritStone>=50&&(G.player.spiritStone-=50,G.inventory['${d.name}']=(G.inventory['${d.name}']||0)+1,renderAll())">購買</button></div>`).join('')}</div>`;const matShop=(G.market||[]).map((x,i)=>`<div class="shopitem"><div class="line"><strong>${x.name}</strong><span class="price">${fmt(x.price)}</span></div><div class="desc">${x.type}</div><button class="smallbtn" onclick="buyShopItem('${x.type}',${i})">購買</button></div>`).join('');const petShop=Object.values(PET_DB).map(x=>`<div class="pet ${G.pets.equipped===x.name?'equipped':''}"><div class="peticon">${x.icon}</div><div class="petname">${x.name}</div><div class="desc">${x.desc}<br>攻 ${x.atk} · 防 ${x.def} · HP ${x.hp} · 快 ${x.fast} · 暴擊 ${(x.crit*100).toFixed(1)}%</div><button class="smallbtn" style="margin-top:5px" onclick="buyPet('${x.name}')">${G.pets.owned.includes(x.name)?(G.pets.equipped===x.name?'已出戰':'出戰'):(x.cost?'購買 '+fmt(x.cost):'領取')}</button></div>`).join('');return `<div class="card"><h2 class="title">武器舖</h2><p class="desc">仿官方商鋪交易：商店只開放 Lv.1～50 武器；Lv.51 以上不販售，改由江湖打怪掉落。</p><div class="shopgrid">${weapons.map(equipCard).join('')}</div></div><div class="card"><h2 class="title">防具店</h2><p class="desc">頭盔、衣服、護腕、腰帶、鞋、項鍊、戒指、法寶、護符；商店開放至 Lv.50，50級以上裝備靠怪物掉寶取得。</p><div class="shopgrid">${armor.map(equipCard).join('')}</div></div><div class="card"><h2 class="title">Lv.50以上掉寶</h2><p class="desc">Lv.51+ 裝備不進商店名單。AI 掛機會依官方怪物資料尋找相應掉落，取得後自動比較、穿戴；3.0 怪物與裝備資料沿用官方掉落表。</p><div class="feature-list"><div><b>掉寶：</b>水鬼～靈甲鬼等官方 3.0 怪物依等級逐步取得高階裝備。</div><div><b>職業武器：</b>烈火、八步伏魔槍、絕煞、太乙維持高階取得／打造，不在 Lv.50 商店販售。</div></div></div><div class="card"><h2 class="title">新手雜貨</h2>${starter}</div><div class="card"><h2 class="title">材料商</h2><div class="shopgrid">${matShop}</div></div><div class="card"><h2 class="title">靈寵苑</h2><p class="desc">全職通用；靈寵提供被動屬性並在戰鬥中自動協戰。</p><div class="petlist">${petShop}</div></div>`}
function enhanceSelected(slot){if(!slot||!G.equipment[slot])return toast('請先選擇已裝備部位');forgeEnhance(slot)}
function enhanceSelectedToAvailable(slot){const it=G.equipment[slot];if(!it)return toast('請先選擇已裝備部位');let count=0;while((it.enhance||0)<15){const cost=30000*((it.enhance||0)+1);if(G.player.spiritStone<cost)break;forgeEnhance(slot);count++}toast(count?`${it.name} 共強化 ${count} 次`:'靈石不足或已達 +15')}

function renderForge(){const enhanceTarget=window.enhanceMenuSlot||SLOT_ORDER.find(s=>G.equipment[s])||SLOT_ORDER[0];const targetIt=G.equipment[enhanceTarget];const enhanceMenu=`<div class="card"><h3 class="title">強化選單</h3><p class="desc">選擇身上裝備後直接強化；每次強化消耗 30000 × 下一強化等級靈石，最高 +15（+1~+6 成功率 100%，+7~+13 成功率 33.3%，+14~+15 成功率 16.7%）。</p><div class="enhance-menu"><select onchange="enhanceMenuSlot=this.value;renderAll()">${SLOT_ORDER.map(s=>`<option value="${s}" ${enhanceTarget===s?'selected':''}>${SLOT_NAMES[s]}${G.equipment[s]?' · '+G.equipment[s].name+' +'+(G.equipment[s].enhance||0):' · 空'}</option>`).join('')}</select><button class="smallbtn hot" ${targetIt?'':'disabled'} onclick="enhanceSelected('${enhanceTarget}')">強化 +1</button><button class="smallbtn" ${targetIt?'':'disabled'} onclick="enhanceSelectedToAvailable('${enhanceTarget}')">強化至可用</button></div>${targetIt?`<p class="footer-note">目前 +${targetIt.enhance||0} → 下一級 +${(targetIt.enhance||0)+1}，需要靈石 ${fmt(30000*((targetIt.enhance||0)+1))}。</p>`:'<p class="footer-note">目前沒有可強化裝備。</p>'}</div>`;const eq=SLOT_ORDER.map(s=>({slot:s,it:G.equipment[s]}));const equipHtml=eq.map(x=>`<div class="stat" style="display:block"><div class="line"><strong>${SLOT_NAMES[x.slot]}</strong><span>${x.it?x.it.name+' +'+(x.it.enhance||0):'空'}</span></div>${x.it?`<div class="desc">精煉 ${x.it.refine||0}% · 孔 ${x.it.sockets||0}/3 · 詞條 ${x.it.affix?x.it.affix.key+'+'+x.it.affix.value:'—'}${x.it.gems?.length?' · '+x.it.gems.join('、'):''}</div><div class="row" style="margin-top:5px"><button class="smallbtn" onclick="forgeEnhance('${x.slot}')">強化</button><button class="smallbtn" onclick="forgeRefine('${x.slot}')">精煉</button><button class="smallbtn" onclick="forgeSocket('${x.slot}')">開孔</button><button class="smallbtn" onclick="forgeReroll('${x.slot}')">洗煉</button></div>`:''}</div>`).join('');const target=G.equipment.weapon?'weapon':SLOT_ORDER.find(s=>G.equipment[s])||'weapon';const gemBtns=G.equipment[target]?(GEM_KEYS.map(k=>`<button class="smallbtn" onclick="forgeGem('${target}','${k}')">${k} (${G.inventory[k]||0})</button>`).join('')+OFFICIAL.blood.filter(k=>(G.inventory[k]||0)>0).map(k=>`<button class="smallbtn" onclick="forgeGem('${target}','${k}')">${k} (${G.inventory[k]||0})</button>`).join('')):'先裝備物品';const synth=EQUIP_NAMES.filter(n=>G.inventory[n]&&G.inventory[n]>=1).slice(0,24).map(n=>`<button class="smallbtn" onclick="synthesize('${n}')">3合1：${n}</button>`).join('');return enhanceMenu+`<div class="card"><h2 class="title">煉器殿 · 10部位</h2><p class="desc">八大功能完整開啟：強化、精煉、開孔、鑲嵌靈石、五行靈石、洗煉、分解、合成。</p><div class="statgrid">${equipHtml}</div></div><div class="card"><h3 class="title">靈石鑲嵌</h3><div class="row">${gemBtns}</div><p class="footer-note">每件最多 3 孔；攻擊／防禦／氣血靈石與五行靈石皆為通用材料。</p></div><div class="card"><h3 class="title">裝備合成</h3><p class="desc">選一件現有裝備作為目標，消耗任意 3 件同品質、同部位裝備。</p><div class="row">${synth||'背包沒有可合成的裝備'}</div></div>`}

function dungeonToday(id){const today=new Date().toISOString().slice(0,10);const st=G.dungeons[id]||{};if(st.day!==today){st.day=today;st.clears=0}G.dungeons[id]=st;return st}
function grantDungeonItem(name,qty=1){G.inventory[name]=(G.inventory[name]||0)+qty}
function grantDungeonSkill(name){if(SKILLS[name]){learnSkill(name,true);G.auto.stats.skillDrops=(G.auto.stats.skillDrops||0)+1;hlog(`副本秘籍：${name}`,'lg-drop')}}
function randomSkillName(pool){const p=pool.filter(n=>SKILLS[n]);return p.length?p[Math.floor(Math.random()*p.length)]:null}
function startFiveElementsTower(manual=true){const st=G.dungeons.five_elements_tower||{floor:1,best:0};const floor=clamp(Number(st.floor)||1,1,10);if(G.player.level<30)return toast('五行妖閣需要 Lv.30');startEncounter('五行妖',105+floor*3,'dungeon3',manual,{dungeonKind:'five_elements_tower',dungeonData:{floor}});hlog(`五行妖閣：第 ${floor} 層`,'lg-drop')}
function resolveFiveElementsTower(ctx){const st=G.dungeons.five_elements_tower||{floor:1,best:0},f=ctx.floor||1;grantDungeonItem(['金靈石','木靈石','水靈石','火靈石','土靈石'][(f-1)%5],Math.max(2,Math.ceil(f/2)));grantDungeonItem('五行妖魄',1+Math.floor(f/4));if(Math.random()<.35)grantDungeonItem('高階五行寶石碎片',1+Math.floor(f/3));if(Math.random()<.18){const n=randomSkillName(['楓葉花開','雪落無痕','鶴擊月華','無相密宗']);if(n)grantDungeonSkill(n)}st.floor=f<10?f+1:1;st.best=Math.max(st.best,f);G.dungeons.five_elements_tower=st;hlog(`五行妖閣通關第 ${f} 層，下一層 ${st.floor}`,'lg-drop');toast(f>=10?'五行妖閣十層通破，回到第1層':'五行妖閣突破成功')}
function runTrialTemple(){if(G.player.level<40)return toast('試煉神殿需要 Lv.40');const s=G.player.stats,e={element:['metal','wood','water','fire','earth'][Math.floor(Math.random()*5)],def:Math.max(20,s.atk*.38),maxHp:1e9};let total=0,detail=[],combo=0;for(let r=1;r<=5;r++){let sk=null;for(let n=0;n<4;n++){const idx=(combo+n)%4,id=G.skills.equipped[idx],cand=id?Object.values(SKILLS).find(x=>x.id===id):null;if(cand){sk=cand;combo=(idx+1)%4;break}}if(sk){const rr=sk.r*(1+(G.skills.learned[sk.id]?.level||1)*.04),base=Math.max(1,(s.atk*rr)-(e.def*.5)),mult=fiveMultiplier(sk.element||'none',e.element),dmg=Math.max(1,Math.round(base*mult*(1+(sk.crit||0)*.6)));total+=dmg;detail.push(`第${r}回合 ${sk.name} ${fmt(dmg)}${mult>1?' 五行克制':''}`)}else{const dmg=Math.max(1,Math.round(s.atk*.9));total+=dmg;detail.push(`第${r}回合 普攻 ${fmt(dmg)}`)}}const st=G.dungeons.trial_temple||{best:0,runs:0};st.best=Math.max(st.best,total);st.runs=(st.runs||0)+1;G.dungeons.trial_temple=st;const tier=total>=250000?'天品試煉':total>=120000?'地品試煉':total>=60000?'玄品試煉':'凡品試煉',rewardStone=Math.round(total*.018)+1000,exp=Math.round(total*.12);G.player.spiritStone+=rewardStone;G.player.exp+=exp;grantDungeonItem('試煉令',1);if(total>=60000)grantDungeonItem('精煉石',2);if(total>=120000)grantDungeonItem('高階五行寶石碎片',1);if(total>=250000){grantDungeonItem('五行妖魄',2);const n=randomSkillName(['楓葉花開','雪落無痕','鶴擊月華','無相密宗']);if(n)grantDungeonSkill(n)}levelUp();log(`試煉神殿：5回合總傷害 ${fmt(total)}，${tier}`,'lg-drop');toast(`5回合 ${fmt(total)} 傷害 · ${tier}`);return detail}
function startMaze(){if(G.player.level<50)return toast('迷宮尋寶需要 Lv.50');const st=G.dungeons.maze_treasure||{runs:0,best:0,path:[]};st.step=1;st.path=[];st.reward=0;st.active=true;G.dungeons.maze_treasure=st;renderAll();toast('迷宮開啟：選擇一條路線')}
function mazeChoose(kind){const st=G.dungeons.maze_treasure;if(!st?.active)return;st.path=st.path||[];st.path.push(kind);if(kind==='elite'){st.reward=(st.reward||0)+Math.max(700,Math.round(power()*.14));grantDungeonItem('玄鐵',2+Math.floor(Math.random()*3));if(Math.random()<.35){const n=randomSkillName(['楓葉花開','雪落無痕','鶴擊月華','無相密宗']);if(n)grantDungeonSkill(n)}hlog('迷宮：擊破精英怪，取得戰利品','lg-drop')}else if(kind==='chest'){const gain=1+Math.floor(Math.random()*3);st.reward=(st.reward||0)+gain*500;grantDungeonItem('五行寶石碎片',gain);if(Math.random()<.45)grantDungeonItem('精煉石',1);hlog('迷宮：開啟寶箱','lg-drop')}else{st.reward=(st.reward||0)+1000;grantDungeonItem('仙人指路符',1);if(Math.random()<.6){const n=randomSkillName(['楓葉花開','雪落無痕','鶴擊月華','無相密宗']);if(n)grantDungeonSkill(n)}hlog('迷宮：仙人指路，找到捷徑','lg-drop')}if(st.step>=3){st.active=false;st.runs=(st.runs||0)+1;st.best=Math.max(st.best,st.reward||0);G.player.spiritStone+=(st.reward||0);G.player.exp+=Math.round((st.reward||0)*.08);levelUp();toast(`迷宮完成：獎勵 ${fmt(st.reward||0)} 靈石`)}else st.step++;G.dungeons.maze_treasure=st;renderAll()}
function startSoulDungeon(manual=true){const st=dungeonToday('soul_instance');if(st.clears>=1)return toast('魂魄副本今日已完成');const floor=G.player.level>=100?2:1,lv=floor===2?120:80;st.clears=1;st.floor=floor;G.dungeons.soul_instance=st;startEncounter('聚魂怪',lv,'soul',manual,{dungeonKind:'soul_instance',dungeonData:{floor}});hlog(`魂魄副本：第 ${floor} 層`,'lg-drop')}
function resolveSoulDungeon(ctx){const floor=ctx.floor||1;grantDungeonItem('聚魂丹',floor===2?6:3);grantDungeonItem('魂魄晶髓',floor===2?3:1);grantDungeonItem('魂魄碎片',floor===2?8:4);if(Math.random()<(floor===2?.75:.35)){const n=randomSkillName(floor===2?['楓葉花開','雪落無痕','鶴擊月華','無相密宗','巨龍卷']:['桑折','枫舞','櫻飛','狂雷落']);if(n)grantDungeonSkill(n)}hlog(`魂魄副本完成第 ${floor} 層，魂魄材料入袋`,'lg-drop')}
function startMonsterValley(manual=true){if(G.player.level<80)return toast('聚妖谷需要 Lv.80');const cost=100000;if(G.player.spiritStone<cost)return toast('聚妖谷進入費用 100,000 靈石（離線版換算）');G.player.spiritStone-=cost;startEncounter('聚妖怪',120,'dungeon3',manual,{dungeonKind:'monster_valley',dungeonData:{waves:8}});hlog('聚妖谷：高密度連戰開始（8批妖怪）','lg-drop')}
function resolveMonsterValley(ctx){const waves=ctx.waves||8,st=G.dungeons.monster_valley||{runs:0,materials:0},iron=waves*(2+Math.floor(Math.random()*3));grantDungeonItem('玄鐵',iron);grantDungeonItem('精煉石',Math.max(2,Math.floor(waves/2)));if(Math.random()<.45)grantDungeonItem('打孔石',1);st.runs=(st.runs||0)+1;st.materials=(st.materials||0)+iron;G.dungeons.monster_valley=st;hlog(`聚妖谷：${waves}批聚妖怪，玄鐵 +${iron}`,'lg-drop')}
function startSandDemonLair(){if(G.player.level<90)return toast('沙魔巢穴需要 Lv.90');startEncounter('沙魔',110,'sand',true,{dungeonKind:'sand_demon_lair',dungeonData:{party:'單機三人助戰'},manualOnly:true,partyAt:Date.now()+1400});hlog('沙魔巢穴：手動團本開啟，禁止 AI 自動出招','lg-boss')}
function resolveSandDemonLair(ctx,total){const st=G.dungeons.sand_demon_lair||{runs:0,best:0};st.runs=(st.runs||0)+1;st.best=Math.max(st.best,total||0);grantDungeonItem('沙魔套裝圖紙',1);grantDungeonItem('沙魔靈珠',2);grantDungeonItem('魔王血晶',1);const goldNames=Object.keys(EQUIP_DB).filter(n=>EQUIP_DB[n]?.level>=80);if(goldNames.length){const n=goldNames[Math.floor(Math.random()*goldNames.length)];G.inventory[n]=(G.inventory[n]||0)+1}if(Math.random()<.35)grantDungeonItem('鬼魔血珀',1);G.dungeons.sand_demon_lair=st;hlog('沙魔巢穴通關：天品通用裝備與套裝圖紙入袋','lg-drop')}
function handleDungeonKill(ctx,total){if(!ctx)return;switch(ctx.kind){case 'five_elements_tower':resolveFiveElementsTower(ctx.data||{});break;case 'soul_instance':resolveSoulDungeon(ctx.data||{});break;case 'monster_valley':resolveMonsterValley(ctx.data||{});break;case 'sand_demon_lair':resolveSandDemonLair(ctx.data||{},total);break;}}
function dungeonEnter(id,manual=true){const d=DUNGEONS.find(x=>x.id===id);if(!d)return;if(G.player.level<d.need&&d.kind!=='soul')return toast(`需要 Lv.${d.need}`);if(d.kind==='tower')return startFiveElementsTower(manual);if(d.kind==='trial'){if(!manual)return;runTrialTemple();renderAll();return}if(d.kind==='maze'){if(!manual)return;return startMaze()}if(d.kind==='soul')return startSoulDungeon(manual);if(d.kind==='dense')return startMonsterValley(manual);if(d.kind==='sand')return startSandDemonLair()}
function renderBoss(){const maze=G.dungeons.maze_treasure||{},tower=G.dungeons.five_elements_tower||{floor:1,best:0},trial=G.dungeons.trial_temple||{best:0,runs:0},soul=dungeonToday('soul_instance'),dense=G.dungeons.monster_valley||{runs:0,materials:0},sand=G.dungeons.sand_demon_lair||{runs:0,best:0};return `<div class="card"><h2 class="title">Boss</h2><p class="desc">Boss 沿用天下無雙 3.0 的四大王與鬼王秘境／鬼王秘島脈絡；AI 可依掛機設定自動追擊，手動挑戰仍保留完整戰鬥畫面。</p>${BOSS_DB.map(b=>{const st=G.bossStatus[b.id]||{};return `<div class="map"><div class="line"><strong class="mapname">${b.name}</strong><span class="badge boss">${elementName(b.element)} Lv.${b.level}</span></div><div class="monster-meta">建議戰力 ${fmt(b.recommendPower)} · 已擊破 ${st.kills||0} · ${bossReady(b.id)?'可挑戰':'重生 '+bossRemain(b.id)+' 秒'}</div><button class="smallbtn ${bossReady(b.id)?'hot':''}" ${bossReady(b.id)?'':'disabled'} style="margin-top:5px" onclick="startBoss('${b.id}')">${bossReady(b.id)?'挑戰':'等待'}</button></div>`}).join('')}</div><div class="card"><h3 class="title">【3.0 資料副本】</h3><p class="desc">依官網「特色副本」清單與 3.0／近期資料脈絡整合為本離線版專用玩法；獎勵與副本機制採單機平衡設計。</p><div class="dungeon3-grid"><div class="dungeon3"><h4>五行妖閣</h4><div class="d3meta">層數 ${tower.floor}/10 · 歷史最高 ${tower.best||0} 層</div><div class="d3desc">逐層挑戰五行妖。每層提高生命與防禦，通關後推進下一層。</div><div class="d3reward">產出：高階五行靈石、五行妖魄、3.0神通秘籍</div><button class="smallbtn hot" style="margin-top:7px" onclick="dungeonEnter('five_elements_tower')">挑戰第 ${tower.floor} 層</button></div><div class="dungeon3"><h4>試煉神殿</h4><div class="d3meta">5 回合 · 最高傷害 ${fmt(trial.best||0)} · 挑戰 ${trial.runs||0} 次</div><div class="d3desc">使用4槽連招進行5回合極限輸出，依總傷害分級核發獎勵。</div><div class="d3reward">產出：試煉獎勵、靈石、五行資源、神通秘籍</div><button class="smallbtn hot" style="margin-top:7px" onclick="dungeonEnter('trial_temple')">開始 5 回合試煉</button></div><div class="dungeon3"><h4>迷宮尋寶</h4><div class="d3meta">三段路線 · ${maze.active?'進行中':'待出發'} · 歷史獎勵 ${fmt(maze.best||0)}</div><div class="d3desc">每段選擇精英怪、寶箱或仙人指路；不同路線帶來不同收益傾向。</div><div class="d3reward">產出：玄鐵、五行寶石碎片、材料、神通秘籍</div>${maze.active?`<div class="dungeon-note">第 ${maze.step||1}/3 段：選擇路線</div><div class="maze-path"><button class="smallbtn" onclick="mazeChoose('elite')">⚔ 精英怪</button><button class="smallbtn" onclick="mazeChoose('chest')">▣ 寶箱</button><button class="smallbtn" onclick="mazeChoose('guide')">✦ 仙人指路</button></div>`:`<button class="smallbtn hot" style="margin-top:7px" onclick="dungeonEnter('maze_treasure')">進入迷宮</button>`}</div><div class="dungeon3"><h4>魂魄副本</h4><div class="d3meta">今日 ${soul.clears||0}/1 · ${G.player.level>=100?'第2層（Lv.120）':'第1層（Lv.80）'}</div><div class="d3desc">以官方聚魂谷設定為基礎：Lv.100以上進第2層，其餘進第1層；每日一次。</div><div class="d3reward">產出：聚魂丹、魂魄晶髓、魂魄碎片、高級神通秘籍</div><button class="smallbtn ${soul.clears?'':'hot'}" style="margin-top:7px" ${soul.clears?'disabled':''} onclick="dungeonEnter('soul_instance')">${soul.clears?'今日已完成':'進入聚魂谷'}</button></div><div class="dungeon3"><h4>聚妖谷</h4><div class="d3meta">Lv.80 · 已進入 ${dense.runs||0} 次 · 累計玄鐵 ${dense.materials||0}</div><div class="d3desc">高密度連戰8批聚妖怪；參考官方聚妖谷 Lv.80以上與全天開放方向，本版改用離線資源成本。</div><div class="d3reward">產出：大量玄鐵、精煉石、打孔石等裝備分解材料</div><button class="smallbtn hot" style="margin-top:7px" onclick="dungeonEnter('monster_valley')">進入聚妖谷 · 100,000靈石</button></div><div class="dungeon3"><h4>沙魔巢穴</h4><div class="d3meta">Lv.90 · 單機團本 · 已通關 ${sand.runs||0} 次</div><div class="d3desc">玩家＋三人助戰的高難度團本。保留近期官方「不可開啟自動打怪模式」限制，必須手動操作4槽連招。</div><div class="d3reward">產出：天品通用裝備、沙魔套裝圖紙、沙魔靈珠、稀有血珀材料</div><button class="smallbtn danger" style="margin-top:7px" onclick="dungeonEnter('sand_demon_lair')">手動挑戰沙魔巢穴</button></div></div></div>`}
function renderAI(){const a=G.auto,c=classData(),guide=officialGuide(),target=battle?.active?battle.enemy:null;const bossRows=BOSS_DB.map(b=>{const st=G.bossStatus[b.id]||{};return `<div class="map"><div class="line"><strong class="mapname">${b.name}</strong><span class="badge boss">${elementName(b.element)} Lv.${b.level}</span></div><div class="monster-meta">已擊破 ${st.kills||0} · ${bossReady(b.id)?'AI可追擊':'重生中 '+bossRemain(b.id)+' 秒'}</div></div>`}).join('');return `<div class="card settings"><h2 class="title">✦ 智能掛機</h2><p class="desc">這裡取代原本的 Boss 選單。依官方「內掛」概念，由 AI 統一處理尋怪、戰鬥、選招、吃藥、推圖、掉寶與 Boss 追擊；玩家不需要手動按升級。</p><div class="field"><span>智能掛機總開關</span><input type="checkbox" ${a.enabled?'checked':''} onchange="setAuto('enabled',this.checked)"></div><div class="field"><span>AI 自動選招</span><input type="checkbox" ${a.autoSkill?'checked':''} onchange="setAuto('autoSkill',this.checked)"></div><div class="field"><span>AI 自動吃丹</span><input type="checkbox" ${a.autoPotion?'checked':''} onchange="setAuto('autoPotion',this.checked)"></div><div class="field"><span>HP 低於</span><input type="number" value="${Math.round(a.hpThreshold*100)}" min="10" max="90" onchange="setAuto('hpThreshold',this.value/100)"><b>%</b></div><div class="field"><span>MP 低於</span><input type="number" value="${Math.round(a.mpThreshold*100)}" min="10" max="90" onchange="setAuto('mpThreshold',this.value/100)"><b>%</b></div><div class="field"><span>AI 自動推進江湖</span><input type="checkbox" ${a.autoAdvance?'checked':''} onchange="setAuto('autoAdvance',this.checked)"></div><div class="field"><span>AI 自動副本</span><input type="checkbox" ${a.autoDungeon?'checked':''} onchange="setAuto('autoDungeon',this.checked)"></div><div class="field"><span>AI 自動追擊 Boss</span><input type="checkbox" ${a.autoBoss?'checked':''} onchange="setAuto('autoBoss',this.checked)"></div><div class="field"><span>Boss 戰力門檻</span><input type="checkbox" ${a.bossGate?'checked':''} onchange="setAuto('bossGate',this.checked)"></div><div class="field"><span>戰鬥模式</span><select onchange="setAuto('mode',this.value)"><option value="balanced" ${a.mode==='balanced'?'selected':''}>平衡掛機</option><option value="exp" ${a.mode==='exp'?'selected':''}>優先經驗</option><option value="drop" ${a.mode==='drop'?'selected':''}>優先掉寶</option><option value="boss" ${a.mode==='boss'?'selected':''}>Boss優先</option></select></div><div class="field"><span>五行偏好</span><select onchange="setAuto('elementPref',this.value)"><option value="auto" ${a.elementPref==='auto'?'selected':''}>AI選克制</option>${['metal','wood','water','fire','earth'].map(k=>`<option value="${k}" ${a.elementPref===k?'selected':''}>${FIVE[k].name}</option>`).join('')}</select></div></div><div class="card"><h3 class="title">AI 目前決策</h3><div class="feature-list"><div><b>角色：</b>${c?G.player.classKey:'未建立'} · Lv.${G.player.level}</div><div><b>狩獵建議：</b>${guide.areas.join('、')}</div><div><b>官方節奏：</b>${guide.note}</div><div><b>目前目標：</b>${target?target.name+' Lv.'+target.level:'AI 搜尋中'}</div><div><b>自動升級：</b>經驗達標立即升級並取得天賦點，不再提供手動「升級」按鈕。</div></div><div class="row" style="margin-top:8px"><button class="smallbtn hot" onclick="goPanel('inventory')">手動配裝</button><button class="smallbtn" onclick="goPanel('character')">查看角色</button></div></div><div class="card"><h3 class="title">Boss 智能追擊</h3><p class="desc">Boss 不再獨立佔用左側選單；AI 會依戰力門檻、Boss 重生狀態與目前模式自動決定是否追擊。</p><div class="maplist">${bossRows}</div></div><div class="card"><h3 class="title">官方內掛取向</h3><p class="desc">官方資料區把「內掛系統」與自動戰鬥列為特色系統；本單機版將其集中為一個 AI 入口，並串起怪物、掉寶、裝備與 Boss。高階裝備仍依怪物資料取得，不因商店而提前售出。</p></div>`} 
function setScreenMode(mode){document.body.classList.remove('screen-auto','screen-portrait','screen-pc');document.body.classList.add('screen-'+mode);G.setting.screenMode=mode;save(true);toast(mode==='portrait'?'已切換 9:16 手機全螢幕':mode==='pc'?'已切換 PC 16:9 全螢幕':'已切換自動尺寸');renderAll()}
function toggleFullscreen(){if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().then(()=>toast('已進入全螢幕')).catch(()=>toast('瀏覽器未允許全螢幕'))}else{document.exitFullscreen?.().then(()=>toast('已退出全螢幕')).catch(()=>{})}}
function applyScreenMode(){const m=G.setting.screenMode||'auto';document.body.classList.remove('screen-auto','screen-portrait','screen-pc');document.body.classList.add('screen-'+m)}
function logoutGame(){save(true);sessionStorage.setItem('txws_logout','1');location.reload()}
function openUpdateMenu(){$('updateModal')?.classList.add('show')}
function closeUpdateMenu(){$('updateModal')?.classList.remove('show')}
function renderSystem(){const a=G.auto;const mode=G.setting.screenMode||'auto';return `<div class="card settings"><h2 class="title">智能掛機</h2><div class="field"><span>自動戰鬥</span><input type="checkbox" ${a.enabled?'checked':''} onchange="setAuto('enabled',this.checked)"></div><div class="field"><span>自動選招</span><input type="checkbox" ${a.autoSkill?'checked':''} onchange="setAuto('autoSkill',this.checked)"></div><div class="field"><span>自動吃丹</span><input type="checkbox" ${a.autoPotion?'checked':''} onchange="setAuto('autoPotion',this.checked)"></div><div class="field"><span>HP低於</span><input type="number" value="${Math.round(a.hpThreshold*100)}" min="10" max="90" onchange="setAuto('hpThreshold',this.value/100)"><b>%</b></div><div class="field"><span>MP低於</span><input type="number" value="${Math.round(a.mpThreshold*100)}" min="10" max="90" onchange="setAuto('mpThreshold',this.value/100)"><b>%</b></div><div class="field"><span>自動推圖</span><input type="checkbox" ${a.autoAdvance?'checked':''} onchange="setAuto('autoAdvance',this.checked)"></div><div class="field"><span>自動副本</span><input type="checkbox" ${a.autoDungeon?'checked':''} onchange="setAuto('autoDungeon',this.checked)"></div><div class="field"><span>自動追 Boss</span><input type="checkbox" ${a.autoBoss?'checked':''} onchange="setAuto('autoBoss',this.checked)"></div><div class="field"><span>Boss 戰力門檻</span><input type="checkbox" ${a.bossGate?'checked':''} onchange="setAuto('bossGate',this.checked)"></div><div class="field"><span>技能五行偏好</span><select onchange="setAuto('elementPref',this.value)"><option value="auto" ${a.elementPref==='auto'?'selected':''}>AI 依敵人克制</option>${['metal','wood','water','fire','earth'].map(k=>`<option value="${k}" ${a.elementPref===k?'selected':''}>${FIVE[k].name}</option>`).join('')}</select></div></div><div class="card settings"><h2 class="title">畫面設定</h2><p class="desc">依裝置切換顯示比例；全螢幕可配合瀏覽器使用。</p><div class="row" style="margin-top:8px"><button class="smallbtn ${mode==='portrait'?'hot':''}" onclick="setScreenMode('portrait')">📱 手機 9:16</button><button class="smallbtn ${mode==='pc'?'hot':''}" onclick="setScreenMode('pc')">🖥️ PC 16:9</button><button class="smallbtn ${mode==='auto'?'hot':''}" onclick="setScreenMode('auto')">自動尺寸</button><button class="smallbtn" onclick="toggleFullscreen()">⛶ 全螢幕</button></div><p class="footer-note">目前：${mode==='portrait'?'手機 9:16':mode==='pc'?'PC 16:9':'自動尺寸'}</p></div><div class="card settings"><h2 class="title">角色／存檔</h2><div class="field"><span>道號</span><input id="nameInput" value="${G.name||'少俠'}" style="max-width:150px;background:#091317;color:#ddd;border:1px solid #59666a;border-radius:6px;padding:5px"></div><div class="row" style="margin-top:9px"><button class="smallbtn hot" onclick="openUpdateMenu()">更新選單</button><button class="smallbtn" onclick="save()">儲存</button><button class="smallbtn" onclick="exportSave()">匯出</button><button class="smallbtn" onclick="importSave()">匯入</button><button class="smallbtn danger" onclick="resetGame()">重置</button></div><p class="footer-note">V1.0.1 · 四門派創角 · 4槽自由連招 · 10部位裝備 · 3.0掉落 · 六大3.0資料副本 · 靈寵 · 天賦 · 自動戰鬥 · 離線收益</p></div>`}
function setAuto(k,v){if(k==='hpThreshold'||k==='mpThreshold')v=clamp(Number(v)||.2,.1,.9);G.auto[k]=v;if(k==='enabled')toast(v?'掛機啟動':'掛機停止');renderAll();save(true)}
function exportSave(){try{const s='TXWS510:'+btoa(unescape(encodeURIComponent(JSON.stringify(G))));prompt('複製以下存檔碼',s)}catch(e){toast('匯出失敗')}}
function importSave(){const s=prompt('貼上 TXWS520 / 舊版存檔碼');if(!s)return;try{G=JSON.parse(decodeURIComponent(escape(atob(s.replace(/^TXWS\d+:/,'')))));normalize();ensureStats();save(true);renderAll();toast('匯入成功')}catch(e){toast('存檔碼無效')}}
function resetGame(){if(confirm('確定重置天下無雙放置版存檔？')){try{localStorage.removeItem(SAVE_KEY)}catch(e){}location.reload()}}
function manualLevel(){const need=expNeed();if(G.player.exp<need)return toast('經驗未滿');levelUp();renderAll()}
function renderAll(){ensureStats();const views={home:renderHome,character:renderCharacter,hunt:renderWorld,inventory:renderInventory,skill:renderSkills,shop:renderShop,forge:renderForge,boss:renderBoss,system:renderSystem};$('content').innerHTML=(views[activePanel]||renderHome)();renderSide();syncHud();paintLog();const ni=$('nameInput');if(ni)ni.onchange=e=>{G.name=G.player.name=e.target.value.slice(0,16)||'少俠';syncHud();save(true)}}
function tickSecond(){ensureStats();const s=G.player.stats;if(!battle?.active){s.hp=Math.min(s.maxHp,s.hp+Math.max(1,Math.round(s.maxHp*.018)));s.mp=Math.min(s.maxMp,s.mp+Math.max(1,Math.round(s.maxMp*.03)));if(G.auto.autoAdvance)autoAdvance();if(G.auto.autoDungeon&&G.auto.enabled&&Math.random()<.018){const ready=DUNGEONS.filter(d=>G.player.level>=d.need&&['tower','trial','soul','dense'].includes(d.kind));if(ready.length&&Math.random()<.25)dungeonEnter(ready[Math.floor(Math.random()*ready.length)].id,false)}}else{s.mp=Math.min(s.maxMp,s.mp+Math.max(1,Math.round(s.maxMp*.008)))}levelUp();if(Date.now()%5000<1000)save(true);if(activePanel==='home'||activePanel==='boss')renderAll()}
function loop(){const now=Date.now();if(G.auto.enabled&&!G.selected){G.auto.enabled=false;return}if(activePanel==='home')return;if(battle?.active)combatTick(now);else if(G.auto.enabled&&!pendingBoss&&now>=nextSpawnAt)spawnEncounter();if(now-lastSecond>=1000){lastSecond=now;tickSecond()}syncHud();if(battle?.active&&$('battleScreen').classList.contains('show'))syncBattle()}
function manualStart(){const pick=pickWeighted(mapPool());if(pick)startEncounter(pick.name,pick.level,currentMap().id,true)}
function openClassScreen(){if($('createScreen'))return;const wrap=document.createElement('div');wrap.id='createScreen';wrap.className='start-screen';wrap.innerHTML=`<div class="start-box"><div class="start-title">天下無雙・放置版</div><div class="start-sub">建立角色：依官網四大職業命名與人物屬性開始。建立後可在「角色」查看10部位裝備，裝備由玩家自行手動搭配。</div><input id="startName" class="start-input" maxlength="16" placeholder="輸入角色名稱，例如：無雙劍客" value="${G.name||'少俠'}"><div class="class-grid">${Object.entries(CLASSES).map(([k,c])=>`<div class="class-card" data-class="${k}"><div class="class-ico">${c.icon}</div><div class="class-name">${k}</div><div class="class-desc">${c.desc}</div><div class="attr-pills">${Object.entries(c.attrs).map(([a,v])=>`<span class="attr-pill">${a} ${v}</span>`).join('')}</div><div class="class-desc" style="margin-top:7px;color:var(--gold)">武器：${c.weapon} · AI：${c.ai.focus}</div></div>`).join('')}</div><div class="row start-confirm"><button id="classConfirm" class="bigbtn" disabled>選擇職業後建立角色</button></div><div class="start-note">官網職業資料：劍宗、戟門、詭流、幻道；人物屬性固定為「狠、準、穩、快、智」。初始點數：劍宗狠12／準10／穩8／快25／智5；戟門狠20／準10／穩20／快5／智5；詭流狠5／準25／穩7／快8／智15；幻道狠2／準3／穩12／快12／智31。放置版提供職業取向資訊，裝備由玩家自行手動選擇。</div></div>`;document.body.appendChild(wrap);let sel=null;wrap.querySelectorAll('.class-card').forEach(card=>card.onclick=()=>{sel=card.dataset.class;wrap.querySelectorAll('.class-card').forEach(x=>x.classList.remove('sel'));card.classList.add('sel');$('classConfirm').disabled=false;$('classConfirm').textContent=`建立角色 · ${sel}`});$('classConfirm').onclick=()=>{if(sel)chooseClass(sel)}}
function openTeleport(){const body=$('tpBody');if(!body)return;body.innerHTML=`<div class="zone"><h4>地圖</h4>${maps.map(m=>`<div class="tp ${G.map===m.id?'here':''} ${mapUnlocked(m)?'':'lock'}"><div><b>${m.name}</b><div class="monster-meta">${m.zone} · Lv.${m.need}</div></div><button class="smallbtn" ${mapUnlocked(m)?'':'disabled'} onclick="moveMap('${m.id}');closeTeleport()">前往</button></div>`).join('')}</div>`;$('tpModal').classList.add('show')}
function closeTeleport(){$('tpModal').classList.remove('show')}
function updateStaticLabels(){document.title='天下無雙放置版';const p=document.querySelector('header .prealm');if(p)p.textContent='Lv.1';}
/* ---------- 啟動 ---------- */
$('tpBtn').onclick=openTeleport;$('homeBtn').onclick=returnHome;$('autoBtn').onclick=toggleAuto;$('settingsBtn').onclick=()=>goPanel('system');$('tpClose').onclick=closeTeleport;$('updateClose').onclick=closeUpdateMenu;$('inventoryDetailClose').onclick=closeInventoryDetail;$('battleClose').onclick=()=>{closeBattleScreen();renderAll()};
window.addEventListener('beforeunload',()=>save(true));window.addEventListener('pagehide',()=>save(true));
load();applyScreenMode();updateStaticLabels();
const wasLogout=sessionStorage.getItem('txws_logout')==='1';sessionStorage.removeItem('txws_logout');
(wasLogout||!G.selected)?openClassScreen():null;
ensureStats();refreshMarket();hlog('天下無雙放置陣列已就位：選職業後由智能掛機 AI 自動戰鬥、4槽連招與自動升級。','lg-sys');renderAll();mainLoop=setInterval(loop,TICK);
Object.assign(window,{toggleAuto,returnHome,openInventoryDetail,closeInventoryDetail,sellInventoryAll,enhanceSelected,enhanceSelectedToAvailable,renderAI,openTeleport,closeTeleport,moveMap,goPanel,renderAll,manualStart,startEncounter,startBoss,flee,manualAttack,manualSkill,manualPotion,equipSkill,buySkill,buyShopItem,buyEquip,forgeEnhance,forgeRefine,forgeSocket,forgeGem,forgeReroll,dismantleInventory,synthesize,enhanceEquippedAll,dungeonEnter,runTrialTemple,startMaze,mazeChoose,assignSkillSlot,save,exportSave,importSave,resetGame,setAuto,setScreenMode,toggleFullscreen,logoutGame,openUpdateMenu,closeUpdateMenu,equipItem,unequipItem,buyPet,equipPet,spendTalent,claimQuest});
</script>
</body></html>
