<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安裝(單機)版書籤工具安裝</title>
  <style>
    :root {
      --primary-color: #3498db;
      --primary-hover: #2980b9;
      --secondary-color: #2ecc71;
      --secondary-hover: #27ae60;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
      --subtext-color: #555555;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.8;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center; /* 內容統一置中對齊 */
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 25px;
      color: var(--text-color);
      border-bottom: 2px solid #f0f0f0;
      padding-bottom: 15px;
    }

    /* 上方下載按鈕區塊 */
    .button-group {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 35px;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      transition: all 0.2s ease-in-out;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .btn-primary {
      background-color: var(--primary-color);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background-color: var(--secondary-color);
    }

    .btn-secondary:hover {
      background-color: var(--secondary-hover);
      transform: translateY(-2px);
    }

    /* 文字內容區塊 */
    .content-section {
      margin-top: 25px;
    }

    h2 {
      font-size: 1.3rem;
      margin-top: 25px;
      margin-bottom: 12px;
      color: #34495e;
      position: relative;
    }

    p {
      font-size: 1.05rem;
      color: var(--subtext-color);
      margin-bottom: 8px;
    }

    .highlight {
      font-weight: bold;
      color: #e74c3c;
    }

    .step-box {
      background-color: #f1f8ff;
      border: 1px solid #c8e1ff;
      border-radius: 8px;
      padding: 15px;
      margin: 15px 0;
    }

    hr {
      border: 0;
      height: 1px;
      background: #eee;
      margin: 25px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>安裝(單機)版書籤工具安裝</h1>

    <!-- 頂部按鈕 -->
    <div class="button-group">
      <a href="https://mega.nz/file/6lwlhBKI#CuP6EDLuWDr5VWIVxIt2NpEWEndNppy-g--X0fU0Hec" class="btn btn-primary" target="_blank">下載一鍵修改</a>
      <a href="https://reurl.cc/mzvz9Y" class="btn btn-secondary" target="_blank">下載除錯工具</a>
    </div>

    <hr>

    <!-- 目前功能 -->
    <div class="content-section">
      <h2>目前功能</h2>
      <p>修改工具</p>
      <p>GM商店&各種神奇功能以及無界擂台</p>
      <p>賭場</p>
    </div>

    <hr>

    <!-- 使用方法 -->
    <div class="content-section">
      <h2>使用方法</h2>
      <p>下載後放到安裝版天堂同一個資料夾即可</p>

      <div class="step-box">
        <p><strong>不知道在哪邊？</strong></p>
        <p>桌面的天堂圖示按</p>
        <p><span class="highlight">右鍵 > 內容 > 開啟檔案位置</span></p>
      </div>

      <p>之後點兩下一鍵修改 即可</p>
      <br>
      <p style="font-size: 0.95rem; color: #7f8c8d;">※ 如果啟動失敗 請另外安裝除錯工具</p>
    </div>
  </div>

</body>
</html>
