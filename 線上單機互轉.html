<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>存檔格式轉換器（SIG1 ⇄ SIG2）</title>
<style>
  :root{
    --bg1:#0f1117; --bg2:#181b24; --bg3:#222634;
    --border:#2f3648; --text:#f1f3f9; --text3:#949fb5;
    --accent:#4d8dff; --accent-hover:#3b7ceb; --danger:#ff4d4f; --ok:#3ecf6e; --warn:#ffc107;
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--bg1); color:var(--text);
    font-family:"Microsoft JhengHei","PingFang TC",-apple-system,BlinkMacSystemFont,sans-serif;
    display:flex; justify-content:center; align-items:flex-start; padding:48px 16px;
  }
  .wrap{ width:100%; max-width:720px; background:var(--bg2); border:1px solid var(--border); border-radius:20px; padding:32px; box-shadow:var(--shadow); }
  
  /* 標題與說明 */
  .header-container { text-align: center; margin-bottom: 28px; }
  h1{ font-size:24px; margin:0 0 8px; font-weight: 700; letter-spacing: 0.5px; }
  .sub{ color:var(--text3); font-size:14px; margin:0 0 16px; line-height:1.6; }
  
  /* 說明區塊（前兩排白色、最後一排紅字，字體大小皆與標題同為 24px） */
  .custom-notice {
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    line-height: 1.5;
    background: rgba(255, 77, 79, 0.08);
    border: 1px dashed rgba(255, 77, 79, 0.3);
    padding: 16px;
    border-radius: 12px;
    margin-top: 16px;
    color: #ffffff; /* 前兩排預設白色 */
  }
  /* 將最後一句提醒獨立出來指定為紅字 */
  .custom-notice .danger-text {
    color: var(--danger);
  }

  /* 拖曳上傳區 */
  #dropZone{
    border:2px dashed var(--border); border-radius:14px; padding:40px 20px;
    text-align:center; cursor:pointer; background:var(--bg3);
    transition:all .2s ease;
  }
  #dropZone:hover { border-color: var(--accent); background: #1f2535; }
  #dropZone.drag{ border-color:var(--accent); background:#232d45; transform: scale(1.01); }
  #dropZone .icon{ font-size:40px; margin-bottom:12px; transition: transform 0.2s; }
  #dropZone:hover .icon { transform: translateY(-3px); }
  #dropZone .main{ font-size:16px; font-weight: 600; }
  #dropZone .hint{ color:var(--text3); font-size:12px; margin-top:8px; }
  #fileInput{ display:none; }

  /* 資訊欄 */
  .info{
    margin-top:20px; padding:16px 20px; border-radius:12px;
    background:var(--bg3); border:1px solid var(--border); font-size:14px; line-height:2.0;
  }
  .info .row{ display:flex; justify-content:space-between; border-bottom: 1px solid rgba(255,255,255,0.04); padding: 4px 0; }
  .info .row:last-child { border-bottom: none; }
  .info .row span:first-child{ color:var(--text3); }
  .badge{ display:inline-block; padding:2px 10px; border-radius:6px; font-size:12px; font-weight:bold; }
  .badge.sig1{ background:rgba(77,141,255,0.15); color:var(--accent); }
  .badge.sig2{ background:rgba(62,207,110,0.15); color:var(--ok); }

  /* 提示與按鈕 */
  .notice{
    margin-top:16px; padding:14px 16px; border-radius:12px; font-size:13px; line-height:1.7;
  }
  .notice.ok{ background:rgba(62,207,110,0.08); border:1px solid rgba(62,207,110,0.35); color:var(--ok); }
  .notice.warn{ background:rgba(255,193,7,0.08); border:1px solid rgba(255,193,7,0.4); color:var(--warn); font-weight:bold; }

  .btn{
    margin-top:16px; width:100%; padding:14px; border-radius:12px; border:none;
    background:var(--accent); color:#fff; font-size:16px; font-weight:bold; cursor:pointer;
    box-shadow: 0 4px 12px rgba(77, 141, 255, 0.3);
    transition: background 0.2s, transform 0.1s, filter 0.2s;
  }
  .btn:hover{ background: var(--accent-hover); filter:brightness(1.05); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn:disabled{ background:var(--bg3); color:var(--text3); cursor:not-allowed; box-shadow: none; }

  /* 記錄日誌 */
  #log{ margin-top:20px; display:flex; flex-direction:column; gap:8px; }
  .line{ padding:10px 14px; border-radius:10px; font-size:13px; line-height:1.6; background:var(--bg3); border:1px solid var(--border); }
  .line.ok{ border-color:rgba(62,207,110,0.4); color:var(--ok); }
  .line.err{ border-color:rgba(255,77,79,0.4); color:var(--danger); }
  .mono{ font-family:monospace; background: rgba(0,0,0,0.2); padding: 2px 6px; border-radius: 4px; }
</style>
<script>addEventListener('load',function(){if(location.protocol==='file:')return;var s=document.createElement('script');s.async=true;s.src='https://gc.zgo.at/count.js';s.setAttribute('data-goatcounter','https://taiwangame2.goatcounter.com/count');document.head.appendChild(s);});</script>
</head>
<body>
<div class="wrap">
  <div class="header-container">
    <h1>🔄 存檔格式轉換器</h1>
    <p class="sub">
      在「SIG1（網頁／手機版）」跟「SIG2（桌面版）」兩種存檔格式之間雙向無縫轉換。
    </p>
    <!-- 前兩排白色、最後一排紅字，字體皆為 24px -->
    <div class="custom-notice">
      幫你把網頁版存檔跟安裝版存檔互相轉換<br><br>
      只要把檔案拖到框內或是點一下就可以上傳檔案修改<br><br>
      <span class="danger-text">請勿使用賴直接開啟 將網址複製到其他瀏覽器在使用</span>
    </div>
  </div>

  <div id="dropZone">
    <div class="icon">📂</div>
    <div class="main">將存檔拖曳到這裡，或點擊選取檔案</div>
    <div class="hint">支援 SIG1: 開頭（網頁/手機版）與 SIG2: 開頭（桌面版）存檔</div>
    <input type="file" id="fileInput" accept=".json,.txt,application/json,text/plain">
  </div>

  <div id="infoArea"></div>
  <div id="actionArea"></div>
  <div id="log"></div>
</div>

<script>
// ════════════════════════════════════════════════
//  通用工具：Base36 轉碼
// ════════════════════════════════════════════════
function toBase36(num) {
  return Number(num).toString(36);
}

// ════════════════════════════════════════════════
//  SIG1 簽章演算法（網頁／手機版）
// ════════════════════════════════════════════════
function _seedHash(str){
  str = String(str);
  let h = 1779033703 ^ str.length;
  for(let i = 0; i < str.length; i++){
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  h = Math.imul(h ^ (h >>> 16), 2246822507);
  h = Math.imul(h ^ (h >>> 13), 3266489909);
  return (h ^ (h >>> 16)) >>> 0;
}
const _SAVE_SALT = 'fb5#9c3a7e1d-save-integrity-salt-do-not-edit#a1b2c3';
function _signSaveV1(s){
  let a = _seedHash(_SAVE_SALT + '::' + s);
  let b = _seedHash(s + '::' + _SAVE_SALT + '::' + a);
  return (a >>> 0).toString(36) + '.' + (b >>> 0).toString(36) + '.' + (s.length).toString(36);
}
function buildSIG1(payloadStr){
  return 'SIG1:' + _signSaveV1(payloadStr) + ':' + payloadStr;
}
function parseSIG1(raw){
  const str = String(raw).trim();
  if(str.slice(0,5) !== 'SIG1:') throw new Error('不是 SIG1 格式');
  const rest = str.slice(5);
  const i = rest.indexOf(':');
  if(i < 0) throw new Error('SIG1 格式毀損');
  const sig = rest.slice(0, i);
  const payload = rest.slice(i + 1);
  const ok = _signSaveV1(payload) === sig;
  return { payload: JSON.parse(payload), verified: ok };
}

// ════════════════════════════════════════════════
//  SIG2 簽章演算法（桌面版 HMAC-SHA256）
// ════════════════════════════════════════════════
const SIG2_KEY_BYTES = new Uint8Array([
  157, 103, 50, 228, 15, 138, 177, 89, 198, 36,
  119, 211, 65, 174, 149, 11, 94, 248, 19, 108,
  162, 57, 221, 112, 24, 203, 79, 134, 241, 45,
  168, 83
]);

const SIG2_DOMAIN_BYTES = new Uint8Array([
  73, 100, 108, 101, 76, 105, 110, 101, 97, 103, 101, 46,
  68, 101, 115, 107, 116, 111, 112, 46,
  83, 97, 118, 101, 46,
  83, 73, 71, 50, 0
]);

async function signDesktopSave(payloadStr) {
  const encoder = new TextEncoder();
  const payloadBytes = encoder.encode(payloadStr);

  const cryptoKey = await crypto.subtle.importKey(
    'raw',
    SIG2_KEY_BYTES,
    { name: 'HMAC', hash: 'SHA-256' },
    false,
    ['sign']
  );

  const combinedBytes = new Uint8Array(SIG2_DOMAIN_BYTES.length + payloadBytes.length);
  combinedBytes.set(SIG2_DOMAIN_BYTES, 0);
  combinedBytes.set(payloadBytes, SIG2_DOMAIN_BYTES.length);

  const signatureBuffer = await crypto.subtle.sign('HMAC', cryptoKey, combinedBytes);
  const signatureBytes = new Uint8Array(signatureBuffer);

  let binaryString = '';
  for (let i = 0; i < signatureBytes.length; i++) {
    binaryString += String.fromCharCode(signatureBytes[i]);
  }
  const base64 = btoa(binaryString);
  const base64Url = base64.replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');

  return 'SIG2:' + base64Url + '.' + toBase36(payloadStr.length) + ':' + payloadStr;
}

async function verifySIG2(raw) {
  const str = String(raw).trim();
  if(str.slice(0,5) !== 'SIG2:') throw new Error('不是 SIG2 格式');
  const rest = str.slice(5);
  const i = rest.indexOf(':');
  if(i < 0) throw new Error('SIG2 格式毀損');
  
  const sigPart = rest.slice(0, i);
  const payloadStr = rest.slice(i + 1);

  const expectedSIG2 = await signDesktopSave(payloadStr);
  const expectedSigPart = expectedSIG2.slice(5, expectedSIG2.indexOf(':'));

  const verified = (sigPart === expectedSigPart);
  return { payload: JSON.parse(payloadStr), verified };
}

function parseSIG2(raw){
  const str = String(raw).trim();
  if(str.slice(0,5) !== 'SIG2:') throw new Error('不是 SIG2 格式');
  const rest = str.slice(5);
  const i = rest.indexOf(':');
  if(i < 0) throw new Error('SIG2 格式毀損');
  const payloadStr = rest.slice(i + 1);
  return { payload: JSON.parse(payloadStr) };
}

// ════════════════════════════════════════════════
//  UI 控制邏輯
// ════════════════════════════════════════════════
const dropZone   = document.getElementById('dropZone');
const fileInput  = document.getElementById('fileInput');
const infoArea   = document.getElementById('infoArea');
const actionArea = document.getElementById('actionArea');
const logEl      = document.getElementById('log');

let _loaded = null;

function addLog(msg, cls){
  const div = document.createElement('div');
  div.className = 'line ' + (cls || '');
  div.innerHTML = msg;
  logEl.prepend(div);
}

dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => { if(e.target.files[0]) handleFile(e.target.files[0]); fileInput.value=''; });
['dragenter','dragover'].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('drag'); }));
['dragleave','drop'].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('drag'); }));
dropZone.addEventListener('drop', e => { const f = e.dataTransfer.files && e.dataTransfer.files[0]; if(f) handleFile(f); });

async function handleFile(file){
  infoArea.innerHTML = ''; actionArea.innerHTML = '';
  let text;
  try{ text = await file.text(); }
  catch(err){ addLog('❌ 讀取檔案失敗：' + err.message, 'err'); return; }

  const trimmed = text.trim();
  try{
    if(trimmed.slice(0,5) === 'SIG1:'){
      const { payload, verified } = parseSIG1(trimmed);
      _loaded = { format:'SIG1', save: payload, envelope: null, origName: file.name };
      renderInfo(payload, 'SIG1', verified, null);
      addLog(`📄 已載入 <span class="mono">${file.name}</span>（SIG1 格式，簽章${verified?'驗證通過':'不符但仍載入'}）`, verified?'ok':'');
    } else if(trimmed.slice(0,5) === 'SIG2:'){
      const { payload, verified } = await verifySIG2(trimmed);
      _loaded = { format:'SIG2', save: payload.save, envelope: payload, origName: file.name };
      renderInfo(payload.save, 'SIG2', verified, payload);
      addLog(`📄 已載入 <span class="mono">${file.name}</span>（SIG2 格式，簽章${verified?'驗證通過 (HMAC-SHA256)':'不符但仍載入'}）`, verified?'ok':'');
    } else {
      addLog('❌ 無法辨識的格式，開頭必須是 SIG1: 或 SIG2:', 'err');
      return;
    }
  }catch(err){
    addLog('❌ 解析失敗：' + err.message, 'err');
    return;
  }
  renderActions();
}

function renderInfo(save, fmt, verified, envelope){
  const p = save.p || {};
  const badge = fmt === 'SIG1' ? '<span class="badge sig1">SIG1 網頁/手機版</span>' : '<span class="badge sig2">SIG2 桌面版</span>';
  let html = `<div class="info">
    <div class="row"><span>格式</span><span>${badge}</span></div>
    <div class="row"><span>角色名稱</span><span>${p.name || '(未命名)'}</span></div>
    <div class="row"><span>職業</span><span>${p.cls || '-'}</span></div>
    <div class="row"><span>等級</span><span>${p.lv ?? '-'}</span></div>
    <div class="row"><span>身分證(enSeed)</span><span class="mono">${p.enSeed || '-'}</span></div>`;
  if(envelope){
    html += `<div class="row"><span>桌面版版本</span><span>${envelope.version || '-'}</span></div>
    <div class="row"><span>匯出時間</span><span>${envelope.exportedAt || '-'}</span></div>`;
  }
  html += `</div>`;
  infoArea.innerHTML = html;
}

function renderActions(){
  if(!_loaded) return;
  if(_loaded.format === 'SIG1'){
    actionArea.innerHTML = `
      <div class="notice ok">✅ 轉換方向：SIG1 → SIG2（網頁/手機版 → 桌面版）。內層存檔骨架完全相容，會打包上桌面版信封並以真正的金鑰重新計算 HMAC-SHA256 簽章，產生的檔案可在桌面版順利載入。</div>
      <button class="btn" onclick="doConvert('toSIG2')">轉換為 SIG2（桌面版格式）</button>
    `;
  } else {
    actionArea.innerHTML = `
      <div class="notice ok">✅ 轉換方向：SIG2 → SIG1（桌面版 → 網頁/手機版）。會拆掉桌面版信封，用網頁版簽章演算法重新簽名，產生的檔案可以正常通過網頁/手機版的簽章驗證。</div>
      <button class="btn" onclick="doConvert('toSIG1')">轉換為 SIG1（網頁/手機版格式）</button>
    `;
  }
}

function splitFileName(name){
  const dot = name.lastIndexOf('.');
  if(dot <= 0) return { base:name, ext:'' };
  return { base:name.slice(0,dot), ext:name.slice(dot) };
}

async function doConvert(direction){
  if(!_loaded) return;
  const { base, ext } = splitFileName(_loaded.origName);
  const outExt = ext || '.json';

  if(direction === 'toSIG1'){
    const payload = JSON.stringify(_loaded.save);
    const signed = buildSIG1(payload);
    downloadText(signed, `${base}_轉為SIG1${outExt}`);
    addLog(`✅ 已轉換並下載：<span class="mono">${base}_轉為SIG1${outExt}</span>（合法 SIG1 簽章，可正常匯入網頁/手機版）`, 'ok');
  } else {
    const envelope = {
      format: 'idle-lineage-desktop-save',
      schema: 1,
      version: (_loaded.envelope && _loaded.envelope.version) || '3.8.19',
      exportedAt: new Date().toISOString(),
      save: _loaded.save,
    };
    const payload = JSON.stringify(envelope);
    const signed = await signDesktopSave(payload);
    downloadText(signed, `${base}_轉為SIG2${outExt}`);
    addLog(`✅ 已轉換並下載：<span class="mono">${base}_轉為SIG2${outExt}</span>（以真實金鑰生成合法 SIG2 簽章，可在桌面版正常載入）`, 'ok');
  }
}

function downloadText(content, filename){
  const blob = new Blob([content], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
