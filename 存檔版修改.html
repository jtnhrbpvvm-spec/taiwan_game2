<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>開始遊戲_v_0_951_專用存檔功能注入器_完整版</title>
<style>
body{font-family:Arial,sans-serif;max-width:1000px;margin:auto;padding:20px}
button{padding:10px 16px;margin:5px}
#log{border:1px solid #ccc;padding:10px;height:220px;overflow:auto;white-space:pre-wrap}
</style>
</head>
<body>
<h1>開始遊戲_v_0_951 專用存檔功能注入器（完整版）</h1>
<p>固定支援存檔鍵：lineage_idle_save</p>

<input type="file" id="fileInput" accept=".html">
<button onclick="inject()">開始修改</button>
<button id="downloadBtn" disabled>下載修改版</button>

<div id="log"></div>

<script>
let modifiedHtml="";
let originalName="";

function log(msg){
 document.getElementById("log").textContent += msg + "\n";
}

function buildInjection(){
return `
<style>
#saveToolsWrap{position:fixed;top:10px;right:10px;z-index:99999999;}
#saveToolsMenu{display:none;background:#fff;border:1px solid #ccc;padding:8px;box-shadow:0 2px 8px rgba(0,0,0,.2);}
#saveToolsToggle{font-size:38px;width:72px;height:72px;border-radius:50%;cursor:pointer;}
.saveToolBtn{
background:#fff;color:#000;border:2px solid #444;border-radius:6px;
padding:8px 12px;font-weight:bold;cursor:pointer;margin:3px;
}
#saveTextArea{width:340px;height:140px;display:block;margin-top:8px;}
</style>

<div id="saveToolsWrap">
<button id="saveToolsToggle">💾</button>
<div id="saveToolsMenu">
<button id="exportSaveBtn" class="saveToolBtn">匯出存檔</button>
<button id="importSaveBtn" class="saveToolBtn">匯入存檔</button>
<button id="exportTextBtn" class="saveToolBtn">以純文字匯出</button>
<button id="importTextBtn" class="saveToolBtn">以純文字匯入</button>
<input type="file" id="importSaveFile" accept=".json" style="display:none">
<textarea id="saveTextArea" placeholder="可在此貼上或複製存檔文字"></textarea>
</div>
</div>

<script>
(function(){
const SAVE_KEY='lineage_idle_save';

function getSave(){
 return localStorage.getItem(SAVE_KEY);
}

document.getElementById('saveToolsToggle').addEventListener('click',()=>{
 const m=document.getElementById('saveToolsMenu');
 m.style.display=(m.style.display==='block')?'none':'block';
});

document.getElementById('exportSaveBtn').addEventListener('click',()=>{

 if(!confirm('請先至商店與設置內存檔後再匯出')) return;

 const raw=getSave();
 if(!raw){alert('找不到存檔');return;}

 const blob=new Blob([raw],{type:'application/json'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='lineage_idle_save.json';
 a.click();
});

document.getElementById('importSaveBtn').addEventListener('click',()=>{
 document.getElementById('importSaveFile').click();
});

document.getElementById('importSaveFile').addEventListener('change',(e)=>{

 const file=e.target.files[0];
 if(!file) return;

 const reader=new FileReader();

 reader.onload=()=>{
   try{
      JSON.parse(reader.result);
      localStorage.setItem(SAVE_KEY,reader.result);

      if(confirm('匯入完成，按確定重新整理')){
         setTimeout(()=>location.reload(),300);
      }
   }catch(err){
      alert('存檔格式錯誤');
   }
 };

 reader.readAsText(file);
});

document.getElementById('exportTextBtn').addEventListener('click',async ()=>{

 if(!confirm('請先至商店與設置內存檔後再匯出')) return;

 const raw=getSave();
 if(!raw){alert('找不到存檔');return;}

 const ta=document.getElementById('saveTextArea');
 ta.value=raw;
 ta.focus();
 ta.select();
 ta.setSelectionRange(0,ta.value.length);

 try{
   await navigator.clipboard.writeText(raw);
   alert('存檔文字已顯示於文字框\\n\\n已自動全選並複製到剪貼簿。');
 }catch(e){
   alert('存檔文字已全選，請按 Ctrl+C 複製。');
 }
});

document.getElementById('importTextBtn').addEventListener('click',()=>{

 const txt=document.getElementById('saveTextArea').value.trim();

 if(!txt){
   alert('請先貼上存檔文字');
   return;
 }

 try{
   JSON.parse(txt);
   localStorage.setItem(SAVE_KEY,txt);

   if(confirm('匯入完成，按確定重新整理')){
      setTimeout(()=>location.reload(),300);
   }
 }catch(err){
   alert('存檔文字格式錯誤');
 }
});

})();
<\/script>
`;
}

async function inject(){
 const file=document.getElementById('fileInput').files[0];
 if(!file){alert('請選擇HTML');return;}

 originalName=file.name;
 let html=await file.text();

 const code=buildInjection();

 if(html.includes('</body>')){
   html=html.replace('</body>',code+'\\n</body>');
 }else{
   html+=code;
 }

 modifiedHtml=html;
 document.getElementById('downloadBtn').disabled=false;
 log('注入完成，可下載修改版。');
}

document.getElementById('downloadBtn').addEventListener('click',()=>{
 const blob=new Blob([modifiedHtml],{type:'text/html'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download=originalName.replace('.html','_存檔版.html');
 a.click();
});
</script>
</body>
</html>
