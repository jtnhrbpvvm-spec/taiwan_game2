<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>放置天堂 存檔修改 · 入口</title>
<style>
:root{
  --bg:#0f1117; --bg2:#1a1d27; --bg3:#22263a; --bg4:#2a2f47;
  --border:#2e3250; --accent:#5c6bc0; --accent2:#7986cb;
  --text:#e8eaf6; --text2:#9fa8da; --text3:#555a7a;
  --dark:#8b5cf6; --dark2:#a78bfa;   /* 暗黑版專用點綴 */
}
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
body{
  background:
    radial-gradient(1100px 620px at 50% -8%, rgba(92,107,192,.18), transparent 60%),
    linear-gradient(180deg, #0f1117 0%, #12141d 55%, #0d0f16 100%);
  color:var(--text);
  font-family:'Segoe UI', system-ui, -apple-system, "Noto Sans TC", sans-serif;
  min-height:100%;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:40px 20px; gap:34px;
}

/* 標題 */
.head{ text-align:center; }
.eyebrow{
  font-size:12px; letter-spacing:.32em; text-transform:uppercase;
  color:var(--text3); margin-bottom:12px;
}
.title{
  font-size:clamp(26px, 5vw, 42px); font-weight:800; letter-spacing:.01em;
  color:var(--text);
}
.title .accent{ color:var(--accent2); }
.subtitle{ margin-top:10px; font-size:14px; color:var(--text2); }

/* 兩顆入口按鈕 */
.gate{
  display:flex; gap:26px; flex-wrap:wrap; justify-content:center;
  width:100%; max-width:760px;
}
.portal-btn{
  --c:var(--accent); --c2:var(--accent2);
  flex:1 1 300px; min-width:260px;
  text-decoration:none; color:var(--text);
  background:linear-gradient(180deg, var(--bg3), var(--bg2));
  border:1px solid var(--border); border-radius:16px;
  padding:34px 26px 30px;
  display:flex; flex-direction:column; align-items:center; gap:12px;
  position:relative; overflow:hidden;
  transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
/* 上緣光條，用各自的主色 */
.portal-btn::before{
  content:""; position:absolute; inset:0 0 auto 0; height:3px;
  background:linear-gradient(90deg, transparent, var(--c), transparent);
  opacity:.7;
}
.portal-btn .icon{
  font-size:44px; line-height:1;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.4));
}
.portal-btn .name{ font-size:24px; font-weight:800; letter-spacing:.02em; }
.portal-btn .hint{ font-size:13px; color:var(--text3); }
.portal-btn .go{
  margin-top:6px; font-size:12px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--c2); display:flex; align-items:center; gap:6px;
}
.portal-btn:hover, .portal-btn:focus-visible{
  transform:translateY(-4px);
  border-color:var(--c);
  box-shadow:0 16px 44px rgba(0,0,0,.5), 0 0 0 1px var(--c) inset,
             0 0 40px -8px var(--c);
  outline:none;
}
.portal-btn:hover .name, .portal-btn:focus-visible .name{ color:#fff; }

/* 加掛版：靛藍（沿用工具主色）；暗黑版：暗紫 */
.portal-btn.addon{ --c:var(--accent);  --c2:var(--accent2); }
.portal-btn.dark {
  --c:var(--dark); --c2:var(--dark2);
  background:linear-gradient(180deg, #191723, #121019);
}

.foot{ font-size:12px; color:var(--text3); text-align:center; }

@media (max-width:560px){
  .gate{ gap:16px; }
  .portal-btn{ flex-basis:100%; padding:28px 22px; }
}
@media (prefers-reduced-motion:reduce){
  .portal-btn{ transition:none; }
  .portal-btn:hover, .portal-btn:focus-visible{ transform:none; }
}
</style>
</head>
<body>

  <div class="head">
    <div class="eyebrow">放置天堂 IDLE LINEAGE</div>
    <h1 class="title">存檔修改 · <span class="accent">選擇版本</span></h1>
    <p class="subtitle">點選要開啟的存檔修改工具</p>
  </div>

  <nav class="gate">
    <a class="portal-btn addon"
       href="https://jtnhrbpvvm-spec.github.io/taiwan_game2/%E5%AD%98%E6%AA%94%E4%BF%AE%E6%94%B9_%E7%A7%8B%E7%8E%A5_%E5%8A%A0%E6%8E%9B%E7%89%88.html">
      <span class="icon" aria-hidden="true">🧩</span>
      <span class="name">秋玥／加掛版</span>
      <span class="hint">加掛版存檔工具</span>
      <span class="go">開啟 &rarr;</span>
    </a>

    <a class="portal-btn dark"
       href="https://jtnhrbpvvm-spec.github.io/taiwan_game2/%E5%AD%98%E6%AA%94%E4%BF%AE%E6%94%B9_%E6%9A%97%E9%BB%91%E7%89%88.html">
      <span class="icon" aria-hidden="true">🌑</span>
      <span class="name">暗黑版</span>
      <span class="hint">暗黑版存檔工具</span>
      <span class="go">開啟 &rarr;</span>
    </a>
  </nav>

  <div class="foot">選擇後將前往對應的存檔修改頁面</div>

</body>
</html>
